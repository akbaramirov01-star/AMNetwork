<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>TajBridge — Tajikistan–Germany Investment Bridge (Concept Preview)</title>
<meta name="description" content="TajBridge connects vetted Tajik businesses and high-potential sectors with German investors. Concept preview — Tajik, Russian, English, German.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@500;600;700;800&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#F5F2F7;
    --surface:#FFFFFF;
    --surface-2:#EFEAF3;
    --ink:#1E1B29;
    --ink-soft:#4B4658;
    --ink-faint:#7A7488;
    --line:#DCD5E4;
    --weft:#B8631A;
    --weft-strong:#E08A2D;
    --warp:#A83A66;
    --warp-strong:#C4477A;
    --steel:#4C6B8A;
    --steel-strong:#6B8CAE;
    --on-weft:#1E1408;
    --shadow: 0 1px 2px rgba(30,20,15,0.06), 0 8px 24px -8px rgba(30,20,15,0.12);
    --radius-card:14px;
    --radius-tag:5px;
    --radius-btn:10px;
    --maxw:1180px;
    --font-display:'Golos Text', 'Segoe UI', system-ui, sans-serif;
    --font-body:'Manrope', 'Segoe UI', system-ui, sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --ground:#15111F;
      --surface:#1C1830;
      --surface-2:#241E3B;
      --ink:#F3EFE8;
      --ink-soft:#C9C2D6;
      --ink-faint:#928BA3;
      --line:#332C4A;
      --weft:#F0A94E;
      --weft-strong:#E08A2D;
      --warp:#E06D9B;
      --warp-strong:#C4477A;
      --steel:#8FADCB;
      --steel-strong:#6B8CAE;
      --on-weft:#1E1408;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -10px rgba(0,0,0,0.55);
    }
  }
  :root[data-theme="dark"]{
    --ground:#15111F;
    --surface:#1C1830;
    --surface-2:#241E3B;
    --ink:#F3EFE8;
    --ink-soft:#C9C2D6;
    --ink-faint:#928BA3;
    --line:#332C4A;
    --weft:#F0A94E;
    --weft-strong:#E08A2D;
    --warp:#E06D9B;
    --warp-strong:#C4477A;
    --steel:#8FADCB;
    --steel-strong:#6B8CAE;
    --on-weft:#1E1408;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 32px -10px rgba(0,0,0,0.55);
  }

  *{box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  @media (prefers-reduced-motion: reduce){ html{scroll-behavior:auto;} *{animation-duration:0.001ms !important; animation-iteration-count:1 !important; transition-duration:0.001ms !important;} }

  body{
    margin:0;
    background:var(--ground);
    color:var(--ink);
    font-family:var(--font-body);
    font-size:16px;
    line-height:1.65;
    -webkit-font-smoothing:antialiased;
  }
  img,svg{display:block; max-width:100%;}
  a{color:inherit;}
  h1,h2,h3{font-family:var(--font-display); margin:0; text-wrap:balance; letter-spacing:-0.01em;}
  p{margin:0;}
  button{font-family:inherit; cursor:pointer;}
  .container{max-width:var(--maxw); margin:0 auto; padding:0 24px;}
  section{padding:96px 0;}
  @media (max-width:720px){ section{padding:64px 0;} }

  .eyebrow{
    display:inline-flex; align-items:center; gap:8px;
    font-size:0.78rem; font-weight:700; letter-spacing:0.09em; text-transform:uppercase;
    color:var(--weft); margin-bottom:14px;
  }
  .eyebrow::before{content:""; width:18px; height:2px; background:var(--weft-strong); display:inline-block;}
  h2.section-title{font-size:clamp(1.7rem,1rem + 2.6vw,2.4rem); font-weight:700;}
  .section-sub{color:var(--ink-soft); font-size:1.05rem; max-width:640px; margin-top:14px;}
  .section-head{margin-bottom:48px;}
  .section-head.center{text-align:center; margin-left:auto; margin-right:auto;}
  .section-head.center .section-sub{margin-left:auto; margin-right:auto;}

  /* reveal on scroll */
  .reveal{opacity:0; transform:translateY(22px); transition:opacity 0.7s ease, transform 0.7s ease;}
  .reveal.in{opacity:1; transform:translateY(0);}
  .reveal-stagger > *{opacity:0; transform:translateY(18px); transition:opacity 0.6s ease, transform 0.6s ease;}
  .reveal-stagger.in > *{opacity:1; transform:translateY(0);}
  .reveal-stagger.in > *:nth-child(1){transition-delay:0.03s;}
  .reveal-stagger.in > *:nth-child(2){transition-delay:0.09s;}
  .reveal-stagger.in > *:nth-child(3){transition-delay:0.15s;}
  .reveal-stagger.in > *:nth-child(4){transition-delay:0.21s;}
  .reveal-stagger.in > *:nth-child(5){transition-delay:0.27s;}
  .reveal-stagger.in > *:nth-child(6){transition-delay:0.33s;}

  /* ---------- Top demo ribbon ---------- */
  .demo-ribbon{
    background:var(--ink); color:var(--ground);
    font-size:0.82rem; text-align:center; padding:9px 16px;
    letter-spacing:0.01em;
  }
  .demo-ribbon strong{color:var(--weft-strong);}

  /* ---------- Header ---------- */
  header{
    position:sticky; top:0; z-index:50;
    background:color-mix(in srgb, var(--ground) 88%, transparent);
    backdrop-filter:blur(10px);
    border-bottom:1px solid transparent;
    transition:border-color 0.3s ease, box-shadow 0.3s ease;
  }
  header.scrolled{border-color:var(--line); box-shadow:0 4px 20px -10px rgba(0,0,0,0.25);}
  .nav-row{display:flex; align-items:center; justify-content:space-between; gap:20px; padding:16px 0;}
  .brand{display:flex; align-items:center; gap:10px; font-family:var(--font-display); font-weight:800; font-size:1.15rem;}
  .brand-mark{width:34px; height:34px;}
  nav.primary{display:flex; gap:28px; align-items:center;}
  nav.primary a{font-weight:600; font-size:0.94rem; color:var(--ink-soft); text-decoration:none; transition:color 0.2s ease;}
  nav.primary a:hover{color:var(--ink);}
  .nav-actions{display:flex; align-items:center; gap:12px;}

  .lang-switch{position:relative;}
  .lang-btn{
    display:flex; align-items:center; gap:6px;
    background:var(--surface); border:1px solid var(--line); color:var(--ink);
    padding:8px 12px; border-radius:var(--radius-btn); font-weight:700; font-size:0.85rem;
  }
  .lang-menu{
    position:absolute; right:0; top:calc(100% + 8px);
    background:var(--surface); border:1px solid var(--line); border-radius:10px;
    box-shadow:var(--shadow); min-width:170px; padding:6px; display:none; flex-direction:column; gap:2px;
  }
  .lang-menu.open{display:flex;}
  .lang-menu button{
    background:none; border:none; text-align:left; padding:9px 10px; border-radius:7px; font-size:0.88rem; color:var(--ink);
    display:flex; justify-content:space-between;
  }
  .lang-menu button:hover{background:var(--surface-2);}
  .lang-menu button.active{color:var(--weft); font-weight:700;}

  .btn{
    display:inline-flex; align-items:center; justify-content:center; gap:8px;
    padding:12px 22px; border-radius:var(--radius-btn); font-weight:700; font-size:0.94rem;
    text-decoration:none; border:1px solid transparent; transition:transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease, border-color .18s ease;
    white-space:nowrap;
  }
  .btn:active{transform:translateY(1px);}
  .btn-primary{background:var(--weft-strong); color:var(--on-weft); box-shadow:0 6px 18px -6px color-mix(in srgb, var(--weft-strong) 60%, transparent);}
  .btn-primary:hover{filter:brightness(1.06); box-shadow:0 8px 22px -6px color-mix(in srgb, var(--weft-strong) 70%, transparent);}
  .btn-outline{background:transparent; border-color:var(--line); color:var(--ink);}
  .btn-outline:hover{border-color:var(--steel-strong); color:var(--steel-strong);}
  .btn-ghost{background:transparent; color:var(--warp-strong); padding-left:0; padding-right:0;}
  .btn-block{width:100%;}
  .btn[disabled]{opacity:0.55; cursor:not-allowed;}

  .menu-toggle{display:none; background:none; border:none; padding:6px;}
  .menu-toggle svg{width:26px; height:26px; color:var(--ink);}

  @media (max-width:900px){
    nav.primary{display:none;}
    .menu-toggle{display:inline-flex;}
    .nav-actions .btn-primary{display:none;}
  }

  .mobile-drawer{
    display:none; position:fixed; inset:0 0 0 auto; width:min(320px,88vw); height:100vh; z-index:60;
    background:var(--surface); border-left:1px solid var(--line); padding:22px; flex-direction:column; gap:6px;
    transform:translateX(100%); transition:transform 0.32s ease;
  }
  .mobile-drawer.open{display:flex; transform:translateX(0);}
  .mobile-drawer a{padding:14px 6px; border-bottom:1px solid var(--line); font-weight:700; text-decoration:none; color:var(--ink);}
  .drawer-backdrop{display:none; position:fixed; inset:0; background:rgba(10,8,16,0.45); z-index:55;}
  .drawer-backdrop.open{display:block;}
  .drawer-close{align-self:flex-end; background:none; border:none; padding:8px;}
  .drawer-close svg{width:22px;height:22px;color:var(--ink);}

  /* ---------- Hero ---------- */
  .hero{position:relative; padding-top:64px; overflow:hidden;}
  .hero-inner{display:grid; gap:56px; align-items:center;}
  .hero-copy h1{font-size:clamp(2.1rem, 1.1rem + 4.6vw, 3.6rem); font-weight:800; line-height:1.08;}
  .hero-copy .section-sub{font-size:1.12rem; max-width:560px; margin-top:20px;}
  .hero-ctas{display:flex; gap:14px; margin-top:32px; flex-wrap:wrap;}

  .bridge-viz-wrap{position:relative; height:230px; border-radius:16px; overflow:hidden; background:var(--surface); border:1px solid var(--line);}
  canvas#bridgeCanvas{width:100%; height:100%; display:block;}
  .bridge-node{
    position:absolute; top:50%; transform:translateY(-50%);
    display:flex; flex-direction:column; align-items:center; gap:6px;
    font-family:var(--font-display); font-weight:800; font-size:0.8rem; letter-spacing:0.03em;
  }
  .bridge-node .dot{width:14px; height:14px; border-radius:50%; box-shadow:0 0 0 6px color-mix(in srgb, currentColor 18%, transparent);}
  .bridge-node.tj{left:6%; color:var(--weft-strong);}
  .bridge-node.de{right:6%; color:var(--steel-strong);}

  .stat-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:1px; margin-top:64px; background:var(--line); border:1px solid var(--line); border-radius:14px; overflow:hidden;}
  .stat-cell{background:var(--surface); padding:24px 20px; text-align:center;}
  .stat-value{font-family:var(--font-display); font-weight:800; font-size:clamp(1.5rem,1rem+1.6vw,2.1rem); color:var(--weft);
    font-variant-numeric:tabular-nums;}
  .stat-label{font-size:0.82rem; color:var(--ink-faint); margin-top:6px; line-height:1.4;}
  @media (max-width:800px){ .stat-grid{grid-template-columns:repeat(2,1fr);} }

  /* ---------- Path selection ---------- */
  .path-grid{display:grid; grid-template-columns:1fr 1fr; gap:24px;}
  @media (max-width:800px){ .path-grid{grid-template-columns:1fr;} }
  .path-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card);
    padding:36px 32px; display:flex; flex-direction:column; gap:14px;
    transition:transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }
  .path-card:hover{transform:translateY(-4px); box-shadow:var(--shadow); border-color:var(--steel);}
  .path-icon{width:46px; height:46px; border-radius:11px; display:flex; align-items:center; justify-content:center; margin-bottom:6px;}
  .path-card.investor .path-icon{background:color-mix(in srgb, var(--weft-strong) 16%, transparent); color:var(--weft);}
  .path-card.business .path-icon{background:color-mix(in srgb, var(--warp-strong) 16%, transparent); color:var(--warp);}
  .path-card h3{font-size:1.3rem;}
  .path-card p{color:var(--ink-soft);}

  /* ---------- Sectors ---------- */
  .sector-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:20px;}
  @media (max-width:900px){ .sector-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .sector-grid{grid-template-columns:1fr;} }
  .sector-card{
    background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card);
    padding:26px; transition:border-color 0.2s ease, transform 0.2s ease;
  }
  .sector-card:hover{border-color:var(--weft-strong); transform:translateY(-3px);}
  .sector-icon{width:42px; height:42px; color:var(--steel-strong); margin-bottom:14px;}
  .sector-card h3{font-size:1.08rem; margin-bottom:8px;}
  .sector-card p{color:var(--ink-soft); font-size:0.94rem;}

  /* ---------- Opportunities ---------- */
  .opp-grid{display:grid; grid-template-columns:repeat(2,1fr); gap:20px;}
  @media (max-width:800px){ .opp-grid{grid-template-columns:1fr;} }
  .opp-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); padding:26px; display:flex; flex-direction:column; gap:12px;}
  .opp-top{display:flex; justify-content:space-between; align-items:flex-start; gap:10px;}
  .opp-tag{
    font-size:0.68rem; font-weight:700; text-transform:uppercase; letter-spacing:0.06em;
    background:color-mix(in srgb, var(--warp-strong) 15%, transparent); color:var(--warp); border-radius:var(--radius-tag); padding:4px 8px; white-space:nowrap;
  }
  .opp-sector{font-size:0.78rem; font-weight:700; color:var(--steel-strong); text-transform:uppercase; letter-spacing:0.05em;}
  .opp-card h3{font-size:1.12rem;}
  .opp-loc{font-size:0.85rem; color:var(--ink-faint);}
  .opp-card p.desc{color:var(--ink-soft); font-size:0.94rem;}
  .opp-foot{display:flex; justify-content:space-between; align-items:center; margin-top:auto; padding-top:10px; border-top:1px solid var(--line);}
  .opp-seek{font-family:var(--font-display); font-weight:700; font-size:0.95rem;}
  .opp-seek span{display:block; font-family:var(--font-body); font-weight:500; font-size:0.7rem; color:var(--ink-faint); text-transform:uppercase; letter-spacing:0.05em;}

  /* ---------- Why ---------- */
  .why-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:20px;}
  @media (max-width:900px){ .why-grid{grid-template-columns:repeat(2,1fr);} }
  @media (max-width:560px){ .why-grid{grid-template-columns:1fr;} }
  .why-card{padding:6px 0;}
  .why-num{font-family:var(--font-display); font-weight:800; font-size:0.85rem; color:var(--weft); letter-spacing:0.04em; margin-bottom:10px;}
  .why-card h3{font-size:1.05rem; margin-bottom:8px;}
  .why-card p{color:var(--ink-soft); font-size:0.94rem;}

  /* ---------- Process ---------- */
  .process-strip{background:var(--surface-2);}
  .process-grid{display:grid; grid-template-columns:repeat(4,1fr); gap:0; counter-reset:step;}
  @media (max-width:900px){ .process-grid{grid-template-columns:repeat(2,1fr); gap:28px;} }
  @media (max-width:560px){ .process-grid{grid-template-columns:1fr;} }
  .process-step{position:relative; padding:0 22px 0 0;}
  .process-step:not(:last-child)::after{
    content:""; position:absolute; top:19px; left:0; right:0; height:1px; background:var(--line);
  }
  @media (max-width:900px){ .process-step:not(:last-child)::after{display:none;} }
  .process-index{
    font-family:var(--font-display); font-weight:800; font-size:1rem;
    width:38px; height:38px; border-radius:50%; background:var(--ground); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; margin-bottom:18px; position:relative; z-index:1;
    color:var(--weft);
  }
  .process-step h3{font-size:1.05rem; margin-bottom:8px;}
  .process-step p{color:var(--ink-soft); font-size:0.92rem;}

  /* ---------- Trust strip ---------- */
  .trust-strip{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); padding:36px 0;}
  @media (max-width:700px){ .trust-strip{grid-template-columns:1fr;} }
  .trust-item{display:flex; align-items:center; gap:12px; font-weight:700; font-size:0.95rem;}
  .trust-item svg{width:22px; height:22px; color:var(--steel-strong); flex-shrink:0;}

  /* ---------- Contact ---------- */
  .contact-wrap{display:grid; grid-template-columns:1fr 1fr; gap:56px; align-items:start;}
  @media (max-width:860px){ .contact-wrap{grid-template-columns:1fr;} }
  .form-card{background:var(--surface); border:1px solid var(--line); border-radius:var(--radius-card); padding:32px; box-shadow:var(--shadow);}
  .field{margin-bottom:18px;}
  .field label{display:block; font-size:0.84rem; font-weight:700; margin-bottom:7px;}
  .field input, .field textarea, .field select{
    width:100%; padding:11px 13px; border-radius:9px; border:1px solid var(--line);
    background:var(--ground); color:var(--ink); font-family:inherit; font-size:0.95rem;
  }
  .field input:focus, .field textarea:focus, .field select:focus{outline:2px solid var(--steel-strong); outline-offset:1px;}
  .role-row{display:flex; gap:10px; flex-wrap:wrap;}
  .role-pill{
    border:1px solid var(--line); border-radius:999px; padding:8px 16px; font-size:0.85rem; font-weight:700;
    background:var(--ground); color:var(--ink-soft);
  }
  .role-pill input{display:none;}
  .role-pill.checked{border-color:var(--weft-strong); color:var(--weft); background:color-mix(in srgb, var(--weft-strong) 12%, transparent);}
  .form-msg{margin-top:14px; padding:12px 14px; border-radius:9px; background:color-mix(in srgb, var(--steel-strong) 14%, transparent); color:var(--ink); font-size:0.9rem; display:none;}
  .form-msg.show{display:block;}

  /* ---------- Footer ---------- */
  footer{padding:56px 0 32px; border-top:1px solid var(--line);}
  .footer-top{display:flex; justify-content:space-between; align-items:flex-start; gap:24px; flex-wrap:wrap; margin-bottom:28px;}
  .footer-tagline{color:var(--ink-soft); max-width:360px; font-size:0.95rem;}
  .footer-disclaimer{font-size:0.8rem; color:var(--ink-faint); max-width:640px; line-height:1.6; border-top:1px solid var(--line); padding-top:20px;}
  .footer-bottom{display:flex; justify-content:space-between; flex-wrap:wrap; gap:10px; margin-top:20px; font-size:0.8rem; color:var(--ink-faint);}
</style>
</head>
<body>

<div class="demo-ribbon" data-i18n="ribbon"></div>

<header id="siteHeader">
  <div class="container nav-row">
    <div class="brand">
      <svg class="brand-mark" viewBox="0 0 40 40" fill="none"><circle cx="9" cy="24" r="4.5" fill="var(--weft-strong)"/><circle cx="31" cy="24" r="4.5" fill="var(--steel-strong)"/><path d="M9 24C13 10 27 10 31 24" stroke="var(--warp-strong)" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg>
      <span>TajBridge</span>
    </div>
    <nav class="primary">
      <a href="#sectors" data-i18n="nav.sectors"></a>
      <a href="#opportunities" data-i18n="nav.opportunities"></a>
      <a href="#why" data-i18n="nav.why"></a>
      <a href="#process" data-i18n="nav.process"></a>
      <a href="#contact" data-i18n="nav.contact"></a>
    </nav>
    <div class="nav-actions">
      <div class="lang-switch">
        <button class="lang-btn" id="langBtn" aria-haspopup="true" aria-expanded="false">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 4 6 4 9s-1.5 6.3-4 9c-2.5-2.7-4-6-4-9s1.5-6.3 4-9z"/></svg>
          <span id="langBtnLabel">EN</span>
        </button>
        <div class="lang-menu" id="langMenu">
          <button data-lang="tg">Тоҷикӣ</button>
          <button data-lang="ru">Русский</button>
          <button data-lang="en">English</button>
          <button data-lang="de">Deutsch</button>
        </div>
      </div>
      <a href="#contact" class="btn btn-primary" data-i18n="nav.cta"></a>
      <button class="menu-toggle" id="menuToggle" aria-label="Menu">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </div>
</header>

<div class="drawer-backdrop" id="drawerBackdrop"></div>
<div class="mobile-drawer" id="mobileDrawer">
  <button class="drawer-close" id="drawerClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  <a href="#sectors" data-i18n="nav.sectors"></a>
  <a href="#opportunities" data-i18n="nav.opportunities"></a>
  <a href="#why" data-i18n="nav.why"></a>
  <a href="#process" data-i18n="nav.process"></a>
  <a href="#contact" data-i18n="nav.contact"></a>
</div>

<main>
  <section class="hero">
    <div class="container hero-inner">
      <div class="hero-copy reveal">
        <div class="eyebrow" data-i18n="hero.badge"></div>
        <h1 data-i18n="hero.title"></h1>
        <p class="section-sub" data-i18n="hero.subtitle"></p>

function t(path, dict){
  var parts = path.split(".");
  var node = dict;
  for(var i=0;i<parts.length;i++){ if(!node) return ""; node = node[parts[i]]; }
  return node == null ? "" : node;
}

    return '<div class="why-card"><div class="why-num">0'+(i+1)+'</div><h3>'+w.title+'</h3><p>'+w.desc+'</p></div>';

function applyLang(lang){
  var dict = translations[lang] || translations.en;
  current = lang;
  localStorage.setItem(LANG_KEY, lang);
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(function(el){
    var val = t(el.getAttribute("data-i18n"), dict);
    if(typeof val === "string") el.textContent = val;
  });
  renderLists(dict);
  document.getElementById("langBtnLabel").textContent = lang.toUpperCase();
  document.querySelectorAll(".lang-menu button").forEach(function(b){
    b.classList.toggle("active", b.getAttribute("data-lang")===lang);
  });
}

  });
}, {threshold:0.14});

/* counters */
var reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function animateCount(el){
  var target = parseFloat(el.getAttribute("data-count"));
  var suffix = el.getAttribute("data-suffix")||"";
  if(reduceMotion){ el.textContent = target.toString().replace(".", ",").replace(",0","")+suffix; return; }
  var start = null, duration = 1400;
  function step(ts){
    if(!start) start = ts;
    var progress = Math.min((ts-start)/duration, 1);
    var eased = 1 - Math.pow(1-progress, 3);
    var val = target*eased;
    el.textContent = (target % 1 === 0 ? Math.round(val) : val.toFixed(1)) + suffix;
    if(progress < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}
var countEls = document.querySelectorAll("[data-count]");
var cio = new IntersectionObserver(function(entries){
  entries.forEach(function(entry){
    if(entry.isIntersecting){ animateCount(entry.target); cio.unobserve(entry.target); }
  });
}, {threshold:0.6});
countEls.forEach(function(el){ cio.observe(el); });

/* bridge canvas animation */
var canvas = document.getElementById("bridgeCanvas");
var ctx = canvas.getContext("2d");
var dpr = Math.min(window.devicePixelRatio||1, 2);
var w,h,t0=0;
function resize(){
  var rect = canvas.parentElement.getBoundingClientRect();
  w = rect.width; h = rect.height;
  canvas.width = w*dpr; canvas.height = h*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
window.addEventListener("resize", resize);
resize();

function getVar(name){ return getComputedStyle(document.documentElement).getPropertyValue(name).trim(); }

function drawFrame(time){
  ctx.clearRect(0,0,w,h);
  var waves = [
    {color:getVar('--weft-strong'), amp:h*0.14, freq:0.016, speed:0.00028, phase:0, y:h*0.55, alpha:0.85, width:2.4},
    {color:getVar('--warp-strong'), amp:h*0.10, freq:0.020, speed:0.00042, phase:2.1, y:h*0.6, alpha:0.6, width:2},
    {color:getVar('--steel-strong'), amp:h*0.12, freq:0.013, speed:-0.00021, phase:4.2, y:h*0.5, alpha:0.5, width:1.8}
  ];
  waves.forEach(function(wv){
    ctx.beginPath();
    for(var x=0; x<=w; x+=4){
      var y = wv.y + Math.sin(x*wv.freq + time*wv.speed + wv.phase)*wv.amp;
      if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
    }
    ctx.strokeStyle = wv.color;
    ctx.globalAlpha = wv.alpha;
    ctx.lineWidth = wv.width;
    ctx.stroke();
  });
  ctx.globalAlpha = 1;
  // connecting arc between nodes
  ctx.beginPath();
  ctx.moveTo(w*0.08, h*0.5);
  ctx.quadraticCurveTo(w*0.5, h*0.14, w*0.92, h*0.5);
  ctx.strokeStyle = getVar('--line');
  ctx.setLineDash([5,6]);
  ctx.lineWidth = 1.4;
  ctx.stroke();
  ctx.setLineDash([]);
}

if(reduceMotion){
  drawFrame(0);
} else {
  function loop(ts){ drawFrame(ts); requestAnimationFrame(loop); }
  requestAnimationFrame(loop);
}

/* contact form (client-side demo only — no data is sent anywhere) */
document.querySelectorAll('input[name="role"]').forEach(function(r){
  r.addEventListener("change", function(){
    document.querySelectorAll(".role-pill").forEach(function(p){ p.classList.remove("checked"); });
    r.closest(".role-pill").classList.add("checked");
  });
});
document.querySelector('input[name="role"]').closest(".role-pill").classList.add("checked");

document.getElementById("contactForm").addEventListener("submit", function(e){
  e.preventDefault();
  var msg = document.getElementById("formMsg");
  msg.classList.add("show");
  this.reset();
  document.querySelectorAll(".role-pill").forEach(function(p){ p.classList.remove("checked"); });
  document.querySelector('input[name="role"]').checked = true;
  document.querySelector('input[name="role"]').closest(".role-pill").classList.add("checked");
});

})();
</script>
