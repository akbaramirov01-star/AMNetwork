<style>
:root{
  --ground:#F3F0E9; --surface:#FBFAF6; --surface-2:#E9E5DB; --ink:#0E1420; --ink-soft:#4A5262;
  --ink-faint:#7C8392; --line:#D8D2C4; --gold:#9A7A36; --gold-soft:#B8964F; --red:#B0302A; --green:#2D6B47;
  --on-gold:#FFFDF6; --hero-ink:#F4F1EA;
  --serif:'Cormorant Garamond','Cormorant',Georgia,'Times New Roman',serif;
  --sans:'Commissioner',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --maxw:1240px; --pad:clamp(20px,4vw,56px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#090D15; --surface:#0F1520; --surface-2:#151C29; --ink:#ECE8DF; --ink-soft:#A3A9B6;
    --ink-faint:#6E7585; --line:#222B3A; --gold:#D4AF66; --gold-soft:#E2C285; --red:#D2483F; --green:#4E9A6C;
    --on-gold:#14100A;
  }
}
:root[data-theme="dark"]{
  --ground:#090D15; --surface:#0F1520; --surface-2:#151C29; --ink:#ECE8DF; --ink-soft:#A3A9B6;
  --ink-faint:#6E7585; --line:#222B3A; --gold:#D4AF66; --gold-soft:#E2C285; --red:#D2483F; --green:#4E9A6C;
  --on-gold:#14100A;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:500;letter-spacing:-.015em;text-wrap:balance;line-height:1.12}
p{margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* adras band: Tajik ikat lozenges in gold, red and green */
.orn{height:14px;width:100%;background-image:var(--orn-band);background-repeat:repeat-x;background-size:auto 100%;opacity:.95}
.orn.lg{height:22px;background-image:var(--orn-band-lg)}
.flag{display:inline-block;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.flag svg{display:block;width:100%;height:100%}
/* ---------- top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;z-index:60;transition:background .4s ease,border-color .4s ease,color .4s ease;border-bottom:1px solid transparent;color:var(--hero-ink)}
.topbar .orn{position:absolute;top:0;left:0;right:0;height:6px;background-size:auto 6px;opacity:.9}
.topbar.solid{background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px);border-color:var(--line);color:var(--ink)}
.bar{display:flex;align-items:center;gap:22px;height:76px}
.brand{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;text-decoration:none;line-height:1.05;margin-right:auto;flex-shrink:0;max-width:60vw}
.brand .flag{grid-row:1/3;width:34px;height:17px}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.18rem;letter-spacing:-.01em;white-space:nowrap}
.brand span{grid-column:2;font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:17px}
.nav a{text-decoration:none;font-size:.82rem;font-weight:500;opacity:.78;position:relative;padding:6px 0;white-space:nowrap}
.nav a:hover,.nav a.on{opacity:1}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--gold)}
.tools{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid color-mix(in srgb,currentColor 28%,transparent);background:transparent;color:inherit;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border-radius:0}
.chip:hover{border-color:currentColor}
.chip svg,.cta svg,.burger svg{flex-shrink:0;max-width:none}
.langs{position:relative}
.langs ul{position:absolute;right:0;top:calc(100% + 8px);list-style:none;margin:0;padding:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line);min-width:170px;display:none;box-shadow:0 18px 40px -18px rgba(0,0,0,.4)}
.langs.open ul{display:block}
.langs li button{width:100%;text-align:left;background:none;border:0;padding:9px 12px;color:var(--ink);font-size:.9rem;display:flex;justify-content:space-between}
.langs li button:hover,.langs li button.on{background:var(--surface-2)}
.langs li button small{font-family:var(--mono);color:var(--ink-faint);font-size:.7rem}
.cta{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 20px;background:var(--gold);color:var(--on-gold);text-decoration:none;font-weight:600;font-size:.88rem;border:0;letter-spacing:.01em;transition:transform .2s ease,filter .2s ease;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta:active{transform:translateY(1px)}
.cta.ghost{background:transparent;color:inherit;border:1px solid color-mix(in srgb,currentColor 35%,transparent)}
.cta svg{width:16px;height:16px}
.burger{display:none;width:42px;height:42px;background:none;border:1px solid color-mix(in srgb,currentColor 28%,transparent);color:inherit;align-items:center;justify-content:center}
.burger svg{width:20px;height:20px}
@media (max-width:1300px){.nav{display:none}.burger{display:inline-flex}}
.topbar.compact .nav{display:none}.topbar.compact .burger{display:inline-flex}
@media (max-width:760px){.tools .cta{display:none}}
@media (max-width:620px){.bar{gap:10px}.brand{max-width:calc(100vw - 196px);flex-shrink:1;min-width:0}.brand b{font-size:1.16rem}.tools{gap:6px}.tools .chip{padding:0 10px}#langBtn span{display:none}}

/* drawer */
.drawer{position:fixed;inset:0;z-index:80;background:var(--ground);color:var(--ink);display:flex;flex-direction:column;padding:22px var(--pad) 30px;transform:translateY(-100%);visibility:hidden;transition:transform .55s cubic-bezier(.7,0,.2,1),visibility 0s linear .55s;overflow-y:auto}
.drawer.open{transform:none;visibility:visible;transition:transform .55s cubic-bezier(.7,0,.2,1),visibility 0s}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
.drawer nav{display:flex;flex-direction:column;margin-top:10px}
.drawer nav a{font-family:var(--serif);font-size:clamp(1.6rem,6vw,2.4rem);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.drawer nav a small{font-family:var(--mono);font-size:.7rem;color:var(--ink-faint);letter-spacing:.1em}
.drawer nav a.on{color:var(--gold)}
.drawer-foot{margin-top:auto;padding-top:26px;display:flex;flex-wrap:wrap;gap:10px}
.drawer-foot .chip{color:var(--ink)}

/* ---------- hero (WebGL) ---------- */
.hero{position:relative;height:340vh;background:#0A0F18}
.hero-stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;color:var(--hero-ink)}
.hero-sky{position:absolute;inset:0;background:linear-gradient(180deg,#0B1424 0%,#23324A 46%,#7A6A58 74%,#C9A877 100%)}
#terrain{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-grain{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 110%,transparent 40%,rgba(5,8,14,.55) 100%),linear-gradient(180deg,rgba(6,9,15,.55) 0%,transparent 26%,transparent 60%,rgba(6,9,15,.65) 100%)}
.chapter{position:absolute;inset:0;display:flex;align-items:center;padding:96px var(--pad) 70px;pointer-events:none;opacity:0;transition:opacity .15s linear}
.chapter.c1{opacity:1}
.chapter .in{max-width:var(--maxw);width:100%;margin:0 auto}
.chapter .kick{font-family:var(--mono);font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;opacity:.82;display:flex;align-items:center;gap:14px;margin-bottom:26px}
.chapter .kick::before{content:"";width:38px;height:1px;background:var(--gold-soft,#E2C285)}
.chapter h1,.chapter h2{font-size:clamp(2.4rem,1rem + 4.2vw,5.2rem);font-weight:400;line-height:1.04;letter-spacing:-.025em;max-width:17ch;text-shadow:0 2px 40px rgba(0,0,0,.35)}
.chapter h1 em,.chapter h2 em{font-style:italic;color:#E9CF9A}
.chapter .sub{margin-top:28px;max-width:46ch;font-size:clamp(1rem,.9rem + .4vw,1.2rem);opacity:.9;line-height:1.6;text-shadow:0 1px 18px rgba(0,0,0,.4)}
.chapter.c2 .in{text-align:center}.chapter.c2 h2{margin:0 auto;max-width:16ch}
.chapter.c2 .kick{justify-content:center}.chapter.c2 .kick::before{display:none}
.chapter.c3 .in{display:flex;justify-content:flex-end}.chapter.c3 .box{max-width:620px}
.chapter .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px;pointer-events:auto}
.chapter .acts .cta.ghost{color:var(--hero-ink)}
.figs-strip{display:flex;gap:clamp(18px,4vw,64px);justify-content:center;margin-top:44px;flex-wrap:wrap}
.figs-strip div{text-align:center}
.figs-strip b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(2rem,1rem + 3vw,3.6rem);line-height:1}
.figs-strip span{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;opacity:.75;margin-top:10px}
.hero-meter{position:absolute;left:var(--pad);right:var(--pad);bottom:28px;display:flex;align-items:center;gap:18px;font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;opacity:.8}
.hero-meter .track{flex:1;height:1px;background:rgba(255,255,255,.22);position:relative}
.hero-meter .track i{position:absolute;left:0;top:0;bottom:0;background:#E2C285;width:0}
.hero-coord .flag{width:40px;height:20px;margin:0 0 10px auto;display:block}
.hero-coord{position:absolute;right:var(--pad);top:104px;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-align:right;opacity:.7;line-height:1.7}
@media (max-width:720px){.hero-coord{display:none}.chapter.c3 .in{justify-content:flex-start}}

/* ---------- generic sections ---------- */
main{display:block}
.page{display:none}
.page.on{display:block}
.sec{padding:clamp(72px,9vw,128px) 0;border-top:1px solid var(--line)}
.sec.flush{border-top:0}
.sec.tint{background:var(--surface)}
.kicker{font-family:var(--mono);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:12px;margin-bottom:22px}
.kicker::before{content:"";width:28px;height:1px;background:currentColor}
.h2{font-size:clamp(2rem,1.1rem + 2.8vw,3.6rem);font-weight:400;max-width:22ch}
.lead{font-size:clamp(1.02rem,.96rem + .3vw,1.18rem);color:var(--ink-soft);max-width:62ch;margin-top:22px;line-height:1.7}
.head{margin-bottom:clamp(40px,5vw,72px)}
.head.split{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:end}
.head.split .lead{margin-top:0}
@media (max-width:900px){.head.split{grid-template-columns:1fr;gap:18px}}
.src{font-family:var(--mono);font-size:.62rem;vertical-align:super;line-height:0;color:var(--gold);text-decoration:none;margin-left:2px;letter-spacing:0}
.src:hover{text-decoration:underline}
.note{font-size:.84rem;color:var(--ink-faint);line-height:1.6;margin-top:18px;max-width:80ch}

/* page header for inner routes */
.phead{padding:calc(76px + clamp(56px,8vw,110px)) 0 clamp(48px,6vw,84px);position:relative;overflow:hidden;background:var(--surface)}
.phead::after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:var(--line)}
.phead .crumb{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:28px}
.phead .crumb a{text-decoration:none}
.phead h1{font-size:clamp(2.6rem,1.2rem + 4.6vw,5.6rem);font-weight:400;max-width:16ch;letter-spacing:-.025em}
.phead .lead{margin-top:28px}
.phead .field{position:absolute;top:0;bottom:0;right:0;width:min(46%,620px);background-image:var(--orn-field);background-size:120px 64px;opacity:.13;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.phead .orn{position:absolute;left:0;right:0;bottom:0;height:14px;opacity:.75}
.phead .wrap{position:relative;z-index:1}

/* doors (two audiences) */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line)}
.door{position:relative;padding:clamp(32px,4vw,56px);text-decoration:none;display:flex;flex-direction:column;gap:18px;min-height:380px;overflow:hidden;background:var(--surface);transition:background .4s ease}
.door+.door{border-left:1px solid var(--line)}
.door .lab{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}
.door h3{font-size:clamp(1.7rem,1.1rem + 1.6vw,2.6rem);font-weight:400;max-width:16ch}
.door p{color:var(--ink-soft);max-width:44ch}
.door ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.door li{font-size:.92rem;display:flex;gap:10px;color:var(--ink-soft)}
.door li::before{content:"";width:14px;height:1px;background:var(--gold);margin-top:.8em;flex-shrink:0}
.door .go{margin-top:auto;display:flex;align-items:center;gap:12px;font-weight:600;font-size:.92rem}
.door .go i{width:44px;height:44px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:transform .35s ease,background .35s ease,border-color .35s ease}
.door:hover .go i{transform:translateX(6px);background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.door .lab{display:flex;align-items:center;gap:12px}
.door .lab .flag{width:30px;height:20px}
.door.tj .lab .flag{width:34px;height:17px}
@media (max-width:860px){.doors{grid-template-columns:1fr}.door+.door{border-left:0;border-top:1px solid var(--line)}.door{min-height:0}}

/* figure board */
.board{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);}
.fig{padding:28px 24px 30px 0;border-right:1px solid var(--line);min-width:0}
.fig+.fig{padding-left:24px}
.fig:last-child{border-right:0}
.fig .v{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,1.4rem + 2.6vw,4rem);line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.fig .v small{font-size:.42em;color:var(--ink-faint);font-family:var(--sans)}
.fig .l{margin-top:14px;font-size:.92rem;color:var(--ink-soft);line-height:1.45}
.fig .d{margin-top:10px;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;color:var(--ink-faint)}
@media (max-width:900px){.board{grid-template-columns:1fr 1fr}.fig:nth-child(2){border-right:0}.fig:nth-child(-n+2){border-bottom:1px solid var(--line)}.fig:nth-child(3){padding-left:0}}
@media (max-width:480px){.board{grid-template-columns:1fr}.fig{border-right:0;border-bottom:1px solid var(--line);padding-left:0!important}}

/* feature rows */
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:72px 1fr 1.25fr;gap:28px;padding:30px 0;border-bottom:1px solid var(--line);align-items:start}
.row .n{font-family:var(--mono);font-size:.74rem;color:var(--gold);padding-top:6px}
.row h3{font-size:clamp(1.3rem,1rem + .8vw,1.75rem);font-weight:400}
.row p{color:var(--ink-soft)}
@media (max-width:820px){.row{grid-template-columns:44px 1fr}.row p{grid-column:2}}

/* sector cards */
.sectors{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.sector{background:var(--ground);padding:34px 30px 36px;display:flex;flex-direction:column;gap:14px;min-height:300px;position:relative;cursor:pointer;text-align:left;border:0;color:inherit;transition:background .35s ease}
.sector:hover{background:var(--surface)}
.sector .ico{width:42px;height:42px;color:var(--gold)}
.sector h3{font-size:1.5rem;font-weight:400}
.sector p{color:var(--ink-soft);font-size:.95rem}
.sector .tag{margin-top:auto;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);display:flex;justify-content:space-between;align-items:center}
.sector .tag i{font-style:normal;color:var(--gold);font-size:1rem;transition:transform .3s}
.sector:hover .tag i{transform:translateX(4px)}
@media (max-width:980px){.sectors{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.sectors{grid-template-columns:1fr}}

/* sector dossier (expanded) */
.dossier{display:none;grid-column:1/-1;background:var(--surface);padding:clamp(28px,4vw,52px)}
.dossier.on{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,64px)}
.dossier h4{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:12px}
.dossier ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.dossier li{display:flex;gap:12px;color:var(--ink-soft);font-size:.95rem}
.dossier li::before{content:"";width:12px;height:1px;background:var(--gold);margin-top:.8em;flex-shrink:0}
.dossier .big{font-family:var(--serif);font-size:clamp(1.4rem,1rem + 1vw,2rem);line-height:1.3;font-weight:400}
@media (max-width:820px){.dossier.on{grid-template-columns:1fr}}

/* split media block */
.split2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,5vw,80px);align-items:start}
@media (max-width:900px){.split2{grid-template-columns:1fr}}

/* trade bars */
.bars{display:grid;gap:22px;margin-top:8px}
.barrow .bl{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:8px;gap:12px}
.barrow .bl b{font-family:var(--mono);font-weight:500}
.barrow .bt{height:10px;background:var(--surface-2);position:relative;overflow:hidden}
.barrow .bt i{position:absolute;inset:0 auto 0 0;width:0;transition:width 1.6s cubic-bezier(.16,1,.3,1)}
.barrow.de .bt i{background:var(--ink)}
.barrow.tj .bt i{background:var(--gold)}
.quote{border-left:2px solid var(--gold);padding:6px 0 6px 22px;font-family:var(--serif);font-size:clamp(1.25rem,1rem + .8vw,1.7rem);line-height:1.35;margin-top:30px}

/* key-value table */
.kv{width:100%;border-collapse:collapse}
.kv td{padding:15px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:.95rem}
.kv td:first-child{color:var(--ink-soft);padding-right:20px}
.kv td:last-child{text-align:right;font-family:var(--mono);font-size:.92rem;white-space:nowrap}
.kv tr:first-child td{border-top:1px solid var(--ink)}

/* treaties timeline */
.tl{position:relative;display:grid;gap:0;border-top:1px solid var(--line)}
.tl .t{display:grid;grid-template-columns:150px 1fr;gap:28px;padding:26px 0;border-bottom:1px solid var(--line)}
.tl .t .dt{font-family:var(--mono);font-size:.8rem;color:var(--gold)}
.tl .t h3{font-size:1.3rem;font-weight:400}
.tl .t p{color:var(--ink-soft);margin-top:8px;font-size:.95rem}
@media (max-width:640px){.tl .t{grid-template-columns:1fr;gap:6px}}

/* FEZ map */
.fezwrap{display:grid;grid-template-columns:1.15fr .85fr;gap:0;border:1px solid var(--line);background:var(--surface)}
.fezmap{position:relative;min-height:440px;border-right:1px solid var(--line)}
.fezmap svg{width:100%;height:100%}
.fezmap .pin{cursor:pointer}
.fezmap .pin circle.core{fill:var(--gold);transition:r .3s}
.fezmap .pin circle.halo{fill:none;stroke:var(--gold);opacity:.5}
.fezmap .pin text{fill:var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.fezmap .pin.on circle.core{fill:var(--red)}
.fezmap .cap{position:absolute;left:18px;top:14px;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--ink-faint);max-width:80%}
.fezcard{padding:clamp(24px,3vw,40px);display:flex;flex-direction:column;gap:14px}
.fezcard .z{font-family:var(--serif);font-size:2.2rem;font-weight:400}
.fezcard .meta{display:flex;gap:18px;flex-wrap:wrap;font-family:var(--mono);font-size:.78rem;color:var(--ink-soft)}
.fezcard .meta b{color:var(--ink);font-weight:500}
.fezcard p{color:var(--ink-soft)}
.fezlist{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:14px;border-top:1px solid var(--line)}
.fezlist button{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:7px 12px;font-family:var(--mono);font-size:.72rem;letter-spacing:.06em}
.fezlist button.on{border-color:var(--gold);color:var(--ink);background:var(--surface-2)}
@media (max-width:900px){.fezwrap{grid-template-columns:1fr}.fezmap{border-right:0;border-bottom:1px solid var(--line);min-height:340px}}

/* steps */
.steps{display:grid;grid-template-columns:repeat(var(--n,4),1fr);gap:0;border-top:1px solid var(--ink)}
@media (max-width:1060px){.steps{grid-template-columns:repeat(2,1fr)}.step{border-bottom:1px solid var(--line)}.step:nth-child(odd){padding-left:0}}
.step{padding:28px 26px 30px 0;border-right:1px solid var(--line)}
.step+.step{padding-left:26px}
.step:last-child{border-right:0}
.step .sn{font-family:var(--serif);font-size:3rem;line-height:1;color:var(--gold);font-weight:400}
.step h3{font-size:1.2rem;font-weight:500;margin:16px 0 10px;font-family:var(--sans);letter-spacing:0}
.step p{color:var(--ink-soft);font-size:.93rem}
.step .who{margin-top:14px;font-family:var(--mono);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
@media (max-width:760px){.step{border-right:0;border-bottom:1px solid var(--line);padding-left:0!important}}

/* reg table */
.regs{display:grid;grid-template-columns:repeat(2,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.reg{background:var(--ground);padding:26px 26px 28px}
.reg .code{font-family:var(--mono);font-size:.72rem;color:var(--gold);letter-spacing:.06em}
.reg h3{font-size:1.15rem;font-family:var(--sans);font-weight:600;letter-spacing:0;margin:10px 0 8px}
.reg p{color:var(--ink-soft);font-size:.93rem}
.reg a{display:inline-block;margin-top:12px;font-family:var(--mono);font-size:.72rem;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--gold)}
@media (max-width:760px){.regs{grid-template-columns:1fr}}

/* events */
.evts{border-top:1px solid var(--ink)}
.evt{display:grid;grid-template-columns:150px 1fr 220px 48px;gap:28px;align-items:center;padding:28px 0;border-bottom:1px solid var(--line);text-decoration:none}
.evt .date{font-family:var(--serif);font-size:1.6rem;line-height:1.1}
.evt .date small{display:block;font-family:var(--mono);font-size:.68rem;color:var(--ink-faint);letter-spacing:.1em;margin-top:6px}
.evt h3{font-size:1.4rem;font-weight:400}
.evt p{color:var(--ink-soft);font-size:.93rem;margin-top:6px}
.evt .where{font-family:var(--mono);font-size:.76rem;color:var(--ink-soft)}
.evt .arr{width:44px;height:44px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:all .3s}
.evt:hover .arr{background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
@media (max-width:860px){.evt{grid-template-columns:1fr;gap:8px}.evt .arr{display:none}}

/* news feed */
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:30px}
.tabs button{background:none;border:1px solid var(--line);color:var(--ink-soft);padding:9px 16px;font-size:.86rem;border-radius:999px;transition:all .25s}
.tabs button.on{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.feed{border-top:1px solid var(--ink)}
.item{display:grid;grid-template-columns:150px 1fr auto;gap:28px;padding:26px 0;border-bottom:1px solid var(--line);align-items:start}
.item .when{font-family:var(--mono);font-size:.78rem;color:var(--ink-soft);border-left:2px solid var(--gold);padding-left:12px;line-height:1.5}
.item .when small{display:block;color:var(--ink-faint);font-size:.66rem;letter-spacing:.12em;text-transform:uppercase}
.item h3{font-size:1.32rem;font-weight:400;line-height:1.3}
.item p{color:var(--ink-soft);margin-top:8px;font-size:.95rem}
.item a.s{font-family:var(--mono);font-size:.7rem;color:var(--ink-faint);text-decoration:none;border-bottom:1px solid var(--line);white-space:nowrap}
.item a.s:hover{color:var(--gold);border-color:var(--gold)}
@media (max-width:760px){.item{grid-template-columns:1fr;gap:10px}}

/* forms */
.formgrid{display:grid;grid-template-columns:.8fr 1.2fr;gap:clamp(32px,5vw,80px)}
@media (max-width:900px){.formgrid{grid-template-columns:1fr}}
.ftabs{display:flex;flex-direction:column;border-top:1px solid var(--ink)}
.ftabs button{text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:20px 0;color:var(--ink-soft);display:flex;justify-content:space-between;gap:12px}
.ftabs button b{font-family:var(--serif);font-weight:400;font-size:1.35rem;color:var(--ink);display:block}
.ftabs button span{font-size:.88rem}
.ftabs button.on b{color:var(--gold)}
.ftabs button i{font-style:normal;font-family:var(--mono);font-size:.72rem;color:var(--ink-faint)}
form.f{display:none;background:var(--surface);border:1px solid var(--line);padding:clamp(24px,3.5vw,44px)}
form.f.on{display:block}
.f h3{font-size:1.7rem;font-weight:400;margin-bottom:8px}
.f .fl{color:var(--ink-soft);font-size:.93rem;margin-bottom:26px}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:18px}
@media (max-width:620px){.fr{grid-template-columns:1fr}}
.fld{display:flex;flex-direction:column;gap:7px;margin-bottom:18px}
.fld label{font-family:var(--mono);font-size:.68rem;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-faint)}
.fld input,.fld select,.fld textarea{font:inherit;font-size:.96rem;background:var(--ground);color:var(--ink);border:1px solid var(--line);padding:13px 14px;border-radius:0;width:100%}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--gold)}
.fld textarea{min-height:120px;resize:vertical}
.f .ok{display:none;margin-top:18px;padding:16px 18px;border-left:2px solid var(--green);background:var(--surface-2);font-size:.92rem}
.f .ok.on{display:block}
.f .fine{font-size:.78rem;color:var(--ink-faint);margin-top:14px}

/* documents */
.docs{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.doc{background:var(--ground);padding:26px;display:flex;flex-direction:column;gap:10px;text-decoration:none;min-height:200px;transition:background .3s}
.doc:hover{background:var(--surface)}
.doc .ty{font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.doc h3{font-size:1.15rem;font-family:var(--sans);font-weight:600;letter-spacing:0;line-height:1.35}
.doc p{color:var(--ink-soft);font-size:.9rem}
.doc .host{margin-top:auto;font-family:var(--mono);font-size:.68rem;color:var(--ink-faint);display:flex;justify-content:space-between}
@media (max-width:900px){.docs{grid-template-columns:1fr 1fr}}
@media (max-width:600px){.docs{grid-template-columns:1fr}}
.docgroup{margin-bottom:56px}
.docgroup h3.gh{font-family:var(--mono);font-size:.74rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-soft);font-weight:500;margin-bottom:16px}

/* sources */
.srcs{columns:2;column-gap:56px}
.srcs li{break-inside:avoid;margin-bottom:16px;font-size:.88rem;color:var(--ink-soft)}
.srcs li a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
.srcs li a:hover{border-color:var(--gold)}
.srcs li b{font-family:var(--mono);font-weight:500;color:var(--gold);margin-right:8px}
@media (max-width:760px){.srcs{columns:1}}
.srcs{padding:0;list-style:none;margin:0}

/* contact */
.cgrid{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--ink)}
.cgrid>div{padding:30px 28px 30px 0;border-right:1px solid var(--line)}
.cgrid>div+div{padding-left:28px}
.cgrid>div:last-child{border-right:0}
.cgrid h3{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:16px}
.cgrid p{line-height:1.8}
.cgrid .ph{color:var(--ink-faint);font-style:italic}
@media (max-width:860px){.cgrid{grid-template-columns:1fr}.cgrid>div{border-right:0;border-bottom:1px solid var(--line);padding-left:0!important}}

/* closing band */
.band{background:#0A0F18;color:var(--hero-ink);position:relative;overflow:hidden}
.band .field{position:absolute;inset:0;background-image:var(--orn-field);background-size:150px 80px;opacity:.07;pointer-events:none}
.band>.orn{position:absolute;top:0;left:0;right:0}
.band .wrap{position:relative;padding-top:clamp(80px,10vw,140px);padding-bottom:clamp(80px,10vw,140px)}
.band h2{font-size:clamp(2.2rem,1.2rem + 3.4vw,4.4rem);font-weight:400;max-width:18ch}
.band p{opacity:.8;max-width:56ch;margin-top:22px;font-size:1.08rem}
.band .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:36px}
.band .cta.ghost{color:var(--hero-ink)}

/* legal */
.legal{max-width:780px}
.legal h2{font-size:1.5rem;margin:40px 0 12px;font-weight:500}
.legal p,.legal li{color:var(--ink-soft);margin-bottom:10px}
.legal .ph{background:var(--surface-2);padding:1px 6px;font-family:var(--mono);font-size:.85em;color:var(--ink)}
.warn{border-left:2px solid var(--red);background:var(--surface);padding:16px 20px;font-size:.92rem;color:var(--ink-soft);margin-bottom:28px}

/* footer */
footer{background:var(--surface);padding:0 0 34px;position:relative}
footer>.orn{margin-bottom:56px}
.fcols{display:grid;grid-template-columns:1.4fr 1fr 1fr 1fr;gap:40px}
.fcols h4{font-family:var(--mono);font-size:.68rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);font-weight:500;margin-bottom:16px}
.fcols ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.fcols a{text-decoration:none;color:var(--ink-soft);font-size:.92rem}
.fcols a:hover{color:var(--gold)}
.fbrand b{font-family:var(--serif);font-weight:500;font-size:1.3rem;display:block}
.fbrand p{color:var(--ink-soft);font-size:.9rem;margin-top:12px;max-width:36ch}
.fbot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:48px;padding-top:22px;border-top:1px solid var(--line);font-size:.8rem;color:var(--ink-faint)}
.fbot a{text-decoration:none;color:var(--ink-faint)}
@media (max-width:900px){.fcols{grid-template-columns:1fr 1fr}}
@media (max-width:520px){.fcols{grid-template-columns:1fr}}

/* reveal: content is readable at rest; motion only refines it */
.rv{transition:opacity .9s cubic-bezier(.16,1,.3,1),transform .9s cubic-bezier(.16,1,.3,1)}
.js .rv:not(.in){opacity:.001;transform:translateY(26px)}
@media (prefers-reduced-motion:reduce){.js .rv:not(.in){opacity:1;transform:none}.rv{transition:none}html{scroll-behavior:auto}}

/* ---------- filmed media ---------- */
#film{position:absolute;inset:0;width:100%;height:100%;display:none}
.has-film #film{display:block}.has-film #terrain{display:none}
.has-film .hero-coord span,.has-film .hero-coord br{display:none}
.has-film .hero-grain{background:radial-gradient(120% 80% at 50% 110%,transparent 40%,rgba(5,8,14,.5) 100%),linear-gradient(90deg,rgba(6,9,15,.62) 0%,rgba(6,9,15,.18) 48%,transparent 70%),linear-gradient(180deg,rgba(6,9,15,.6) 0%,transparent 24%,transparent 62%,rgba(6,9,15,.7) 100%)}
.sector .ph{margin:-34px -30px 6px;aspect-ratio:3/2;overflow:hidden;background:var(--surface);position:relative}
.sector .ph img{width:100%;height:100%;object-fit:cover;display:block;transform:scale(1.001);transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter .6s ease;filter:saturate(.92)}
.sector:hover .ph img,.sector:focus-visible .ph img{transform:scale(1.045);filter:saturate(1.05)}
.sector .ph .ico{position:absolute;left:18px;bottom:16px;width:36px;height:36px;color:#F4F1EA;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.sector .ph::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(6,9,15,.45))}
.sector.has-ph{min-height:0}
.dossier .shot{margin-top:28px;aspect-ratio:16/9;overflow:hidden}
.dossier .shot img{width:100%;height:100%;object-fit:cover;display:block}
.phead .pic{position:absolute;top:0;bottom:0;right:0;width:min(54%,820px);pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent 0%,#000 46%);mask-image:linear-gradient(90deg,transparent 0%,#000 46%)}
.phead .pic img{width:100%;height:100%;object-fit:cover;display:block;opacity:.92}
.phead.has-pic .field{display:none}
@media (max-width:820px){.phead .pic{width:100%;opacity:.22;-webkit-mask-image:linear-gradient(180deg,#000,transparent);mask-image:linear-gradient(180deg,#000,transparent)}}
.band .vid{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55}
.band.has-vid::before{content:"";position:absolute;inset:0;z-index:0;background:linear-gradient(90deg,rgba(10,15,24,.92) 0%,rgba(10,15,24,.7) 45%,rgba(10,15,24,.25) 100%)}
.band.has-vid .vid{z-index:0}.band.has-vid::before{z-index:0}.band.has-vid .wrap,.band.has-vid>.orn{z-index:1}
.band.has-vid .field{display:none}
.ainote{font-size:.78rem;color:var(--ink-faint)}
@media (prefers-reduced-motion: reduce){.sector .ph img{transition:none}}
.chapter h1,.chapter h2{overflow-wrap:break-word}
.chapter.c2 h2{max-width:22ch}
@media (max-width:620px){.chapter.c2 h2{font-size:clamp(1.8rem,8vw,2.6rem);max-width:100%}.chapter h1,.chapter.c3 h2{font-size:clamp(2.1rem,9.6vw,3rem)}}

/* trade representative card */
.who{display:flex;align-items:center;gap:16px;margin-top:30px;padding:16px 18px;border:1px solid rgba(233,207,154,.28);background:rgba(8,12,20,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);max-width:520px;pointer-events:auto}
.who .mono{flex-shrink:0;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-family:var(--serif);font-size:1.15rem;letter-spacing:.04em;color:#E9CF9A;border:1px solid rgba(233,207,154,.6);background:radial-gradient(circle at 30% 25%,rgba(233,207,154,.18),transparent 70%)}
.who b{display:block;font-family:var(--serif);font-weight:500;font-size:1.15rem;line-height:1.2}
.who small{display:block;font-size:.8rem;opacity:.75;margin-top:4px;line-height:1.35}
.who a{margin-left:auto;flex-shrink:0;display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:.78rem;font-weight:500;letter-spacing:.06em;color:#E9CF9A;text-decoration:none;border:1px solid rgba(233,207,154,.4);padding:8px 11px;transition:background .25s,color .25s}
.who a:hover,.who a:focus-visible{background:#E9CF9A;color:#0A0F18}
.who a svg{width:12px;height:12px}
@media (max-width:620px){.who{padding:12px 14px;gap:12px}.who .mono{width:42px;height:42px;font-size:.95rem}.who b{font-size:1rem}}

/* ---------- motion ---------- */
.w{display:inline-block;overflow:hidden;vertical-align:bottom;padding:.08em 0 .16em;margin:-.08em 0 -.16em}
.w>span{display:inline-block;transform:translateY(112%);transition:transform 1.05s cubic-bezier(.19,1,.22,1);transition-delay:calc(var(--i) * 55ms)}
.chapter.on .w>span,.split.in .w>span{transform:none}
.js .split.rv:not(.in){opacity:1;transform:none}
.js .sector.rv .ph img{clip-path:inset(100% 0 0 0);transform:scale(1.16)}
.js .sector.rv.in .ph img{clip-path:inset(0 0 0 0);transform:scale(1.001);transition:clip-path 1.25s cubic-bezier(.77,0,.18,1) .12s,transform 1.9s cubic-bezier(.19,1,.22,1) .12s,filter .6s ease}
.js .sector.rv.in:hover .ph img,.js .sector.rv.in:focus-visible .ph img{transform:scale(1.045);transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter .6s ease}
.dossier .shot img{animation:shotIn 1.4s cubic-bezier(.19,1,.22,1) both}
@keyframes shotIn{from{clip-path:inset(0 100% 0 0);transform:scale(1.12)}to{clip-path:inset(0 0 0 0);transform:none}}
.phead .pic img{animation:picIn 2.2s cubic-bezier(.19,1,.22,1) both}
@keyframes picIn{from{opacity:0;transform:scale(1.12)}to{opacity:.92;transform:none}}
.hero-stage::after,.band.has-vid::after{content:"";position:absolute;inset:-50%;pointer-events:none;z-index:2;background-image:var(--noise);background-size:160px 160px;opacity:.05;mix-blend-mode:overlay;animation:grain 1s steps(6) infinite}
.band.has-vid::after{opacity:.07}
@keyframes grain{0%{transform:translate(0,0)}17%{transform:translate(-4%,3%)}33%{transform:translate(3%,-5%)}50%{transform:translate(-6%,-2%)}67%{transform:translate(5%,4%)}83%{transform:translate(-2%,6%)}100%{transform:translate(0,0)}}
.hero .chapter{z-index:3}.hero-meter,.hero-coord{z-index:3}
@media (prefers-reduced-motion:reduce){
 .w>span{transform:none!important;transition:none}
 .js .sector.rv .ph img{clip-path:none;transform:none;transition:none}
 .dossier .shot img,.phead .pic img{animation:none}
 .hero-stage::after,.band.has-vid::after{animation:none}
}

/* arrows: explicit size so iOS Safari never collapses them inside flex boxes */
.door .go i svg{width:18px;height:18px;flex-shrink:0;display:block}
.cta svg{width:16px;height:16px;flex-shrink:0}
@media (max-width:760px){.hero-stage::after,.band.has-vid::after{display:none}}

.loopv{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;will-change:transform;transform:scale(1.06);background:#0A0F18}
.has-loop #film{display:none}

/* language flags */
.lflag{display:inline-block;width:20px;height:14px;flex-shrink:0;overflow:hidden;border-radius:2px;box-shadow:0 0 0 1px rgba(127,127,127,.28);vertical-align:middle;line-height:0}
.lflag svg{width:100%;height:100%;display:block}
#langBtn{gap:8px}
#langBtn > svg{display:none}
.langs li button{align-items:center;gap:12px}
.langs li button span{flex:1}
#dlangs .chip{gap:8px}
.has-film .hero-coord{display:none}

/* portrait loop is a bright sunrise: shade it so the headline reads */
.has-loop .hero-grain{background:linear-gradient(180deg,rgba(6,9,15,.62) 0%,rgba(6,9,15,.38) 30%,rgba(6,9,15,.5) 60%,rgba(6,9,15,.82) 100%)}

/* Cormorant Garamond: small x-height, so headings run larger and a touch bolder; the italic carries the gold accents */
h1,h2,h3,h4{font-weight:500;letter-spacing:-.005em;line-height:1.06}
.chapter h1,.chapter h2{font-weight:500;letter-spacing:-.012em;line-height:1.0;font-size:clamp(2.7rem,1.1rem + 4.8vw,5.9rem)}
.chapter h1 em,.chapter h2 em,.band h2 em,.phead h1 em{font-weight:500}
.phead h1{font-size:clamp(3rem,1.3rem + 5.2vw,6.4rem);line-height:1.0}
.h2{font-size:clamp(2.3rem,1.3rem + 2.6vw,3.9rem);font-weight:500}
.band h2{font-size:clamp(2.5rem,1.3rem + 3.8vw,5rem);line-height:1.02}
.sector h3{font-size:1.75rem;font-weight:600;line-height:1.08}
.brand b{font-weight:600;font-size:1.32rem;letter-spacing:0}
.drawer nav a{font-weight:500;font-size:clamp(1.9rem,7vw,2.7rem)}
.fig .v{font-family:var(--serif);font-weight:500}
.dossier .big{font-size:clamp(1.6rem,1.1rem + 1.2vw,2.3rem);line-height:1.18}

/* ===== Adras / abrbandi ornament =====
   Tajik ikat silk (адрас, атлас) is dyed thread by thread before weaving,
   so its lozenges have stepped, slightly bleeding edges. We build the motif
   from horizontal bars with a small alternating offset to imitate that bleed. */
function ikatUnit(W, H, cols){
  var rows = Math.round(H/2), c = W/2, out = [];
  var half = rows/2;
  for(var i=0;i<rows;i++){
    var t = 1 - Math.abs((i+0.5) - half)/half;           /* 0 at tips, 1 at waist */
    var bleed = (i%2 ? 1 : -1) * W*0.012;
    var y = i*2, x;
    var wo = t*W*0.46, wi = Math.max(0, t*W*0.46 - W*0.10), wc = Math.max(0, t*W*0.46 - W*0.22);
    if(wi <= 0){ out.push(rect(c-wo+bleed, y, wo*2, cols[0])); }
    else{
      out.push(rect(c-wo+bleed, y, wo-wi, cols[0]));
      out.push(rect(c+wi+bleed, y, wo-wi, cols[0]));
      if(wc > 0){ out.push(rect(c-wc+bleed*1.6, y, wc*2, cols[1])); }
      var wk = Math.max(0, t*W*0.46 - W*0.33);
      if(wk > 0){ out.push(rect(c-wk-bleed, y, wk*2, cols[2])); }
    }
  }
  /* half-lozenges at the tile edges so tiles interlock */
  for(var j=0;j<rows;j++){
    var tt = Math.abs((j+0.5) - half)/half, ww = tt*W*0.16;
    if(ww>0.5){ out.push(rect(0, j*2, ww, cols[0])); out.push(rect(W-ww, j*2, ww, cols[0])); }
  }
  function rect(x,y,w,f){ return '<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+Math.max(0,w).toFixed(1)+'" height="2" fill="'+f+'"/>'; }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+out.join("")+'</svg>';
}
function svgURL(s){ return 'url("data:image/svg+xml;charset=utf-8,'+encodeURIComponent(s)+'")'; }
function paintOrnaments(){
  var cs = getComputedStyle(document.documentElement);
  var gold = cs.getPropertyValue("--gold").trim() || "#b8964f";
  var r = document.documentElement.style;
  r.setProperty("--orn-band", svgURL(ikatUnit(28, 14, [gold, "#B8322A", "#1F6B45"])));
  r.setProperty("--orn-band-lg", svgURL(ikatUnit(44, 22, [gold, "#B8322A", "#1F6B45"])));
  r.setProperty("--orn-field", svgURL(ikatUnit(120, 64, [gold, gold, gold])));
}

 faq:{k:"Вопросы инвесторов", t:"Коротко и со ссылкой на источник", l:"Самые частые вопросы немецких компаний — о въезде, правовой защите, налогах и земле.", items:{
  visa:{q:"Нужна ли гражданам Германии виза в Таджикистан?", a:"Для поездок до 30 дней — нет: граждане Германии въезжают без визы. На срок до 60 дней оформляется электронная виза (e-Visa), на более долгий срок — виза заранее. Паспорт должен быть действителен ещё минимум шесть месяцев на момент въезда. При безвизовом въезде нужно в течение десяти рабочих дней зарегистрироваться в органах внутренних дел (ОВИР).", k:"виза визу визы въезд e-visa паспорт регистрация овир поездка поехать"},
  protect:{q:"Как защищены инвестиции немецких компаний?", a:"Германия и Таджикистан заключили договор о поощрении и взаимной защите капиталовложений (подписан в Берлине 27 марта 2003 года). Экспроприация допускается только в интересах общества и с компенсацией (ст. 4). Кроме того, Закон Таджикистана «Об инвестициях» (ст. 24) исключает национализацию имущества инвестора.", k:"защита защищены гарантии национализация экспроприация риск риски безопасность договор капиталовложения"},
  transfer:{q:"Можно ли переводить прибыль в Германию?", a:"Да. Договор о защите капиталовложений гарантирует свободный перевод всех платежей, связанных с инвестицией, — капитала, доходов, погашения займов и выручки от продажи (ст. 5). Законодательство Таджикистана не устанавливает лимитов на переводы; валютные операции проводятся через коммерческие банки.", k:"прибыль перевод переводить дивиденды репатриация валюта сомони вывод банк"},
  dta:{q:"Есть ли соглашение об избежании двойного налогообложения?", a:"Да. Соглашение между Германией и Таджикистаном об избежании двойного налогообложения в отношении налогов на доходы и имущество подписано 27 марта 2003 года и действует с 21 сентября 2004 года.", k:"двойное двойного налогообложение налогообложения соглашение"},
  land:{q:"Может ли иностранная компания купить землю?", a:"Нет: земля в Таджикистане — исключительная собственность государства, её продажа законом не предусмотрена. Иностранные инвесторы получают право пользования землёй на срок до 50 лет или арендуют её у таджикских землепользователей на срок до 20 лет. Здания на земле могут находиться в частной собственности.", k:"земля землю участок собственность купить аренда недвижимость площадка"},
  reg:{q:"Как зарегистрировать компанию?", a:"С 2019 года государственная регистрация проходит по принципу «единого окна» в Налоговом комитете. После этого компания встаёт на учёт в Агентстве социального страхования и пенсий и в органах статистики. Портал правительства для инвесторов — investcom.tj. Торговый представитель подскажет контакты и консультантов.", k:"регистрация зарегистрировать компанию компания фирма ооо юрлицо единое окно налоговый комитет открыть"},
  disputes:{q:"Как решаются споры?", a:"По договору о защите капиталовложений спор инвестора с государством, не урегулированный мирно за шесть месяцев, по требованию инвестора передаётся в арбитраж (ст. 11). С 14 августа 2012 года Таджикистан — участник Нью-Йоркской конвенции о признании и приведении в исполнение иностранных арбитражных решений.", k:"спор споры арбитраж суд конвенция нью-йоркская"},
  taxes:{q:"Какие налоги платит компания?", a:"Налог на прибыль — 13 % для производства товаров и 18 % для прочих видов деятельности. НДС — 14 % в 2024–2026 годах и 13 % с 1 января 2027 года; для отдельных отраслей действуют пониженные ставки. Полная таблица — в разделе «Инвестиции».", k:"налог налоги ндс прибыль ставка ставки налогообложение"},
  fez:{q:"Что дают свободные экономические зоны?", a:"В Таджикистане пять свободных экономических зон — «Согд», «Пяндж», «Дангара», «Ишкашим» и «Куляб» — с собственным налоговым и таможенным режимом. Карта и описание каждой зоны — в разделе «Инвестиции».", k:"сэз свободная свободные экономическая зона зоны льготы согд пяндж дангара ишкашим куляб"},
  trip:{q:"Как поехать в Таджикистан с деловой миссией?", a:"Ближайшая возможность — деловая делегационная поездка AHK Центральная Азия в Душанбе с 3 по 6 ноября 2026 года: встречи в министерствах, с компаниями и проектами. Регистрация до 9 октября 2026 года. Торговый представитель помогает и с индивидуальными поездками.", k:"поездка поехать делегация делегационная миссия душанбе визит ahk"},
  help:{q:"Чем поможет торговый представитель?", a:"Первая встреча в Берлине или по видеосвязи, контакты с Государственным комитетом по инвестициям и управлению государственным имуществом и отраслевыми ведомствами, подготовка поездки и сопровождение после старта проекта.", k:"помощь помочь торговый представитель встреча контакт поддержка консультация"},
  eu:{q:"Что Таджикистан продаёт в ЕС?", a:"В 2025 году ЕС импортировал из Таджикистана товаров на 579 млн евро (+90,4 %). 92 % из них — недрагоценные металлы, далее минеральные продукты, текстиль и растительная продукция.", k:"экспорт импорт торговля ес товары металлы алюминий статистика товарооборот"},
  gsp:{q:"Какие пошлины ЕС действуют на таджикские товары?", a:"Таджикистан пользуется Общей системой преференций ЕС (GSP): «нечувствительные» товары ввозятся без пошлины, на «чувствительные» пошлина снижена на 3,5 процентного пункта. Точную ставку по коду товара покажет поиск Access2Markets в разделе «Экспорт».", k:"пошлина пошлины таможня gsp преференции тариф ввоз"},
  exporters:{q:"Где найти таджикских поставщиков сухофруктов?", a:"В разделе «Экспорт» — проверенные производители из Исфары с продукцией, сертификатами и контактами, например Barakat Isfara.", k:"купить закупить закупка поставщик поставщики сухофрукты курага абрикос исфара экспортёр производитель barakat"}
 }},

en:{
 faq:{k:"Investor questions", t:"Short answers, with sources", l:"The questions German companies ask most often – about entry, legal protection, taxes and land.", items:{
  visa:{q:"Do German citizens need a visa for Tajikistan?", a:"Not for stays of up to 30 days – German citizens enter visa-free. For up to 60 days there is an electronic visa (e-Visa); longer stays need a visa in advance. The passport must be valid for at least six more months on entry. Visitors who enter visa-free must register with the internal affairs authorities (OVIR) within ten working days.", k:"visa entry e-visa passport registration ovir travel trip"},
  protect:{q:"How are German investments protected?", a:"Germany and Tajikistan have a treaty on the promotion and reciprocal protection of investments (signed in Berlin on 27 March 2003). Expropriation is allowed only for the public good and against compensation (Art. 4). In addition, Tajikistan’s Law on Investments (Art. 24) rules out nationalisation of an investor’s property.", k:"protection protected guarantee guarantees expropriation nationalisation nationalization risk security treaty bit"},
  transfer:{q:"Can profits be transferred to Germany?", a:"Yes. The investment treaty guarantees the free transfer of all payments connected with an investment – capital, returns, loan repayments and proceeds from a sale (Art. 5). Tajik law sets no legal limits on transfers; foreign-exchange transactions go through commercial banks.", k:"profit profits transfer repatriation dividends currency somoni exchange bank"},
  dta:{q:"Is there a double taxation agreement?", a:"Yes. The agreement between Germany and Tajikistan for the avoidance of double taxation with respect to taxes on income and capital was signed on 27 March 2003 and has been in force since 21 September 2004.", k:"double taxation agreement treaty dta"},
  land:{q:"Can a foreign company buy land?", a:"No: land in Tajikistan is exclusively state property, and the law does not provide for its sale. Foreign investors receive land-use rights for up to 50 years or lease land from Tajik right-holders for up to 20 years. Buildings on the land can be privately owned.", k:"land plot property ownership buy lease real estate site"},
  reg:{q:"How do I register a company?", a:"Since 2019, state registration has run through a single window at the Tax Committee. The company then registers with the Social Insurance and Pensions Agency and the statistics authorities. The government’s investor portal is investcom.tj. The trade representative can name contacts and advisers.", k:"register registration company subsidiary incorporate llc single window tax committee set up"},
  disputes:{q:"How are disputes settled?", a:"Under the investment treaty, a dispute between an investor and the state that is not settled amicably within six months is submitted to arbitration at the investor’s request (Art. 11). Since 14 August 2012, Tajikistan has been a party to the New York Convention on the Recognition and Enforcement of Foreign Arbitral Awards.", k:"dispute disputes arbitration court award new york convention"},
  taxes:{q:"Which taxes does a company pay?", a:"Profit tax: 13 % for the production of goods, 18 % for other activities. VAT: 14 % in 2024–2026 and 13 % from 1 January 2027; reduced rates apply to some sectors. The full table is under “Invest”.", k:"tax taxes vat profit corporate rate rates"},
  fez:{q:"What do the free economic zones offer?", a:"Tajikistan has five free economic zones – Sughd, Panj, Dangara, Ishkashim and Kulob – each with its own tax and customs regime. A map and a description of each zone are under “Invest”.", k:"fez free economic zone zones incentives sughd panj dangara ishkashim kulob"},
  trip:{q:"How can I travel to Tajikistan with a delegation?", a:"The next opportunity is the business delegation trip of AHK Central Asia to Dushanbe from 3 to 6 November 2026, with meetings at ministries, companies and projects. Registration closes on 9 October 2026. The trade representative also helps with individual trips.", k:"trip travel delegation mission dushanbe visit ahk"},
  help:{q:"What does the trade representative help with?", a:"A first meeting in Berlin or by video, contacts with the State Committee on Investment and State Property Management and the sector authorities, preparing a trip, and support after the project starts.", k:"help support trade representative meeting contact advice"},
  eu:{q:"What does Tajikistan sell to the EU?", a:"In 2025 the EU imported goods worth €579 million from Tajikistan (+90.4 %). 92 % of them were base metals, followed by mineral products, textiles and vegetable products.", k:"export exports import trade eu goods metals aluminium statistics"},
  gsp:{q:"Which EU duties apply to Tajik goods?", a:"Tajikistan benefits from the EU’s Generalised Scheme of Preferences (GSP): non-sensitive goods enter duty-free, and the duty on sensitive goods is cut by 3.5 percentage points. The exact rate per product code is shown by the Access2Markets search under “Export”.", k:"duty duties customs gsp preferences tariff import"},
  exporters:{q:"Where can I find Tajik suppliers of dried fruit?", a:"Under “Export” we present verified producers from Isfara with their products, certificates and contacts – for example Barakat Isfara.", k:"buy source sourcing supplier suppliers dried fruit apricots isfara exporter producer barakat"}
 }},
 ask:{btn:"Ask", t:"Questions about Tajikistan", sub:"Answers from this website’s content, with sources", hello:"Hello! Ask a question about trade and investment – for example about visas, taxes or free economic zones.", ph:"Your question…", send:"Send", pop:"Common questions", open:"Open", src:"Sources", also:"Related", none:"This website has no exact answer to that. Ask the trade representative directly – he will reply in person.", write:"Write to the trade representative", close:"Close", privacy:"The assistant only searches this website’s content. Your question is not stored or sent anywhere.", page:"Page", zone:"Free economic zone", exp:"Exporter", evt:"Event", sector:"Sector", tax:"Taxes"},

tj:{
 faq:{k:"Саволҳои сармоягузорон", t:"Мухтасар ва бо манбаъ", l:"Саволҳои маъмултарини ширкатҳои олмонӣ — дар бораи воридшавӣ, ҳифзи ҳуқуқӣ, андозҳо ва замин.", items:{
  visa:{q:"Оё шаҳрвандони Олмон ба Тоҷикистон раводид лозим доранд?", a:"Барои сафарҳои то 30 рӯз — не: шаҳрвандони Олмон бе раводид ворид мешаванд. Барои то 60 рӯз раводиди электронӣ (e-Visa) гирифта мешавад, барои мӯҳлати дарозтар — раводид пешакӣ. Шиноснома бояд ҳангоми воридшавӣ ақаллан шаш моҳи дигар эътибор дошта бошад. Ҳангоми воридшавии бе раводид дар давоми даҳ рӯзи корӣ бояд дар мақомоти корҳои дохилӣ (ОВИР) ба қайд гирифта шуд.", k:"раводид виза воридшавӣ шиноснома сабти ном бақайдгирӣ овир сафар"},
  protect:{q:"Сармоягузории ширкатҳои олмонӣ чӣ гуна ҳифз мешавад?", a:"Олмон ва Тоҷикистон Шартнома дар бораи ҳавасмандгардонӣ ва ҳифзи мутақобилаи сармоягузориҳоро бастаанд (27 марти соли 2003 дар Берлин имзо шудааст). Мусодира танҳо барои манфиати ҷомеа ва бо ҷуброн иҷозат дода мешавад (моддаи 4). Илова бар ин, Қонуни Ҷумҳурии Тоҷикистон «Дар бораи сармоягузорӣ» (моддаи 24) милликунонии амволи сармоягузорро истисно мекунад.", k:"ҳифз кафолат кафолатҳо милликунонӣ мусодира хатар бехатарӣ шартнома"},
  transfer:{q:"Оё фоидаро ба Олмон интиқол додан мумкин аст?", a:"Бале. Шартнома интиқоли озоди ҳамаи пардохтҳои марбут ба сармоягузориро кафолат медиҳад — сармоя, даромад, бозпардохти қарз ва маблағ аз фурӯш (моддаи 5). Қонунгузории Тоҷикистон интиқолҳоро маҳдуд намекунад; амалиёти асъорӣ тавассути бонкҳои тиҷоратӣ анҷом дода мешавад.", k:"фоида интиқол дивиденд асъор сомонӣ бонк"},
  dta:{q:"Оё созишнома оид ба пешгирии андозбандии дукарата вуҷуд дорад?", a:"Бале. Созишномаи байни Олмон ва Тоҷикистон оид ба пешгирии андозбандии дукаратаи даромад ва молу мулк 27 марти соли 2003 имзо шуда, аз 21 сентябри соли 2004 эътибор дорад.", k:"андозбандии дукарата дукарата созишнома"},
  land:{q:"Оё ширкати хориҷӣ замин харида метавонад?", a:"Не: замин дар Тоҷикистон моликияти истисноии давлат аст ва фурӯши он тибқи қонун пешбинӣ нашудааст. Сармоягузорони хориҷӣ ҳуқуқи истифодаи заминро то 50 сол мегиранд ё заминро аз истифодабарандагони тоҷик то 20 сол иҷора мегиранд. Биноҳо дар замин метавонанд моликияти хусусӣ бошанд.", k:"замин қитъа моликият харидан иҷора амволи ғайриманқул"},
  reg:{q:"Ширкатро чӣ гуна ба қайд гирифтан мумкин аст?", a:"Аз соли 2019 бақайдгирии давлатӣ бо принсипи «равзанаи ягона» дар Кумитаи андоз сурат мегирад. Баъд аз он ширкат дар Агентии суғуртаи иҷтимоӣ ва нафақа ва мақомоти омор ба қайд гирифта мешавад. Портали ҳукумат барои сармоягузорон — investcom.tj. Намояндаи савдо тамосҳо ва мушовиронро пешниҳод мекунад.", k:"бақайдгирӣ ширкат таъсис равзанаи ягона кумитаи андоз"},
  disputes:{q:"Баҳсҳо чӣ гуна ҳал мешаванд?", a:"Тибқи Шартнома баҳси байни сармоягузор ва давлат, ки дар давоми шаш моҳ бо роҳи осоишта ҳал нашудааст, бо талаби сармоягузор ба арбитраж супурда мешавад (моддаи 11). Аз 14 августи соли 2012 Тоҷикистон узви Конвенсияи Ню-Йорк дар бораи эътироф ва иҷрои қарорҳои арбитражии хориҷӣ мебошад.", k:"баҳс баҳсҳо арбитраж суд конвенсия"},
  taxes:{q:"Ширкат кадом андозҳоро месупорад?", a:"Андоз аз фоида — 13 % барои истеҳсоли мол ва 18 % барои дигар намудҳои фаъолият. Андоз аз арзиши иловашуда — 14 % дар солҳои 2024–2026 ва 13 % аз 1 январи соли 2027; барои баъзе соҳаҳо меъёрҳои пасткардашуда амал мекунанд. Ҷадвали пурра — дар бахши «Сармоягузорӣ».", k:"андоз андозҳо ааи фоида меъёр"},
  fez:{q:"Минтақаҳои озоди иқтисодӣ чӣ медиҳанд?", a:"Дар Тоҷикистон панҷ минтақаи озоди иқтисодӣ ҳаст — «Суғд», «Панҷ», «Данғара», «Ишкошим» ва «Кӯлоб» — бо низоми хоси андоз ва гумрук. Харита ва тавсифи ҳар минтақа — дар бахши «Сармоягузорӣ».", k:"мои минтақа минтақаҳои озоди иқтисодӣ имтиёз суғд панҷ данғара ишкошим кӯлоб"},

<script>
/* ===== Hero: one scroll controller for the chapters and the picture =====
   With filmed frames (MEDIA.hero) the flight over the Pamirs is scrubbed by
   scroll on a 2D canvas, cross-fading between neighbouring frames so the
   motion stays fluid. Without them, the WebGL terrain (terrain.js) takes over. */
(function(){
  "use strict";
  /* film grain: one small random tile, animated in CSS over the footage */
  try{
    var g = document.createElement("canvas"); g.width = g.height = 160;
    var gx = g.getContext("2d"), d = gx.createImageData(160,160);
    for(var k=0;k<d.data.length;k+=4){ var v = Math.random()*255|0; d.data[k]=d.data[k+1]=d.data[k+2]=v; d.data[k+3]=255; }
    gx.putImageData(d,0,0);
    document.documentElement.style.setProperty("--noise", "url(" + g.toDataURL("image/png") + ")");
  }catch(e){}
  var hero = document.querySelector(".hero");
  if(!hero) return;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var chapters = [].slice.call(document.querySelectorAll(".chapter"));
  var meter = document.querySelector(".hero-meter .track i");
  var M = (window.MEDIA || {}).hero;

  function progress(){
    var r = hero.getBoundingClientRect();
    var span = hero.offsetHeight - window.innerHeight;
    return Math.max(0, Math.min(1, -r.top / span));
  }
  function band(p, a, b, c, d){
    if(p <= a || p >= d) return 0;
    if(p < b) return (p-a)/(b-a);
    if(p <= c) return 1;
    return 1 - (p-c)/(d-c);
  }

  /* ---------- looping film (preferred): native playback, scroll adds only a light parallax ---------- */
  var film = null, LOOP = (window.MEDIA || {}).loop;
  var portrait = window.innerHeight > window.innerWidth * 1.1;
  /* each orientation only uses a loop filmed for it; otherwise the frame sequence below takes over */
  var V = LOOP ? (portrait ? LOOP.s : LOOP.l) : null;
  if(V){
    document.documentElement.classList.add("has-film", "has-loop");
    var stage = document.querySelector(".hero-stage");
    var vid = document.createElement("video");
    vid.className = "loopv"; vid.muted = true; vid.defaultMuted = true; vid.loop = true; vid.playsInline = true;
    vid.setAttribute("playsinline", ""); vid.setAttribute("muted", ""); vid.setAttribute("aria-hidden", "true");
    vid.preload = "auto"; vid.poster = V.poster;
    vid.innerHTML = '<source src="'+V.webm+'" type="video/webm"><source src="'+V.mp4+'" type="video/mp4">';
    stage.insertBefore(vid, stage.querySelector(".hero-grain"));
    var still = function(){ if(vid.paused) document.documentElement.classList.add("loop-still"); };
    var kick = function(){ if(reduce) return; var pp = vid.play(); if(pp && pp.then) pp.then(function(){ document.documentElement.classList.remove("loop-still"); }).catch(still); };
    if(!reduce){ vid.autoplay = true; kick(); setTimeout(still, 2500);
      ["touchstart","pointerdown","scroll","keydown"].forEach(function(ev){ window.addEventListener(ev, function once(){ window.removeEventListener(ev, once); if(vid.paused) kick(); }, {passive:true}); });
      vid.addEventListener("playing", function(){ document.documentElement.classList.remove("loop-still"); }); }
    document.addEventListener("visibilitychange", function(){ if(!document.hidden && !reduce) vid.play().catch(function(){}); });
    film = function(p){
      vid.style.transform = "translate3d(0," + (-p*4).toFixed(2) + "%,0) scale(" + (1.06 + p*0.04).toFixed(4) + ")";
    };
  }

  /* ---------- filmed frames (fallback) ---------- */
  if(!film && M && M.n){
    document.documentElement.classList.add("has-film");
    var canvas = document.getElementById("film");
    var ctx = canvas.getContext("2d", {alpha:false});
    ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
    /* portrait screens get the native-resolution vertical crops, everything else the full 1920 frames */
    var set = (window.innerHeight > window.innerWidth * 1.1) && M.sm ? M.sm : M.lg;
    var N = M.n, imgs = new Array(N), ok = new Array(N);
    var pad = function(i){ return ("00"+i).slice(-3); };
    var load = function(i){
      if(imgs[i]) return;
      var im = new Image(); im.decoding = "async";
      im.onload = function(){ ok[i] = true; if(i === 0) dirty = true; };
      im.src = set + pad(i) + M.ext; imgs[i] = im;
    };
    /* first frame, then a coarse pass so early scrubbing already moves, then the rest */
    load(0);
    var order = [];
    [16, 8, 4, 2, 1].forEach(function(step){ for(var i=0;i<N;i+=step) if(order.indexOf(i)<0) order.push(i); });
    var q = 0;
    (function pump(){ for(var k=0;k<6 && q<order.length;k++) load(order[q++]); if(q<order.length) setTimeout(pump, 60); })();

    var W = 0, H = 0, dpr = 1, dirty = true;
    var resize = function(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.clientWidth; H = canvas.clientHeight;
      canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
      ctx.imageSmoothingEnabled = true; ctx.imageSmoothingQuality = "high";
      dirty = true;
    };
    window.addEventListener("resize", resize); resize();

    var nearest = function(i){ /* closest frame that has arrived */
      for(var d=0; d<N; d++){ if(ok[i-d]) return i-d; if(ok[i+d]) return i+d; }
      return -1;
    };
    var draw = function(im, alpha, scale){
      var iw = im.naturalWidth, ih = im.naturalHeight;
      var s = Math.max(canvas.width/iw, canvas.height/ih) * scale;
      var dw = iw*s, dh = ih*s;
      ctx.globalAlpha = alpha;
      ctx.drawImage(im, (canvas.width-dw)/2, (canvas.height-dh)*0.42, dw, dh);
    };
    var lastKey = "";
    film = function(p){
      var f = p*(N-1), i0 = Math.floor(f), t = f - i0;
      var a = nearest(i0), b = ok[i0+1] ? i0+1 : -1;
      if(a < 0) return;
      var scale = 1; /* no extra zoom: every upscale costs sharpness */
      var key = a+"|"+b+"|"+t.toFixed(3)+"|"+canvas.width+"|"+scale.toFixed(4);
      if(key === lastKey && !dirty) return;
      lastKey = key; dirty = false;
      draw(imgs[a], 1, scale);
      if(b > 0 && a === i0 && t > 0.01) draw(imgs[b], t, scale);
      ctx.globalAlpha = 1;
    };
  }

  var smoothP = 0, last = performance.now(), visible = true;
  new IntersectionObserver(function(es){ visible = es[0].isIntersecting; }, {threshold:0}).observe(hero);

  function frame(now){
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now-last)/1000); last = now;
    var p = progress();
    smoothP += (p - smoothP) * (reduce ? 1 : (1 - Math.exp(-dt*6)));
    if(Math.abs(p-smoothP) < 0.0004) smoothP = p;

    var c = [
      p < 0.22 ? 1 : Math.max(0, 1-(p-0.22)/0.08),
      band(p, 0.30, 0.38, 0.56, 0.64),
      p < 0.70 ? 0 : Math.min(1, (p-0.70)/0.08)
    ];
    for(var i=0;i<chapters.length;i++){
      chapters[i].style.opacity = c[i];
      chapters[i].style.transform = "translateY(" + ((1-c[i])*14).toFixed(1) + "px)";
      chapters[i].style.pointerEvents = c[i] > 0.6 ? "auto" : "none";
      chapters[i].classList.toggle("on", c[i] > 0.35);
    }
    if(meter) meter.style.width = (p*100).toFixed(1) + "%";
    if(!visible) return;
    if(film) film(smoothP);
    else if(window.HERO_SCENE) window.HERO_SCENE(smoothP, now, dt);
  }
  requestAnimationFrame(frame);
})();

</script>

  var frag = document.createDocumentFragment();
  n.nodeValue.split(/(\s+)/).forEach(function(part){
   if(!part) return;
   if(/^\s+$/.test(part)){ frag.appendChild(document.createTextNode(part)); return; }
   var w = document.createElement("span"); w.className = "w";
   var s = document.createElement("span"); s.style.setProperty("--i", i++); s.textContent = part;

function normT(s){ return String(s).toLowerCase().replace(/<[^>]+>/g," ").replace(/ё/g,"е").replace(/[^0-9a-zа-яәөүҳҷӣӯқғäöüßЀ-ӿ]+/g," ").trim(); }

/* tolerant word match: 1 for the same word or the same stem with a short inflected ending,
   0.6 for a longer shared stem (налоги ~ налогообложение), otherwise 0 */
function tmatch(a, b){
 if(a===b) return 1;
 var n = Math.min(a.length, b.length), d = Math.abs(a.length-b.length), p = 0;
 while(p<n && a[p]===b[p]) p++;
 if(p>=3 && p>=n-2 && d<=3) return 1;
 return p>=5 ? 0.6 : 0;
}

 askLang = lang; askIdx = X; return X;
}

 return askIndex().map(function(o){

   var bt = function(list){ var m = 0; list.forEach(function(t){ m = Math.max(m, tmatch(w,t)); }); return m; };
   var v = Math.max(3.3*bt(o.tq), 3*bt(o.tt), bt(o.bt)); /* the question itself counts a little more than its keywords */
   sc += v; if(v>=1.8) hit++;
  });
  if(o.type==="faq") sc += 0.5;
  return {o:o, sc:sc, hit:hit};
 }).filter(function(r){ return r.hit>0 && r.sc>=1.8; }).sort(function(a,b){ return b.sc-a.sc; });
}

 if(o.type==="faq"){
  var m = o.m;
  return '<p class="aq">'+o.t+'</p><p>'+L.faq.items[m.id].a+'</p><div class="qfoot">'+(m.s.length ? '<span class="qs">'+A.src+' '+refs(m.s)+'</span>' : '')+
   (m.go ? '<button class="qgo" type="button"'+askGoAttrs(o)+'>'+L.nav[m.go]+arrow+'</button>' : '')+'</div>';
 }
 return '<p class="aq"><small>'+askTypeLbl(o)+'</small>'+o.t+'</p><p>'+esc(o.b).slice(0,260)+(o.b.length>260?'…':'')+'</p><div class="qfoot"><button class="qgo" type="button"'+askGoAttrs(o)+'>'+A.open+' · '+L.nav[o.go]+arrow+'</button></div>';
}
function askPush(cls, html){
 var log = $("#askLog"), d = document.createElement("div");
 d.className = "msg "+cls; d.innerHTML = html; log.appendChild(d);
 /* a new answer is read from its first line, everything else just follows the bottom */
 log.scrollTop = (cls==="bot" && d.offsetHeight > log.clientHeight*0.6) ? d.offsetTop - 12 : log.scrollHeight;
 return d;
}
function askHello(){
 var A = L.ask;
 $("#askLog").innerHTML = "";
 askPush("bot", '<p>'+A.hello+'</p><div class="chips"><span class="cl">'+A.pop+'</span>'+ASK_POP.map(function(id){ return '<button type="button" class="qchip" data-faq="'+id+'">'+L.faq.items[id].q+'</button>'; }).join("")+'</div>');
}
function askReply(q, faqId){
 var A = L.ask, reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
 askPush("me", '<p>'+esc(q)+'</p>');
 var res = faqId ? [{o:askIndex().filter(function(o){ return o.type==="faq" && o.m.id===faqId; })[0]}] : askSearch(q);
 var wait = askPush("bot typing", '<span></span><span></span><span></span>');
 setTimeout(function(){
  wait.remove();
  if(!res.length){
   askPush("bot", '<p>'+A.none+'</p><div class="qfoot"><button class="qgo" type="button" data-awrite>'+A.write+arrow+'</button></div>').setAttribute("data-q", q);
   return;
  }
  var more = faqId ? [] : res.slice(1,4);
  askPush("bot", askAnswer(res[0].o)+(more.length ? '<div class="also"><span class="cl">'+A.also+'</span>'+more.map(function(r){
   return r.o.type==="faq" ? '<button type="button" class="qchip" data-faq="'+r.o.m.id+'">'+r.o.t+'</button>' : '<button type="button" class="qchip"'+askGoAttrs(r.o)+'><small>'+askTypeLbl(r.o)+'</small> '+r.o.t+'</button>';
  }).join("")+'</div>' : ''));
 }, reduce ? 0 : 380);
}
function askOpen(){
 var p = $("#askP"); p.hidden = false;
 requestAnimationFrame(function(){ p.classList.add("on"); });
 document.documentElement.classList.add("ask-open");
 if(!$("#askLog").children.length) askHello();
 setTimeout(function(){ $("#askF").q.focus({preventScroll:true}); }, 60);
}
function askClose(){
 var p = $("#askP"); p.classList.remove("on"); document.documentElement.classList.remove("ask-open");
 setTimeout(function(){ if(!p.classList.contains("on")) p.hidden = true; }, 260);
 $("#askFab").focus({preventScroll:true});
}
/* leave the panel for a page: on phones the panel covers the screen, so it closes */
function askNav(b){
 var r = b.getAttribute("data-ago"), an = b.getAttribute("data-aanchor"), z = b.getAttribute("data-azone"), sc = b.getAttribute("data-asector");
 if(window.innerWidth < 700) askClose();
 go(r, an || undefined);
 if(z) setTimeout(function(){ fezSelect(z); }, 30);
 if(sc) setTimeout(function(){ openSector(sc); }, 30);
}
function renderAsk(){
 var A = L.ask;
 if(!$("#askP")){
  document.body.insertAdjacentHTML("beforeend",
   '<button class="askfab" id="askFab" type="button" data-ask aria-haspopup="dialog" aria-controls="askP">'+ASK_ICON+'<span></span></button>'+
   '<section class="askp" id="askP" role="dialog" aria-labelledby="askT" hidden><header><div><b id="askT"></b><small id="askS"></small></div><button class="ax" type="button" id="askX"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>'+
   '<div class="log" id="askLog" aria-live="polite"></div>'+
   '<form id="askF" autocomplete="off"><input name="q" maxlength="200" enterkeyhint="send"><button type="submit" id="askGo"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button></form>'+
   '<p class="priv" id="askPriv"></p></section>');
  $("#askX").addEventListener("click", askClose);
  $("#askF").addEventListener("submit", function(e){ e.preventDefault(); var q = this.q.value.trim(); if(!q) return; this.q.value = ""; askReply(q); });
  $("#askLog").addEventListener("click", function(e){
   var c = e.target.closest("[data-faq]"); if(c){ askReply(c.textContent, c.getAttribute("data-faq")); return; }
   var sr = e.target.closest(".src"); if(sr){ e.preventDefault(); if(window.innerWidth < 700) askClose(); go("quellen", "src-"+sr.getAttribute("data-src")); return; }
   var g = e.target.closest("[data-ago]"); if(g){ askNav(g); return; }
   var w = e.target.closest("[data-awrite]");
   if(w){ var q = w.closest(".msg").getAttribute("data-q"); if(window.innerWidth < 700) askClose(); go("service"); setTimeout(function(){ selectForm("partner"); var t = $("#aneed"); if(t){ t.value = q; t.focus({preventScroll:true}); } }, 30); }
  });
 }
 $("#askFab span").textContent = A.btn; $("#askFab").setAttribute("aria-label", A.t);
 $("#askT").textContent = A.t; $("#askS").textContent = A.sub; $("#askPriv").textContent = A.privacy;
 $("#askX").setAttribute("aria-label", A.close); $("#askGo").setAttribute("aria-label", A.send);
 $("#askF").q.placeholder = A.ph; $("#askF").q.setAttribute("aria-label", A.ph);
 askIdx = null; $("#askLog").innerHTML = "";
}

/* delegated navigation */
document.addEventListener("click", function(e){
 var a = e.target.closest("[data-go]");
 if(a){ e.preventDefault(); var form = a.getAttribute("data-form"); go(a.getAttribute("data-go"), a.getAttribute("data-anchor") || undefined); if(form) setTimeout(function(){ selectForm(form); }, 20); return; }
 var lb = e.target.closest("[data-lang]");
 if(lb){ setLang(lb.getAttribute("data-lang")); $("#langs").classList.remove("open"); return; }
 if(e.target.closest("[data-theme-toggle]")){ toggleTheme(); return; }
 if(e.target.closest("[data-ask]")){ e.preventDefault(); if($("#askP").classList.contains("on")) askClose(); else askOpen(); return; }
 if(!e.target.closest("#langs")) $("#langs").classList.remove("open");
});
$("#langBtn").addEventListener("click", function(e){ e.stopPropagation(); $("#langs").classList.toggle("open"); });
$("#burger").addEventListener("click", function(){ $("#drawer").classList.add("open"); document.body.style.overflow="hidden"; });
$("#dclose").addEventListener("click", closeDrawer);
function closeDrawer(){ $("#drawer").classList.remove("open"); document.body.style.overflow=""; }
document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ closeDrawer(); $("#langs").classList.remove("open"); if($("#askP") && $("#askP").classList.contains("on")) askClose(); } });

function setLang(c){
 if(!C[c]) return; lang = c; L = C[c];
 try{ localStorage.setItem(LK, c); }catch(e){}
 renderChrome(); renderHero(); renderAsk(); show(current||"home");
}
function theme(){ try{ var t=localStorage.getItem(TK); if(t) return t; }catch(e){} return matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"; }
function toggleTheme(){ var t = document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme", t); try{ localStorage.setItem(TK,t); }catch(e){} paintOrnaments(); }
document.documentElement.setAttribute("data-theme", theme());

/* top bar becomes solid once the hero is behind us, or on inner pages */
function onScroll(){
 var solid = current!=="home" || window.scrollY > ($("#hero").offsetHeight - window.innerHeight - 40);
 $("#topbar").classList.toggle("solid", solid);
}
window.addEventListener("scroll", onScroll, {passive:true});
window.fitBar = fitBar;
function fitBar(){
 var tb = $("#topbar"), bar = $(".bar");
 tb.classList.remove("compact");
 if(bar.scrollWidth > bar.clientWidth + 1) tb.classList.add("compact");
}
window.addEventListener("resize", fitBar);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitBar);

$$(".flag-tj").forEach(function(f){ f.innerHTML = FLAG_TJ; });
paintOrnaments(); renderChrome(); renderHero(); renderAsk(); route();
})();

</script>

</body>
</html>
