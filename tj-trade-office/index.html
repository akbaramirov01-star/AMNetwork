<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#090D15">
<title>Tadschikistan · Handel & Investitionen</title>
<meta name="description" content="Handels- und Investitionsbüro der Botschaft der Republik Tadschikistan in Berlin.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,400;0,500;1,400&family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ground:#F3F0E9; --surface:#FBFAF6; --surface-2:#E9E5DB; --ink:#0E1420; --ink-soft:#4A5262;
  --ink-faint:#7C8392; --line:#D8D2C4; --gold:#9A7A36; --gold-soft:#B8964F; --red:#B0302A; --green:#2D6B47;
  --on-gold:#FFFDF6; --hero-ink:#F4F1EA;
  --serif:'Noto Serif Display','Noto Serif',Georgia,'Times New Roman',serif;
  --sans:'Onest',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
  --maxw:1240px; --pad:clamp(20px,4vw,56px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#090D15; --surface:#0F1520; --surface-2:#151C29; --ink:#ECE8DF; --ink-soft:#A3A9B6;
    --ink-faint:#6E7585; --line:#222B3A; --gold:#D4AF66; --gold-soft:#E2C285; --red:#D2483F; --green:#4E9A6C;
    --on-gold:#14100A;
  }
}
:root[data-theme="dark"]{
  --ground:#090D15; --surface:#0F1520; --surface-2:#151C29; --ink:#ECE8DF; --ink-soft:#A3A9B6;
  --ink-faint:#6E7585; --line:#222B3A; --gold:#D4AF66; --gold-soft:#E2C285; --red:#D2483F; --green:#4E9A6C;
  --on-gold:#14100A;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--sans);font-size:16.5px;line-height:1.65;-webkit-font-smoothing:antialiased;overflow-x:hidden}
img,svg{display:block;max-width:100%}
a{color:inherit}
h1,h2,h3,h4{margin:0;font-family:var(--serif);font-weight:500;letter-spacing:-.015em;text-wrap:balance;line-height:1.12}
p{margin:0}
button{font:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.wrap{max-width:var(--maxw);margin:0 auto;padding:0 var(--pad)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* adras band: Tajik ikat lozenges in gold, red and green */
.orn{height:14px;width:100%;background-image:var(--orn-band);background-repeat:repeat-x;background-size:auto 100%;opacity:.95}
.orn.lg{height:22px;background-image:var(--orn-band-lg)}
.flag{display:inline-block;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.12)}
.flag svg{display:block;width:100%;height:100%}
/* ---------- top bar ---------- */
.topbar{position:fixed;inset:0 0 auto 0;z-index:60;transition:background .4s ease,border-color .4s ease,color .4s ease;border-bottom:1px solid transparent;color:var(--hero-ink)}
.topbar .orn{position:absolute;top:0;left:0;right:0;height:6px;background-size:auto 6px;opacity:.9}
.topbar.solid{background:color-mix(in srgb,var(--ground) 90%,transparent);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px);border-color:var(--line);color:var(--ink)}
.bar{display:flex;align-items:center;gap:22px;height:76px}
.brand{display:grid;grid-template-columns:auto 1fr;column-gap:12px;align-items:center;text-decoration:none;line-height:1.05;margin-right:auto;flex-shrink:0;max-width:60vw}
.brand .flag{grid-row:1/3;width:34px;height:17px}
.brand b{font-family:var(--serif);font-weight:500;font-size:1.18rem;letter-spacing:-.01em;white-space:nowrap}
.brand span{grid-column:2;font-family:var(--mono);font-size:.58rem;letter-spacing:.16em;text-transform:uppercase;opacity:.7;margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav{display:flex;gap:17px}
.nav a{text-decoration:none;font-size:.82rem;font-weight:500;opacity:.78;position:relative;padding:6px 0;white-space:nowrap}
.nav a:hover,.nav a.on{opacity:1}
.nav a.on::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:1px;background:var(--gold)}
.tools{display:flex;align-items:center;gap:10px}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 12px;border:1px solid color-mix(in srgb,currentColor 28%,transparent);background:transparent;color:inherit;font-family:var(--mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;border-radius:0}
.chip:hover{border-color:currentColor}
.chip svg,.cta svg,.burger svg{flex-shrink:0;max-width:none}
.langs{position:relative}
.langs ul{position:absolute;right:0;top:calc(100% + 8px);list-style:none;margin:0;padding:6px;background:var(--surface);color:var(--ink);border:1px solid var(--line);min-width:170px;display:none;box-shadow:0 18px 40px -18px rgba(0,0,0,.4)}
.langs.open ul{display:block}
.langs li button{width:100%;text-align:left;background:none;border:0;padding:9px 12px;color:var(--ink);font-size:.9rem;display:flex;justify-content:space-between}
.langs li button:hover,.langs li button.on{background:var(--surface-2)}
.langs li button small{font-family:var(--mono);color:var(--ink-faint);font-size:.7rem}
.cta{display:inline-flex;align-items:center;gap:10px;height:42px;padding:0 20px;background:var(--gold);color:var(--on-gold);text-decoration:none;font-weight:600;font-size:.88rem;border:0;letter-spacing:.01em;transition:transform .2s ease,filter .2s ease;white-space:nowrap}
.cta:hover{filter:brightness(1.08)}
.cta:active{transform:translateY(1px)}
.cta.ghost{background:transparent;color:inherit;border:1px solid color-mix(in srgb,currentColor 35%,transparent)}
.cta svg{width:16px;height:16px}
.burger{display:none;width:42px;height:42px;background:none;border:1px solid color-mix(in srgb,currentColor 28%,transparent);color:inherit;align-items:center;justify-content:center}
.burger svg{width:20px;height:20px}
@media (max-width:1300px){.nav{display:none}.burger{display:inline-flex}}
.topbar.compact .nav{display:none}.topbar.compact .burger{display:inline-flex}
@media (max-width:760px){.tools .cta{display:none}}
@media (max-width:620px){.bar{gap:12px}.brand{max-width:calc(100vw - 150px);flex-shrink:1;min-width:0}.brand b{font-size:1.05rem}.chip.theme{display:none}}

/* drawer */
.drawer{position:fixed;inset:0;z-index:80;background:var(--ground);color:var(--ink);display:flex;flex-direction:column;padding:22px var(--pad) 30px;transform:translateY(-100%);visibility:hidden;transition:transform .55s cubic-bezier(.7,0,.2,1),visibility 0s linear .55s;overflow-y:auto}
.drawer.open{transform:none;visibility:visible;transition:transform .55s cubic-bezier(.7,0,.2,1),visibility 0s}
.drawer-head{display:flex;justify-content:space-between;align-items:center;padding-bottom:18px;border-bottom:1px solid var(--line)}
.drawer nav{display:flex;flex-direction:column;margin-top:10px}
.drawer nav a{font-family:var(--serif);font-size:clamp(1.6rem,6vw,2.4rem);text-decoration:none;padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline}
.drawer nav a small{font-family:var(--mono);font-size:.7rem;color:var(--ink-faint);letter-spacing:.1em}
.drawer nav a.on{color:var(--gold)}
.drawer-foot{margin-top:auto;padding-top:26px;display:flex;flex-wrap:wrap;gap:10px}
.drawer-foot .chip{color:var(--ink)}

/* ---------- hero (WebGL) ---------- */
.hero{position:relative;height:340vh;background:#0A0F18}
.hero-stage{position:sticky;top:0;height:100vh;height:100svh;overflow:hidden;color:var(--hero-ink)}
.hero-sky{position:absolute;inset:0;background:linear-gradient(180deg,#0B1424 0%,#23324A 46%,#7A6A58 74%,#C9A877 100%)}
#terrain{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-grain{position:absolute;inset:0;pointer-events:none;background:radial-gradient(120% 80% at 50% 110%,transparent 40%,rgba(5,8,14,.55) 100%),linear-gradient(180deg,rgba(6,9,15,.55) 0%,transparent 26%,transparent 60%,rgba(6,9,15,.65) 100%)}
.chapter{position:absolute;inset:0;display:flex;align-items:center;padding:96px var(--pad) 70px;pointer-events:none;opacity:0;transition:opacity .15s linear}
.chapter.c1{opacity:1}
.chapter .in{max-width:var(--maxw);width:100%;margin:0 auto}
.chapter .kick{font-family:var(--mono);font-size:.72rem;letter-spacing:.26em;text-transform:uppercase;opacity:.82;display:flex;align-items:center;gap:14px;margin-bottom:26px}
.chapter .kick::before{content:"";width:38px;height:1px;background:var(--gold-soft,#E2C285)}
.chapter h1,.chapter h2{font-size:clamp(2.4rem,1rem + 4.2vw,5.2rem);font-weight:400;line-height:1.04;letter-spacing:-.025em;max-width:17ch;text-shadow:0 2px 40px rgba(0,0,0,.35)}
.chapter h1 em,.chapter h2 em{font-style:italic;color:#E9CF9A}
.chapter .sub{margin-top:28px;max-width:46ch;font-size:clamp(1rem,.9rem + .4vw,1.2rem);opacity:.9;line-height:1.6;text-shadow:0 1px 18px rgba(0,0,0,.4)}
.chapter.c2 .in{text-align:center}.chapter.c2 h2{margin:0 auto;max-width:16ch}
.chapter.c2 .kick{justify-content:center}.chapter.c2 .kick::before{display:none}
.chapter.c3 .in{display:flex;justify-content:flex-end}.chapter.c3 .box{max-width:620px}
.chapter .acts{display:flex;gap:12px;flex-wrap:wrap;margin-top:34px;pointer-events:auto}
.chapter .acts .cta.ghost{color:var(--hero-ink)}
.figs-strip{display:flex;gap:clamp(18px,4vw,64px);justify-content:center;margin-top:44px;flex-wrap:wrap}
.figs-strip div{text-align:center}
.figs-strip b{display:block;font-family:var(--serif);font-weight:400;font-size:clamp(2rem,1rem + 3vw,3.6rem);line-height:1}
.figs-strip span{display:block;font-family:var(--mono);font-size:.66rem;letter-spacing:.16em;text-transform:uppercase;opacity:.75;margin-top:10px}
.hero-meter{position:absolute;left:var(--pad);right:var(--pad);bottom:28px;display:flex;align-items:center;gap:18px;font-family:var(--mono);font-size:.66rem;letter-spacing:.18em;text-transform:uppercase;opacity:.8}
.hero-meter .track{flex:1;height:1px;background:rgba(255,255,255,.22);position:relative}
.hero-meter .track i{position:absolute;left:0;top:0;bottom:0;background:#E2C285;width:0}
.hero-coord .flag{width:40px;height:20px;margin:0 0 10px auto;display:block}
.hero-coord{position:absolute;right:var(--pad);top:104px;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-align:right;opacity:.7;line-height:1.7}
@media (max-width:720px){.hero-coord{display:none}.chapter.c3 .in{justify-content:flex-start}}

/* ---------- generic sections ---------- */
main{display:block}
.page{display:none}
.page.on{display:block}
.sec{padding:clamp(72px,9vw,128px) 0;border-top:1px solid var(--line)}
.sec.flush{border-top:0}
.sec.tint{background:var(--surface)}
.kicker{font-family:var(--mono);font-size:.7rem;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);display:flex;align-items:center;gap:12px;margin-bottom:22px}
.kicker::before{content:"";width:28px;height:1px;background:currentColor}
.h2{font-size:clamp(2rem,1.1rem + 2.8vw,3.6rem);font-weight:400;max-width:22ch}
.lead{font-size:clamp(1.02rem,.96rem + .3vw,1.18rem);color:var(--ink-soft);max-width:62ch;margin-top:22px;line-height:1.7}
.head{margin-bottom:clamp(40px,5vw,72px)}
.head.split{display:grid;grid-template-columns:1.1fr .9fr;gap:48px;align-items:end}
.head.split .lead{margin-top:0}
@media (max-width:900px){.head.split{grid-template-columns:1fr;gap:18px}}
.src{font-family:var(--mono);font-size:.62rem;vertical-align:super;line-height:0;color:var(--gold);text-decoration:none;margin-left:2px;letter-spacing:0}
.src:hover{text-decoration:underline}
.note{font-size:.84rem;color:var(--ink-faint);line-height:1.6;margin-top:18px;max-width:80ch}

/* page header for inner routes */
.phead{padding:calc(76px + clamp(56px,8vw,110px)) 0 clamp(48px,6vw,84px);position:relative;overflow:hidden;background:var(--surface)}
.phead::after{content:"";position:absolute;inset:auto 0 0 0;height:1px;background:var(--line)}
.phead .crumb{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:28px}
.phead .crumb a{text-decoration:none}
.phead h1{font-size:clamp(2.6rem,1.2rem + 4.6vw,5.6rem);font-weight:400;max-width:16ch;letter-spacing:-.025em}
.phead .lead{margin-top:28px}
.phead .field{position:absolute;top:0;bottom:0;right:0;width:min(46%,620px);background-image:var(--orn-field);background-size:120px 64px;opacity:.13;pointer-events:none;-webkit-mask-image:linear-gradient(90deg,transparent,#000 40%);mask-image:linear-gradient(90deg,transparent,#000 40%)}
.phead .orn{position:absolute;left:0;right:0;bottom:0;height:14px;opacity:.75}
.phead .wrap{position:relative;z-index:1}

/* doors (two audiences) */
.doors{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--line)}
.door{position:relative;padding:clamp(32px,4vw,56px);text-decoration:none;display:flex;flex-direction:column;gap:18px;min-height:380px;overflow:hidden;background:var(--surface);transition:background .4s ease}
.door+.door{border-left:1px solid var(--line)}
.door .lab{font-family:var(--mono);font-size:.7rem;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-faint)}
.door h3{font-size:clamp(1.7rem,1.1rem + 1.6vw,2.6rem);font-weight:400;max-width:16ch}
.door p{color:var(--ink-soft);max-width:44ch}
.door ul{list-style:none;margin:6px 0 0;padding:0;display:grid;gap:8px}
.door li{font-size:.92rem;display:flex;gap:10px;color:var(--ink-soft)}
.door li::before{content:"";width:14px;height:1px;background:var(--gold);margin-top:.8em;flex-shrink:0}
.door .go{margin-top:auto;display:flex;align-items:center;gap:12px;font-weight:600;font-size:.92rem}
.door .go i{width:44px;height:44px;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;transition:transform .35s ease,background .35s ease,border-color .35s ease}
.door:hover .go i{transform:translateX(6px);background:var(--gold);border-color:var(--gold);color:var(--on-gold)}
.door .lab{display:flex;align-items:center;gap:12px}
.door .lab .flag{width:30px;height:20px}
.door.tj .lab .flag{width:34px;height:17px}
@media (max-width:860px){.doors{grid-template-columns:1fr}.door+.door{border-left:0;border-top:1px solid var(--line)}.door{min-height:0}}

/* figure board */
.board{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--ink);}
.fig{padding:28px 24px 30px 0;border-right:1px solid var(--line);min-width:0}
.fig+.fig{padding-left:24px}
.fig:last-child{border-right:0}
.fig .v{font-family:var(--serif);font-weight:400;font-size:clamp(2.4rem,1.4rem + 2.6vw,4rem);line-height:1;letter-spacing:-.02em;display:flex;align-items:baseline;gap:6px}
.fig .v small{font-size:.42em;color:var(--ink-faint);font-family:var(--sans)}
.fig .l{margin-top:14px;font-size:.92rem;color:var(--ink-soft);line-height:1.45}
.fig .d{margin-top:10px;font-family:var(--mono);font-size:.66rem;letter-spacing:.08em;color:var(--ink-faint)}
@media (max-width:900px){.board{grid-template-columns:1fr 1fr}.fig:nth-child(2){border-right:0}.fig:nth-child(-n+2){border-bottom:1px solid var(--line)}.fig:nth-child(3){padding-left:0}}
@media (max-width:480px){.board{grid-template-columns:1fr}.fig{border-right:0;border-bottom:1px solid var(--line);padding-left:0!important}}

/* feature rows */
.rows{border-top:1px solid var(--line)}
.row{display:grid;grid-template-columns:72px 1fr 1.25fr;gap:28px;padding:30px 0;border-bottom:1px solid var(--line);align-items:start}
.row .n{font-family:var(--mono);font-size:.74rem;color:var(--gold);padding-top:6px}
.row h3{font-size:clamp(1.3rem,1rem + .8vw,1.75rem);font-weight:400}
.row p{color:var(--ink-soft)}
@media (max-width:820px){.row{grid-template-columns:44px 1fr}.row p{grid-column:2}}

/* sector cards */
.sectors{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line)}
.sector{background:var(--ground);padding:34px 30px 36px;display:flex;flex-direction:column;gap:14px;min-height:300px;position:relative;cursor:pointer;text-align:left;border:0;color:inherit;transition:background .35s ease}
.sector:hover{background:var(--surface)}
.sector .ico{width:42px;height:42px;color:var(--gold)}
.sector h3{font-size:1.5rem;font-weight:400}
.sector p{color:var(--ink-soft);font-size:.95rem}
.sector .tag{margin-top:auto;font-family:var(--mono);font-size:.66rem;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);display:flex;justify-content:space-between;align-items:center}
.sector .tag i{font-style:normal;color:var(--gold);font-size:1rem;transition:transform .3s}
.sector:hover .tag i{transform:translateX(4px)}
@media (max-width:980px){.sectors{grid-template-columns:1fr 1fr}}
@media (max-width:620px){.sectors{grid-template-columns:1fr}}

/* sector dossier (expanded) */
.dossier{display:none;grid-column:1/-1;background:var(--surface);padding:clamp(28px,4vw,52px)}
.dossier.on{display:grid;grid-template-columns:1fr 1fr;gap:clamp(24px,4vw,64px)}
.dossier h4{font-family:var(--mono);font-size:.7rem;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);font-weight:500;margin-bottom:12px}
.dossier ul{margin:0;padding:0;list-style:none;display:grid;gap:10px}
.dossier li{display:flex;gap:12px;color:var(--ink-soft);font-size:.95rem}
.dossier li::before{content:"";width:12px;height:1px;background:var(--gold);margin-top:.8em;flex-shrink:0}
.dossier .big{font-family:var(--serif);font-size:clamp(1.4rem,1rem + 1vw,2rem);line-height:1.3;font-weight:400}
@media (max-width:820px){.dossier.on{grid-template-columns:1fr}}

/* split media block */
.split2{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,5vw,80px);align-items:start}
@media (max-width:900px){.split2{grid-template-columns:1fr}}

/* trade bars */
.bars{display:grid;gap:22px;margin-top:8px}
.barrow .bl{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:8px;gap:12px}
.barrow .bl b{font-family:var(--mono);font-weight:500}
.barrow .bt{height:10px;background:var(--surface-2);position:relative;overflow:hidden}
.barrow .bt i{position:absolute;inset:0 auto 0 0;width:0;transition:width 1.6s cubic-bezier(.16,1,.3,1)}
.barrow.de .bt i{background:var(--ink)}
.barrow.tj .bt i{background:var(--gold)}
.quote{border-left:2px solid var(--gold);padding:6px 0 6px 22px;font-family:var(--serif);font-size:clamp(1.25rem,1rem + .8vw,1.7rem);line-height:1.35;margin-top:30px}

/* key-value table */
.kv{width:100%;border-collapse:collapse}
.kv td{padding:15px 0;border-bottom:1px solid var(--line);vertical-align:top;font-size:.95rem}
.kv td:first-child{color:var(--ink-soft);padding-right:20px}
.kv td:last-child{text-align:right;font-family:var(--mono);font-size:.92rem;white-space:nowrap}
.kv tr:first-child td{border-top:1px solid var(--ink)}

/* treaties timeline */
.tl{position:relative;display:grid;gap:0;border-top:1px solid var(--line)}
.tl .t{display:grid;grid-template-columns:150px 1fr;gap:28px;padding:26px 0;border-bottom:1px solid var(--line)}
.tl .t .dt{font-family:var(--mono);font-size:.8rem;color:var(--gold)}
.tl .t h3{font-size:1.3rem;font-weight:400}
.tl .t p{color:var(--ink-soft);margin-top:8px;font-size:.95rem}
@media (max-width:640px){.tl .t{grid-template-columns:1fr;gap:6px}}

/* FEZ map */
.fezwrap{display:grid;grid-template-columns:1.15fr .85fr;gap:0;border:1px solid var(--line);background:var(--surface)}
.fezmap{position:relative;min-height:440px;border-right:1px solid var(--line)}
.fezmap svg{width:100%;height:100%}
.fezmap .pin{cursor:pointer}
.fezmap .pin circle.core{fill:var(--gold);transition:r .3s}
.fezmap .pin circle.halo{fill:none;stroke:var(--gold);opacity:.5}
.fezmap .pin text{fill:var(--ink);font-family:var(--mono);font-size:11px;letter-spacing:.06em}
.fezmap .pin.on circle.core{fill:var(--red)}
.fezmap .cap{position:absolute;left:18px;top:14px;font-family:var(--mono);font-size:.62rem;letter-spacing:.1em;color:var(--ink-faint);max-width:80%}

.ftabs{display:flex;flex-direction:column;border-top:1px solid var(--ink)}

      out.push(rect(c-wo+bleed, y, wo-wi, cols[0]));
      out.push(rect(c+wi+bleed, y, wo-wi, cols[0]));
      if(wc > 0){ out.push(rect(c-wc+bleed*1.6, y, wc*2, cols[1])); }
      var wk = Math.max(0, t*W*0.46 - W*0.33);
      if(wk > 0){ out.push(rect(c-wk-bleed, y, wk*2, cols[2])); }
    }
  }
  /* half-lozenges at the tile edges so tiles interlock */
  for(var j=0;j<rows;j++){
    var tt = Math.abs((j+0.5) - half)/half, ww = tt*W*0.16;
    if(ww>0.5){ out.push(rect(0, j*2, ww, cols[0])); out.push(rect(W-ww, j*2, ww, cols[0])); }
  }
  function rect(x,y,w,f){ return '<rect x="'+x.toFixed(1)+'" y="'+y+'" width="'+Math.max(0,w).toFixed(1)+'" height="2" fill="'+f+'"/>'; }
  return '<svg xmlns="http://www.w3.org/2000/svg" width="'+W+'" height="'+H+'" viewBox="0 0 '+W+' '+H+'">'+out.join("")+'</svg>';
}

<script>
/* ===== Hero: one scroll controller for the chapters and the picture =====
   With filmed frames (MEDIA.hero) the flight over the Pamirs is scrubbed by
   scroll on a 2D canvas, cross-fading between neighbouring frames so the
   motion stays fluid. Without them, the WebGL terrain (terrain.js) takes over. */
(function(){
  "use strict";
  var hero = document.querySelector(".hero");
  if(!hero) return;
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var chapters = [].slice.call(document.querySelectorAll(".chapter"));
  var meter = document.querySelector(".hero-meter .track i");
  var M = (window.MEDIA || {}).hero;

  function progress(){
    var r = hero.getBoundingClientRect();
    var span = hero.offsetHeight - window.innerHeight;
    return Math.max(0, Math.min(1, -r.top / span));
  }
  function band(p, a, b, c, d){
    if(p <= a || p >= d) return 0;
    if(p < b) return (p-a)/(b-a);
    if(p <= c) return 1;
    return 1 - (p-c)/(d-c);
  }

  /* ---------- filmed frames ---------- */
  var film = null;
  if(M && M.n){
    document.documentElement.classList.add("has-film");
    var canvas = document.getElementById("film");
    var ctx = canvas.getContext("2d", {alpha:false});
    var small = Math.min(screen.width, screen.height) < 760;
    var set = small && M.sm ? M.sm : M.lg;
    var N = M.n, imgs = new Array(N), ok = new Array(N);
    var pad = function(i){ return ("00"+i).slice(-3); };
    var load = function(i){
      if(imgs[i]) return;
      var im = new Image(); im.decoding = "async";
      im.onload = function(){ ok[i] = true; if(i === 0) dirty = true; };
      im.src = set + pad(i) + M.ext; imgs[i] = im;
    };
    /* first frame, then a coarse pass so early scrubbing already moves, then the rest */
    load(0);
    var order = [];
    [16, 8, 4, 2, 1].forEach(function(step){ for(var i=0;i<N;i+=step) if(order.indexOf(i)<0) order.push(i); });
    var q = 0;
    (function pump(){ for(var k=0;k<6 && q<order.length;k++) load(order[q++]); if(q<order.length) setTimeout(pump, 60); })();

    var W = 0, H = 0, dpr = 1, dirty = true;
    var resize = function(){
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = canvas.clientWidth; H = canvas.clientHeight;
      canvas.width = Math.round(W*dpr); canvas.height = Math.round(H*dpr);
      dirty = true;
    };
    window.addEventListener("resize", resize); resize();

    var nearest = function(i){ /* closest frame that has arrived */
      for(var d=0; d<N; d++){ if(ok[i-d]) return i-d; if(ok[i+d]) return i+d; }
      return -1;
    };
    var draw = function(im, alpha, scale){
      var iw = im.naturalWidth, ih = im.naturalHeight;
      var s = Math.max(canvas.width/iw, canvas.height/ih) * scale;
      var dw = iw*s, dh = ih*s;
      ctx.globalAlpha = alpha;
      ctx.drawImage(im, (canvas.width-dw)/2, (canvas.height-dh)*0.42, dw, dh);
    };
    var lastKey = "";
    film = function(p){
      var f = p*(N-1), i0 = Math.floor(f), t = f - i0;
      var a = nearest(i0), b = ok[i0+1] ? i0+1 : -1;
      if(a < 0) return;
      var scale = 1.02 + p*0.05; /* slow push-in on top of the filmed move */
      var key = a+"|"+b+"|"+t.toFixed(3)+"|"+canvas.width+"|"+scale.toFixed(4);
      if(key === lastKey && !dirty) return;
      lastKey = key; dirty = false;
      draw(imgs[a], 1, scale);
      if(b > 0 && a === i0 && t > 0.01) draw(imgs[b], t, scale);
      ctx.globalAlpha = 1;
    };
  }

  var smoothP = 0, last = performance.now(), visible = true;
  new IntersectionObserver(function(es){ visible = es[0].isIntersecting; }, {threshold:0}).observe(hero);

  function frame(now){
    requestAnimationFrame(frame);
    var dt = Math.min(0.05, (now-last)/1000); last = now;
    var p = progress();
    smoothP += (p - smoothP) * (reduce ? 1 : (1 - Math.exp(-dt*6)));
    if(Math.abs(p-smoothP) < 0.0004) smoothP = p;

    var c = [
      p < 0.22 ? 1 : Math.max(0, 1-(p-0.22)/0.08),
      band(p, 0.30, 0.38, 0.56, 0.64),
      p < 0.70 ? 0 : Math.min(1, (p-0.70)/0.08)
    ];
    for(var i=0;i<chapters.length;i++){
      chapters[i].style.opacity = c[i];
      chapters[i].style.transform = "translateY(" + ((1-c[i])*14).toFixed(1) + "px)";
      chapters[i].style.pointerEvents = c[i] > 0.6 ? "auto" : "none";
    }
    if(meter) meter.style.width = (p*100).toFixed(1) + "%";
    if(!visible) return;
    if(film) film(smoothP);
    else if(window.HERO_SCENE) window.HERO_SCENE(smoothP, now, dt);
  }
  requestAnimationFrame(frame);
})();

</script>

function fezMap(){

 function Y(lat){ return 50 + (maxLat-lat)/(maxLat-minLat)*(H-90); }
 var g = '';
 for(var lo=68; lo<=72; lo++) g += '<line x1="'+X(lo)+'" y1="20" x2="'+X(lo)+'" y2="'+(H-30)+'" stroke="currentColor" stroke-opacity=".08"/><text x="'+X(lo)+'" y="'+(H-14)+'" font-size="9" text-anchor="middle" fill="currentColor" opacity=".35" font-family="IBM Plex Mono,monospace">'+lo+'°E</text>';
 for(var la=37; la<=41; la++) g += '<line x1="30" y1="'+Y(la)+'" x2="'+(W-20)+'" y2="'+Y(la)+'" stroke="currentColor" stroke-opacity=".08"/><text x="8" y="'+(Y(la)+3)+'" font-size="9" fill="currentColor" opacity=".35" font-family="IBM Plex Mono,monospace">'+la+'°N</text>';
 CITIES.forEach(function(c){ if(c.n==="Khujand") return; g += '<g><rect x="'+(X(c.lon)-4)+'" y="'+(Y(c.lat)-4)+'" width="8" height="8" fill="none" stroke="currentColor" stroke-opacity=".7"/><text x="'+(X(c.lon)-10)+'" y="'+(Y(c.lat)+4)+'" text-anchor="end" font-size="11" fill="currentColor" opacity=".75" font-family="IBM Plex Mono,monospace">'+c.n+'</text></g>'; });
 ZONES.forEach(function(z){
  var nm = L.invest.zones[z.id].n.replace(/^(FWZ|СЭЗ|FEZ|МОИ)\s*/,"");
  g += '<g class="pin" data-zone="'+z.id+'" tabindex="0" role="button" aria-label="'+esc(L.invest.zones[z.id].n)+'"><circle class="halo" cx="'+X(z.lon)+'" cy="'+Y(z.lat)+'" r="14"><animate attributeName="r" values="7;18;7" dur="3.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".6;0;.6" dur="3.2s" repeatCount="indefinite"/></circle><circle class="core" cx="'+X(z.lon)+'" cy="'+Y(z.lat)+'" r="6"/><text x="'+(X(z.lon)+12)+'" y="'+(Y(z.lat)+4)+'">'+nm+'</text></g>';
 });
 host.innerHTML = '<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet" style="color:var(--ink)">'+g+'</svg><div class="cap">'+L.invest.zcap+'</div>';
 $$(".pin", host).forEach(function(p){
  p.addEventListener("click", function(){ fezSelect(p.getAttribute("data-zone")); });

 return phead("quellen", S.h1, S.lead, 11)+'<section class="sec flush"><div class="wrap"><ol class="srcs">'+
  SRC.map(function(s,i){ return s?'<li id="src-'+i+'"><b>['+i+']</b><a href="'+s.u+'" target="_blank" rel="noopener">'+s.t+'</a></li>':""; }).join("")+'</ol>'+(MD.s?'<p class="ainote" style="margin-top:40px;max-width:70ch">'+L.foot.ai+'</p>':'')+'</div></section>';
}
function pageContact(){
 var K = L.contact;
 return phead("kontakt", K.h1, K.lead, 12)+'<section class="sec flush"><div class="wrap"><div class="cgrid"><div class="rv"><h3>'+K.emb+'</h3><p>'+K.embT+' '+sref(17)+'</p></div><div class="rv"><h3>'+K.off+'</h3><p>'+K.offT+'</p></div><div class="rv"><h3>'+K.hrs+'</h3><p>'+K.hrsT+'</p></div></div><p class="note rv">'+K.note+'</p></div></section>';
}
function pageLegal(which){
 var t = LEGAL[which];
 return phead(which, t.h1, t.lead, 13)+'<section class="sec flush"><div class="wrap legal">'+(lang!=="de"?'<p class="warn">'+LEGALNOTE[lang]+'</p>':'')+t.body+'</div></section>';
}

var PAGES = {home:pageHome, tadschikistan:pageLand, branchen:pageSectors, investieren:pageInvest, export:pageExport, termine:pageEvents, aktuelles:pageNews, service:pageService, dokumente:pageDocs, quellen:pageSources, kontakt:pageContact, impressum:function(){return pageLegal("impressum");}, datenschutz:function(){return pageLegal("datenschutz");}};

/* ------------------------------------------------------------ routing */
var current = null;
function route(){
 var h = (location.hash||"").replace("#","");
 var target = null;
 if(h.indexOf("src-")===0){ go("quellen", h); return; }
 if(ROUTES.indexOf(h)===-1) h = "home";
 show(h);
}
function go(r, anchor){
 if(location.hash !== "#"+r) history.pushState(null, "", "#"+r);
 show(r, anchor);
}
function show(r, anchor){
 current = r;
 var isHome = r==="home";
 $("#hero").hidden = !isHome;
 var host = $("#page");
 host.innerHTML = PAGES[r]();
 wire(host);
 $$("#nav a, #dnav a").forEach(function(a){ a.classList.toggle("on", a.getAttribute("data-go")===r); });
 document.title = (isHome ? L.brand : (L.nav[r]||(LEGAL[r]&&LEGAL[r].h1)||"")+" · "+L.brand);
 closeDrawer();
 if(anchor){ var el = document.getElementById(anchor); if(el){ el.scrollIntoView({block:"center"}); el.style.color="var(--gold)"; return; } }
 window.scrollTo(0, 0);
 onScroll();
}
window.addEventListener("popstate", route);

/* ------------------------------------------------------------ wiring */
var revealer = ("IntersectionObserver" in window) ? new IntersectionObserver(function(es){
 es.forEach(function(e){ if(e.isIntersecting){ e.target.classList.add("in"); revealer.unobserve(e.target); } });
},{rootMargin:"0px 0px -6% 0px", threshold:0.06}) : null;

function wire(root){
 $$(".band video[autoplay]", root).forEach(function(v){ v.muted = true; var pr = v.play(); if(pr && pr.catch) pr.catch(function(){}); });
 $$(".rv", root).forEach(function(el, i){
  if(!revealer){ el.classList.add("in"); return; }
  var r = el.getBoundingClientRect();
  if(r.top < window.innerHeight*0.98){ setTimeout(function(){ el.classList.add("in"); }, 60 + (i%6)*70); }
  else revealer.observe(el);
 });
 $$(".barrow .bt i", root).forEach(function(b){ setTimeout(function(){ b.style.width = b.getAttribute("data-w")+"%"; }, 300); });
 $$("[data-sector]", root).forEach(function(b){
  b.addEventListener("click", function(){
   var id = b.getAttribute("data-sector");
   if(current==="home"){ go("branchen"); setTimeout(function(){ openSector(id); }, 30); return; }
   openSector(id);
  });
 });
 if($("#fezmap", root)) fezMap();
 $$("#newsTabs button", root).forEach(function(b){
  b.addEventListener("click", function(){
   $$("#newsTabs button").forEach(function(x){ x.classList.toggle("on", x===b); });
   $("#newsFeed").innerHTML = newsRows(b.getAttribute("data-cat")); wire($("#newsFeed"));
  });
 });
 $$("#ftabs button", root).forEach(function(b){ b.addEventListener("click", function(){ selectForm(b.getAttribute("data-f")); }); });
 $$("form.f", root).forEach(function(f){
  f.addEventListener("submit", function(e){ e.preventDefault(); var bad = $$("[required]", f).filter(function(i){ return !i.value.trim(); })[0]; if(bad){ bad.focus(); return; } $(".ok", f).classList.add("on"); f.reset(); });
 });
 $$(".src", root).forEach(function(a){ a.addEventListener("click", function(e){ e.preventDefault(); go("quellen", "src-"+a.getAttribute("data-src")); }); });
}
function selectForm(k){
 $$("#ftabs button").forEach(function(x){ x.classList.toggle("on", x.getAttribute("data-f")===k); });
 $$("form.f").forEach(function(x){ x.classList.toggle("on", x.getAttribute("data-f")===k); });
}
function openSector(id){
 var s = L.sectors.filter(function(x){ return x.id===id; })[0];
 var old = $("#dossier"); if(old) old.remove();
 var cards = $$("#secGrid .sector"); var idx = 0;
 cards.forEach(function(c,i){ c.style.background=""; if(c.getAttribute("data-sector")===id){ idx=i; c.style.background="var(--surface)"; } });
 var cols = window.innerWidth>980?3:window.innerWidth>620?2:1;
 var after = cards[Math.min(cards.length-1, Math.floor(idx/cols)*cols + cols-1)];
 after.insertAdjacentHTML("afterend", dossier(s));
 wire($("#dossier").parentNode.querySelector("#dossier"));
 $("#dossier").scrollIntoView({behavior:"smooth", block:"nearest"});
}

/* delegated navigation */
document.addEventListener("click", function(e){
 var a = e.target.closest("[data-go]");
 if(a){ e.preventDefault(); var form = a.getAttribute("data-form"); go(a.getAttribute("data-go")); if(form) setTimeout(function(){ selectForm(form); }, 20); return; }
 var lb = e.target.closest("[data-lang]");
 if(lb){ setLang(lb.getAttribute("data-lang")); $("#langs").classList.remove("open"); return; }
 if(e.target.closest("[data-theme-toggle]")){ toggleTheme(); return; }
 if(!e.target.closest("#langs")) $("#langs").classList.remove("open");
});
$("#langBtn").addEventListener("click", function(e){ e.stopPropagation(); $("#langs").classList.toggle("open"); });
$("#burger").addEventListener("click", function(){ $("#drawer").classList.add("open"); document.body.style.overflow="hidden"; });
$("#dclose").addEventListener("click", closeDrawer);
function closeDrawer(){ $("#drawer").classList.remove("open"); document.body.style.overflow=""; }
document.addEventListener("keydown", function(e){ if(e.key==="Escape"){ closeDrawer(); $("#langs").classList.remove("open"); } });

function setLang(c){
 if(!C[c]) return; lang = c; L = C[c];
 try{ localStorage.setItem(LK, c); }catch(e){}
 renderChrome(); renderHero(); show(current||"home");
}
function theme(){ try{ var t=localStorage.getItem(TK); if(t) return t; }catch(e){} return matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"; }
function toggleTheme(){ var t = document.documentElement.getAttribute("data-theme")==="dark"?"light":"dark"; document.documentElement.setAttribute("data-theme", t); try{ localStorage.setItem(TK,t); }catch(e){} paintOrnaments(); }
document.documentElement.setAttribute("data-theme", theme());

/* top bar becomes solid once the hero is behind us, or on inner pages */
function onScroll(){
 var solid = current!=="home" || window.scrollY > ($("#hero").offsetHeight - window.innerHeight - 40);
 $("#topbar").classList.toggle("solid", solid);
}
window.addEventListener("scroll", onScroll, {passive:true});
window.fitBar = fitBar;
function fitBar(){
 var tb = $("#topbar"), bar = $(".bar");
 tb.classList.remove("compact");
 if(bar.scrollWidth > bar.clientWidth + 1) tb.classList.add("compact");
}
window.addEventListener("resize", fitBar);
if(document.fonts && document.fonts.ready) document.fonts.ready.then(fitBar);

$$(".flag-tj").forEach(function(f){ f.innerHTML = FLAG_TJ; });
paintOrnaments(); renderChrome(); renderHero(); route();
})();

</script>

</body>
</html>
