<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Открытый отчёт — AM Network</title>
<meta name="description" content="Every payout AM Network has verified: amount, date, region and an in-person check — without names or addresses. Each entry is chained by SHA-256 so it cannot be quietly changed.">
<link rel="canonical" href="https://amnetwork.io/transparency/">
<meta property="og:title" content="Open payout report — AM Network">
<meta property="og:description" content="Every verified payout, without personal data, chained by SHA-256.">
<meta property="og:url" content="https://amnetwork.io/transparency/">
<meta property="og:image" content="https://amnetwork.io/og-image.jpg">
<link rel="icon" type="image/x-icon" href="/favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#0A1A11">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://pziakammdazyytxubtrj.supabase.co; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="robots" content="noindex">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
<script>try{var th=localStorage.getItem('amn_theme');if(th==='light'||th==='dark')document.documentElement.dataset.theme=th}catch(e){}</script>
<style>
[data-theme="dark"]{--bg1:#0A1A11;--gold:#C9A84C;--gold2:#E8C87A;--gold3:rgba(201,168,76,.12);--text:#fff;--text2:rgba(255,255,255,.68);--text3:rgba(255,255,255,.45);--border:rgba(255,255,255,.1);--card:rgba(255,255,255,.04);--nav-bg:rgba(10,26,17,.92);--ok:#5FD39A;--ok-bg:rgba(95,211,154,.12);--bad:#FF8A8A;--bad-bg:rgba(255,138,138,.12)}
[data-theme="light"]{--bg1:#F5F0E8;--gold:#A88528;--gold2:#8A6A12;--gold3:rgba(201,168,76,.14);--text:#1C2E1F;--text2:rgba(28,46,31,.75);--text3:rgba(28,46,31,.55);--border:rgba(28,69,50,.14);--card:rgba(255,255,255,.85);--nav-bg:rgba(245,240,232,.95);--ok:#1E7A4C;--ok-bg:rgba(30,122,76,.1);--bad:#B42318;--bad-bg:rgba(180,35,24,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg1);color:var(--text);font:15px/1.6 'DM Sans',system-ui,sans-serif;min-height:100vh}
a{color:var(--gold)}
nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;height:60px;background:var(--nav-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-logo img{height:34px;display:block}
.nav-right{display:flex;gap:8px;align-items:center}
.nbtn{min-height:38px;min-width:38px;padding:0 10px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text2);font:600 13px 'DM Sans',sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.nbtn:hover,.nbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.nbtn:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:28px 16px 80px}
h1{font:700 clamp(28px,5vw,40px)/1.2 'Cormorant Garamond',serif;margin-bottom:8px}
h2{font:700 22px/1.3 'Cormorant Garamond',serif;margin:28px 0 10px}
.sub{color:var(--text2);max-width:680px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.stat b{display:block;font:700 30px/1.1 'Cormorant Garamond',serif;color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}
th{font-size:12px;color:var(--text3);font-weight:600;white-space:nowrap}
td.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.hash{font:11.5px ui-monospace,Menlo,monospace;color:var(--text3);overflow-wrap:anywhere}
.btn{min-height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--gold);background:var(--gold);color:#16130a;font:600 14px 'DM Sans',sans-serif;cursor:pointer}
.msg{padding:12px 14px;border-radius:12px;font-size:14px;margin-top:12px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.err{background:var(--bad-bg);color:var(--bad)}
ol.how{padding-inline-start:20px;display:grid;gap:6px;color:var(--text2);max-width:720px}
.muted{color:var(--text3)}
.cards{display:none;gap:10px}
.pc{border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:var(--card)}
.pc .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pc .top b{font-size:17px}
@media (max-width:680px){.tw table{display:none}.cards{display:grid}#log.card{background:transparent;border:0;padding:0}}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--gold3);color:var(--gold);font-size:12px;font-weight:600;margin:2px 4px 2px 0}
</style>
</head>
<body>
<nav>
  <a class="nav-logo" href="/"><img src="/logo.webp" alt="AM Network" height="34"></a>
  <div class="nav-right">
    <a class="nbtn" href="/cabinet/" id="navCab"></a>
    <select class="nbtn" id="langSel" aria-label="Language" style="width:auto;padding:0 8px"><option value="ru">RU</option><option value="tj">TJ</option><option value="en">EN</option></select>
    <button class="nbtn" id="themeBtn" aria-label="Theme"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 3a9 9 0 0 0 0 18z" fill="currentColor"/></svg></button>
  </div>
</nav>
<main>
  <h1 id="h1"></h1>
  <p class="sub" id="intro"></p>
  <div class="stats" id="stats"></div>
  <div class="card tw" id="log"></div>
  <div style="margin-top:14px"><button class="btn" id="verify"></button><div id="vres"></div></div>
  <h2 id="howT"></h2>
  <ol class="how" id="how"></ol>
</main>
<script src="/vendor/supabase-2.118.0.js"></script>
<script src="/vendor/amn-supabase.js"></script>
<script>
'use strict';
const T={
ru:{title:'Открытый отчёт',cab:'Кабинет',intro:'Каждая выплата, которую AM Network проверил: сумма, дата, город или район и проверка семьи на месте. Имён, телефонов и адресов здесь нет. Деньги через нас не проходят — донор передаёт их семье напрямую.',
 families:'Семей получили помощь',payouts:'Выплат',apps:'Заявок подано',verified:'Проверено на месте',total:'Передано, сомони',
 date:'Дата',ref:'Заявка',region:'Город / район',sit:'Положение',amount:'Сумма',checks:'Проверок',receipt:'Чек',hash:'Отпечаток записи',
 yes:'есть',no:'—',empty:'Выплат пока нет. Первые появятся во время пилота.',loading:'Загрузка…',err:'Не удалось загрузить отчёт. Попробуйте позже.',
 verify:'Проверить цепочку',vOk:'Цепочка цела: все {n} записей сходятся.',vBad:'Запись №{n} не сходится — сообщите нам: contact@amnetwork.io.',
 howT:'Как устроена проверка',
 how:['Семья подаёт заявку. Проверяющий AM Network лично приезжает к семье и отмечает, что подтвердил.','Администратор одобряет помощь только после проверки на месте. Тот, кто привёл семью, сам её не проверяет.','Донор передаёт закят семье напрямую: наличными, через Alif или Корти Миллӣ. AM Network денег не держит.','Каждая выплата получает отпечаток SHA-256, связанный с предыдущей записью. Если кто-то тихо изменит старую запись, цепочка разорвётся — это видно по кнопке выше.','Чек хранится у нас как отпечаток, а не как файл. По нему можно доказать, что чек не подменён.'],
 zakat:'закят',sadaqah:'садака'},
tj:{title:'Ҳисоботи кушода',cab:'Кабинет',intro:'Ҳар пардохте, ки AM Network тафтиш кардааст: маблағ, сана, шаҳр ё ноҳия ва тафтиши оила дар ҷой. Ном, телефон ва суроға дар ин ҷо нест. Пул аз мо намегузарад — саховатманд онро бевосита ба оила медиҳад.',
 families:'Оилаҳо кӯмак гирифтанд',payouts:'Пардохтҳо',apps:'Аризаҳо дода шуд',verified:'Дар ҷой тафтиш шуд',total:'Супорида шуд, сомонӣ',
 date:'Сана',ref:'Ариза',region:'Шаҳр / ноҳия',sit:'Вазъ',amount:'Маблағ',checks:'Тафтишҳо',receipt:'Чек',hash:'Изи сабт',
 yes:'ҳаст',no:'—',empty:'Ҳоло пардохт нест. Аввалинҳо дар вақти озмоиш пайдо мешаванд.',loading:'Боргирӣ…',err:'Ҳисобот бор нашуд. Баъдтар кӯшиш кунед.',
 verify:'Санҷидани занҷир',vOk:'Занҷир солим аст: ҳамаи {n} сабт мувофиқанд.',vBad:'Сабти №{n} мувофиқ нест — ба мо хабар диҳед: contact@amnetwork.io.',
 howT:'Тафтиш чӣ тавр сохта шудааст',
 how:['Оила ариза медиҳад. Тафтишгари AM Network шахсан ба назди оила меравад ва он чиро тасдиқ кард, қайд мекунад.','Маъмур кӯмакро танҳо баъди тафтиш дар ҷой тасдиқ мекунад. Касе, ки оиларо овард, худаш онро тафтиш намекунад.','Саховатманд закотро бевосита ба оила медиҳад: нақд, тавассути Alif ё Корти Миллӣ. AM Network пул нигоҳ намедорад.','Ҳар пардохт изи SHA-256 мегирад, ки бо сабти пешина пайваст аст. Агар касе сабти кӯҳнаро пинҳонӣ иваз кунад, занҷир канда мешавад — инро тугмаи боло нишон медиҳад.','Чек дар мо ҳамчун из нигоҳ дошта мешавад, на ҳамчун файл. Бо он исбот кардан мумкин аст, ки чек иваз нашудааст.'],
 zakat:'закот',sadaqah:'садақа'},
en:{title:'Open report',cab:'Cabinet',intro:'Every payout AM Network has verified: amount, date, city or district and an in-person check of the family. No names, phones or addresses. Money never passes through us — the donor gives it to the family directly.',
 families:'Families helped',payouts:'Payouts',apps:'Applications',verified:'Verified in person',total:'Given, somoni',
 date:'Date',ref:'Application',region:'City / district',sit:'Situation',amount:'Amount',checks:'Checks',receipt:'Receipt',hash:'Entry fingerprint',
 yes:'yes',no:'—',empty:'No payouts yet. The first ones will appear during the pilot.',loading:'Loading…',err:'Could not load the report. Please try later.',
 verify:'Check the chain',vOk:'The chain is intact: all {n} entries match.',vBad:'Entry #{n} does not match — please tell us: contact@amnetwork.io.',
 howT:'How the checking works',
 how:['A family applies. An AM Network verifier visits the family in person and records what they confirmed.','The admin approves help only after the in-person check. Whoever brought the family never checks it themselves.','The donor gives Zakat to the family directly: cash, Alif or Korti Milli. AM Network never holds the money.','Each payout gets a SHA-256 fingerprint linked to the previous entry. If anyone quietly changes an old entry, the chain breaks — the button above shows it.','We keep the receipt as a fingerprint, not as a file. It proves the receipt was not swapped.'],
 zakat:'Zakat',sadaqah:'Sadaqah'}
};
const CATS={widow:{ru:'вдова / одинокая мать',tj:'бевазан / модари танҳо',en:'widow / single mother'},orphan:{ru:'сироты',tj:'ятимон',en:'orphans'},elderly:{ru:'пожилые',tj:'пиронсолон',en:'elderly'},disabled:{ru:'инвалидность',tj:'маъюбӣ',en:'disability'},poverty:{ru:'бедность',tj:'камбизоатӣ',en:'poverty'},student:{ru:'студент',tj:'донишҷӯ',en:'student'},debt:{ru:'долг',tj:'қарз',en:'debt'},refugee:{ru:'беженцы',tj:'гурезаҳо',en:'refugees'},ill:{ru:'болезнь',tj:'беморӣ',en:'illness'},large:{ru:'многодетные',tj:'серфарзанд',en:'large family'},food:{ru:'нехватка еды',tj:'камии ғизо',en:'food'},convert:{ru:'новый мусульманин',tj:'навмусулмон',en:'new Muslim'},traffick:{ru:'принудительный труд',tj:'кори маҷбурӣ',en:'forced labour'},disaster:{ru:'бедствие',tj:'офат',en:'disaster'},invisible:{ru:'без другой помощи',tj:'бе кӯмаки дигар',en:'no other help'}};
let LANG='ru';try{const s=localStorage.getItem('amn_lang');if(T[s])LANG=s;else if(s&&s!=='ru')LANG='en'}catch(e){}
const t=(k,v)=>{let s=T[LANG][k]??T.en[k];if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const n=x=>Number(x).toLocaleString('ru-RU',{maximumFractionDigits:2});
const fmtD=d=>new Date(d+'T00:00:00').toLocaleDateString(LANG==='en'?'en-GB':'ru-RU',{day:'numeric',month:'short',year:'numeric'});
const sb=window.supabase.createClient(AMN_SB.url,AMN_SB.key,{auth:{persistSession:false,autoRefreshToken:false}});
let ROWS=null,STATS=null,ERR=false;

function render(){
  document.documentElement.lang=LANG==='tj'?'tg':LANG;document.title=t('title')+' — AM Network';
  $('#langSel').value=LANG;
  $('#navCab').textContent=t('cab');$('#h1').textContent=t('title');$('#intro').textContent=t('intro');
  $('#verify').textContent=t('verify');$('#howT').textContent=t('howT');$('#how').innerHTML=t('how').map(x=>`<li>${esc(x)}</li>`).join('');
  const s=STATS||{};
  $('#stats').innerHTML=[['families_paid','families'],['payouts','payouts'],['verified','verified'],['total_tjs','total']].map(([k,l])=>`<div class="stat"><b>${STATS?n(s[k]||0):'…'}</b><span>${esc(t(l))}</span></div>`).join('');
  $('#verify').hidden=!(ROWS&&ROWS.length);
  if(ERR){$('#log').innerHTML=`<p class="muted">${esc(t('err'))}</p>`;return}
  if(!ROWS){$('#log').innerHTML=`<p class="muted">${esc(t('loading'))}</p>`;return}
  if(!ROWS.length){$('#log').innerHTML=`<p class="muted">${esc(t('empty'))}</p>`;return}
  $('#log').innerHTML=`<table><thead><tr><th>#</th><th>${esc(t('date'))}</th><th>${esc(t('ref'))}</th><th>${esc(t('region'))}</th><th>${esc(t('sit'))}</th><th>${esc(t('amount'))}</th><th>${esc(t('checks'))}</th><th>${esc(t('receipt'))}</th></tr></thead><tbody>
   ${[...ROWS].reverse().map(r=>`<tr><td>${r.seq}</td><td>${esc(fmtD(r.paid_on))}</td><td>${esc(r.ref)}</td><td>${esc(r.region)}</td>
    <td>${(r.categories||[]).map(c=>`<span class="tag">${esc((CATS[c]&&CATS[c][LANG])||c)}</span>`).join('')||'—'}</td>
    <td class="n">${esc(n(r.amount))} ${esc(r.currency)}<div class="muted">${esc(t(r.kind))}</div></td><td class="n">${r.verifications}</td><td>${esc(r.has_receipt?t('yes'):t('no'))}</td></tr>
    <tr><td></td><td colspan="7" class="hash">${esc(t('hash'))}: ${esc(r.entry_hash)}</td></tr>`).join('')}</tbody></table>
   <div class="cards">${[...ROWS].reverse().map(r=>`<div class="pc"><div class="top"><b>${esc(n(r.amount))} ${esc(r.currency)} · ${esc(t(r.kind))}</b><span class="muted">#${r.seq} · ${esc(fmtD(r.paid_on))}</span></div>
    <div>${esc(r.ref)} · ${esc(r.region)} · ${esc(t('checks'))}: ${r.verifications} · ${esc(t('receipt'))}: ${esc(r.has_receipt?t('yes'):t('no'))}</div>
    <div>${(r.categories||[]).map(c=>`<span class="tag">${esc((CATS[c]&&CATS[c][LANG])||c)}</span>`).join('')}</div>
    <div class="hash">${esc(t('hash'))}: ${esc(r.entry_hash)}</div></div>`).join('')}</div>`;
}
async function sha256Hex(s){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
$('#verify').addEventListener('click',async()=>{
  let prev='0'.repeat(64),bad=null;
  for(const r of ROWS){
    const p=r.payload.split('|');
    const ok=r.prev_hash===prev&&p[0]===r.prev_hash&&p[1]===r.ref&&Number(p[2])===Number(r.amount)&&p[3]===r.currency&&p[4]===r.kind&&p[5]===r.paid_on
      &&(await sha256Hex(r.payload))===r.entry_hash;
    if(!ok){bad=r.seq;break}prev=r.entry_hash;
  }
  $('#vres').innerHTML=bad==null?`<div class="msg ok">${esc(t('vOk',{n:ROWS.length}))}</div>`:`<div class="msg err">${esc(t('vBad',{n:bad}))}</div>`;
});
document.addEventListener('click',e=>{
  if(e.target.closest('#themeBtn')){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('amn_theme',d.dataset.theme)}catch(_){}}
});
$('#langSel').addEventListener('change',e=>{LANG=e.target.value;try{localStorage.setItem('amn_lang',LANG)}catch(_){}render()});
render();
Promise.all([sb.rpc('public_payouts'),sb.rpc('public_stats')]).then(([a,b])=>{
  if(a.error||b.error)throw a.error||b.error;ROWS=a.data||[];STATS=(b.data&&b.data[0])||{};render();
}).catch(()=>{ERR=true;render()});
</script>
</body>
</html>
