*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg1);color:var(--text);font:15px/1.6 var(--ff);min-height:100vh}
a{color:var(--gold)}
nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;height:60px;background:var(--nav-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-logo img{height:34px;display:block}
.nav-right{display:flex;gap:8px;align-items:center}
.nbtn{min-height:38px;min-width:38px;padding:0 10px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text2);font:600 13px var(--ff);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center}
.nbtn:hover,.nbtn[aria-pressed="true"]{border-color:var(--gold);color:var(--gold)}
.nbtn:focus-visible,.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{max-width:980px;margin:0 auto;padding:28px 16px 80px}
h1{font:700 clamp(28px,5vw,40px)/1.2 var(--fh);margin-bottom:8px}
h2{font:700 22px/1.3 var(--fh);margin:28px 0 10px}
.sub{color:var(--text2);max-width:680px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:22px 0}
.stat{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:14px 16px}
.stat b{display:block;font:700 30px/1.1 var(--fh);color:var(--gold);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--text2)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:10px 8px;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}
th{font-size:12px;color:var(--text3);font-weight:600;white-space:nowrap}
td.n{text-align:end;font-variant-numeric:tabular-nums;white-space:nowrap}
.hash{font:11.5px ui-monospace,Menlo,monospace;color:var(--text3);overflow-wrap:anywhere}
.btn{min-height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--gold);background:var(--gold);color:#16130a;font:600 14px var(--ff);cursor:pointer}
.msg{padding:12px 14px;border-radius:12px;font-size:14px;margin-top:12px}
.msg.ok{background:var(--ok-bg);color:var(--ok)}.msg.err{background:var(--bad-bg);color:var(--bad)}
ol.how{padding-inline-start:20px;display:grid;gap:6px;color:var(--text2);max-width:720px}
.muted{color:var(--text3)}
:lang(ar) h1,:lang(ar) h2{line-height:1.5}
:lang(ar) body{line-height:1.8}
.cards{display:none;gap:10px}
.pc{border:1px solid var(--border);border-radius:14px;padding:12px 14px;background:var(--card)}
.pc .top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.pc .top b{font-size:17px}
@media (max-width:680px){.tw table{display:none}.cards{display:grid}#log.card{background:transparent;border:0;padding:0}}
.tag{display:inline-block;padding:2px 8px;border-radius:20px;background:var(--gold3);color:var(--gold);font-size:12px;font-weight:600;margin-block:2px;margin-inline:0 4px}

for(const l in CATS_MORE)for(const k in CATS_MORE[l])if(CATS[k])CATS[k][l]=CATS_MORE[l][k];
let LANG='ru';try{const s=localStorage.getItem('amn_lang');if(T[s])LANG=s;else if(s&&s!=='ru')LANG='en'}catch(e){}
// Date locale per language (tj keeps ru-RU month names, as before); Latin digits and the Gregorian calendar everywhere.
const LOCALE={ru:'ru-RU',tj:'ru-RU',en:'en-GB',ar:'ar-u-nu-latn',id:'id-ID',tr:'tr-TR',zh:'zh-CN',ms:'ms-MY',fr:'fr-FR',de:'de-DE'};
// Arabic and Chinese fonts are loaded only when that language is chosen (Google Fonts slices them by unicode-range).
const SCRIPT_FONT={ar:'Noto+Naskh+Arabic:wght@400;600;700',zh:'Noto+Sans+SC:wght@400;500;700'};
function applyLang(){
  const h=document.documentElement;h.lang=LANG==='tj'?'tg':LANG;h.dir=LANG==='ar'?'rtl':'ltr';
  const f=SCRIPT_FONT[LANG];
  if(f&&!document.getElementById('font-'+LANG)){const l=document.createElement('link');l.id='font-'+LANG;l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family='+f+'&display=swap';document.head.appendChild(l)}
}
applyLang();
const t=(k,v)=>{let s=T[LANG][k]??T.en[k];if(v)for(const x in v)s=s.split('{'+x+'}').join(v[x]);return s};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=s=>document.querySelector(s);
const n=x=>Number(x).toLocaleString('ru-RU',{maximumFractionDigits:2});
const fmtD=d=>new Date(d+'T00:00:00').toLocaleDateString(LOCALE[LANG]||'en-GB',{day:'numeric',month:'short',year:'numeric',calendar:'gregory'});
const sb=window.supabase.createClient(AMN_SB.url,AMN_SB.key,{auth:{persistSession:false,autoRefreshToken:false}});
let ROWS=null,STATS=null,ERR=false;

function render(){
  applyLang();document.title=t('title')+' — AM Network';
  $('#langSel').value=LANG;
  $('#navCab').textContent=t('cab');$('#h1').textContent=t('title');$('#intro').textContent=t('intro');
  $('#verify').textContent=t('verify');$('#howT').textContent=t('howT');$('#how').innerHTML=t('how').map(x=>`<li>${esc(x)}</li>`).join('');
  const s=STATS||{};
  $('#stats').innerHTML=[['families_paid','families'],['payouts','payouts'],['verified','verified'],['total_tjs','total']].map(([k,l])=>`<div class="stat"><b>${STATS?n(s[k]||0):'…'}</b><span>${esc(t(l))}</span></div>`).join('');
  $('#verify').hidden=!(ROWS&&ROWS.length);
  if(ERR){$('#log').innerHTML=`<p class="muted">${esc(t('err'))}</p>`;return}
  if(!ROWS){$('#log').innerHTML=`<p class="muted">${esc(t('loading'))}</p>`;return}
  if(!ROWS.length){$('#log').innerHTML=`<p class="muted">${esc(t('empty'))}</p>`;return}
  $('#log').innerHTML=`<table><thead><tr><th>#</th><th>${esc(t('date'))}</th><th>${esc(t('ref'))}</th><th>${esc(t('region'))}</th><th>${esc(t('sit'))}</th><th>${esc(t('amount'))}</th><th>${esc(t('checks'))}</th><th>${esc(t('receipt'))}</th></tr></thead><tbody>
   ${[...ROWS].reverse().map(r=>`<tr><td>${r.seq}</td><td>${esc(fmtD(r.paid_on))}</td><td>${esc(r.ref)}</td><td>${esc(r.region)}</td>
    <td>${(r.categories||[]).map(c=>`<span class="tag">${esc((CATS[c]&&CATS[c][LANG])||c)}</span>`).join('')||'—'}</td>
    <td class="n">${esc(n(r.amount))} ${esc(r.currency)}<div class="muted">${esc(t(r.kind))}</div></td><td class="n">${r.verifications}</td><td>${esc(r.has_receipt?t('yes'):t('no'))}</td></tr>
    <tr><td></td><td colspan="7" class="hash">${esc(t('hash'))}: <bdi dir="ltr">${esc(r.entry_hash)}</bdi></td></tr>`).join('')}</tbody></table>
   <div class="cards">${[...ROWS].reverse().map(r=>`<div class="pc"><div class="top"><b>${esc(n(r.amount))} ${esc(r.currency)} · ${esc(t(r.kind))}</b><span class="muted">#${r.seq} · ${esc(fmtD(r.paid_on))}</span></div>
    <div>${esc(r.ref)} · ${esc(r.region)} · ${esc(t('checks'))}: ${r.verifications} · ${esc(t('receipt'))}: ${esc(r.has_receipt?t('yes'):t('no'))}</div>
    <div>${(r.categories||[]).map(c=>`<span class="tag">${esc((CATS[c]&&CATS[c][LANG])||c)}</span>`).join('')}</div>
    <div class="hash">${esc(t('hash'))}: <bdi dir="ltr">${esc(r.entry_hash)}</bdi></div></div>`).join('')}</div>`;
}
async function sha256Hex(s){const h=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
$('#verify').addEventListener('click',async()=>{
  let prev='0'.repeat(64),bad=null;
  for(const r of ROWS){
    const p=r.payload.split('|');
    const ok=r.prev_hash===prev&&p[0]===r.prev_hash&&p[1]===r.ref&&Number(p[2])===Number(r.amount)&&p[3]===r.currency&&p[4]===r.kind&&p[5]===r.paid_on
      &&(await sha256Hex(r.payload))===r.entry_hash;
    if(!ok){bad=r.seq;break}prev=r.entry_hash;
  }
  $('#vres').innerHTML=bad==null?`<div class="msg ok">${esc(t('vOk',{n:ROWS.length}))}</div>`:`<div class="msg err">${esc(t('vBad',{n:bad}))}</div>`;
});
document.addEventListener('click',e=>{
  if(e.target.closest('#themeBtn')){const d=document.documentElement;d.dataset.theme=d.dataset.theme==='dark'?'light':'dark';try{localStorage.setItem('amn_theme',d.dataset.theme)}catch(_){}}
});
$('#langSel').addEventListener('change',e=>{LANG=e.target.value;try{localStorage.setItem('amn_lang',LANG)}catch(_){}render()});
render();
Promise.all([sb.rpc('public_payouts'),sb.rpc('public_stats')]).then(([a,b])=>{
  if(a.error||b.error)throw a.error||b.error;ROWS=a.data||[];STATS=(b.data&&b.data[0])||{};render();
}).catch(()=>{ERR=true;render()});
</script>
