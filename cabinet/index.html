a{color:var(--gold)}

.nbtn{min-height:38px;min-width:38px;padding:0 10px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text2);font:600 13px var(--ff);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}

h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--text2);font-size:14px}
.muted{color:var(--text3)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{min-height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);font:600 14px var(--ff);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#16130a}
.btn.primary:hover{background:var(--gold2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:wait}
.btn:focus-visible,.nbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--text2)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font:15px var(--ff)}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.grid2>*,.stack>*,label{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%}
input[type=file]{font-size:14px;max-width:100%}
html,body{overflow-x:hidden}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;color:var(--text);font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer}
.chk input{width:20px;min-height:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--gold)}
.chk .pts{margin-inline-start:auto;color:var(--gold);font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;border:1px solid var(--border);border-radius:14px;background:var(--input-bg);margin:18px 0}
.tab{flex:1 0 auto;min-height:42px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--text2);font:600 14px var(--ff);cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{background:var(--gold);color:#16130a}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}.btn.sm{min-height:36px;padding:0 12px;font-size:13px}
.pill.stg-new{background:rgba(120,170,255,.14);color:#8FB8FF}.pill.stg-listed{background:rgba(201,168,76,.16);color:var(--gold)}.pill.stg-offer{background:rgba(255,170,80,.16);color:#F2B36B}.pill.stg-connected{background:rgba(95,211,154,.16);color:#5FD39A}

.ibx{display:grid;gap:6px;padding:14px 16px;border:1px solid var(--border);border-radius:16px;background:var(--card);text-decoration:none;color:inherit;transition:border-color .2s,transform .2s}
.ibx:hover{border-color:var(--gold);transform:translateY(-1px)}
.ibx-top{display:flex;align-items:center;gap:10px}.ibx-top .pill{margin-inline-start:auto}.ibx-flag{font-size:22px;line-height:1}
.ibx-mid{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
.ibx-cat{padding:3px 10px;border-radius:30px;background:var(--gold3);color:var(--gold);font-weight:700}
.ibx-need{display:inline-flex;align-items:center;gap:6px;color:var(--text2)}.ibx-need i{width:8px;height:8px;border-radius:50%;display:inline-block}

.fx{display:grid;gap:6px;padding:10px 12px;border-radius:12px;border:1px dashed rgba(201,168,76,.45);font-size:13.5px}.fx label{display:flex;align-items:center;gap:8px;font-weight:600}.fx select{width:auto;min-height:34px;padding:0 8px}
.rq-head{display:grid;gap:12px}.rq-top{display:flex;align-items:center;gap:12px}.rq-top .pill{margin-inline-start:auto}.rq-flag{font-size:32px;line-height:1}

.rq-tabs{position:sticky;top:60px;z-index:20;display:flex;gap:4px;overflow-x:auto;margin:12px 0;padding:4px;border-radius:14px;background:var(--nav-bg);border:1px solid var(--border);backdrop-filter:blur(10px);scrollbar-width:none}
.rq-tabs::-webkit-scrollbar{display:none}
.rq-tab{flex:1 0 auto;min-height:40px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--text2);font:600 14px var(--ff);cursor:pointer;white-space:nowrap}
.rq-tab[aria-selected="true"]{background:var(--gold);color:#1a1405}
.rq-bar{position:sticky;bottom:0;z-index:20;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px -16px 0;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--nav-bg);border-top:1px solid var(--border);backdrop-filter:blur(12px)}
.rq-bar{flex-wrap:nowrap}.rq-bar>.btn{flex:1;min-height:46px;padding:0 10px}.rq-bar .rq-more summary.btn{min-height:46px;padding:0 14px}
.rq-more{position:relative}.rq-more summary{list-style:none}.rq-more summary::-webkit-details-marker{display:none}
.rq-menu{position:absolute;bottom:calc(100% + 8px);inset-inline-end:0;display:grid;gap:6px;padding:10px;border-radius:14px;background:var(--bg2);border:1px solid var(--border);box-shadow:0 14px 40px rgba(0,0,0,.35);min-width:200px;z-index:30}
.askbox{white-space:pre-wrap;font:14px/1.6 var(--ff);padding:12px;border-radius:12px;background:var(--input-bg,rgba(255,255,255,.04));border:1px solid var(--border);margin:0}

@media (max-width:420px){#navLog{display:none}}

document.addEventListener('click',e=>{const m=e.target.closest('[data-mode]');if(m){e.preventDefault();S.authMode=m.dataset.mode;render()}});

async function onAuthSubmit(e){
  e.preventDefault();const btn=$('#aGo');busy(btn,true);
  const email=$('#aEmail').value.trim();
  try{
    if(S.authMode==='forgot'){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/cabinet/'});
      if(error)throw error;S.flash={kind:'ok',text:t('resetSent')};S.authMode='signin';render();return;
    }
    const pw=$('#aPw').value;
    if(pw.length<8)throw new Error(t('pwHint'));
    if(S.authMode==='signup'){
      const name=$('#aName').value.trim();
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:name},emailRedirectTo:location.origin+'/cabinet/'}});
      if(error)throw error;
      if(data&&data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)throw new Error('already registered');
      if(!data.session){S.flash={kind:'ok',text:t('checkEmail')};S.authMode='signin';render()}
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;
    }
  }catch(err){S.flash={kind:'err',text:errText(err)};render()}
  finally{busy(btn,false)}
}
async function onPwSubmit(e){
  e.preventDefault();const pw=$('#pw1').value;
  const {error}=await sb.auth.updateUser({password:pw});
  if(error){S.flash={kind:'err',text:errText(error)}}else{S.recovery=false;S.flash={kind:'ok',text:t('pwSaved')}}
  render();
}

// Stage in the matching model, shown to the admin instead of the old verification statuses.
function stage(a){
  if(a.status==='paid'||a.status==='rejected')return a.status;
  const of=(S.offs||[]).filter(o=>o.application_id===a.id);
  if(of.some(o=>o.status==='connected'||o.status==='helped'))return 'connected';
  if(of.length)return 'offer';
  if(a.listed)return 'listed';
  return 'new';
}
const STAGES=['new','listed','offer','connected','rejected','paid'];
function stagePill(st){return st==='paid'||st==='rejected'?pill(st):`<span class="pill stg-${st}">${esc(t('st_'+st))}</span>`}
function appItem(a){
  const cats=(a.categories||[]).slice(0,2).map(cat).join(' · ');
  const adm=isAdmin();
  return `<div class="item" data-href="app/${a.id}" role="link" tabindex="0"><b>${esc(a.ref)} · ${esc(a.full_name)}</b>${adm&&a.source==='web'?stagePill(stage(a)):pill(a.status)}
   <div class="meta">${esc([a.region,a.country].filter(Boolean).join(', '))} · ${esc(t('created'))} ${esc(fmtD(a.created_at))}${a.need_score!=null?` · ${esc(t('score'))}: ${a.need_score}`:''}${cats?' · '+esc(cats):''}${a.ai_review?` · ✦ ${esc(t('ai_hint_short'))}: ${esc(t('z_'+a.ai_review.category))}`:''}${a.dup_of?` · ⚠ ${esc(a.dup_of)}`:''}</div>
   ${adm?`<div class="acts"><button class="btn sm" data-edit="${a.id}">✎ ${esc(t('act_edit'))}</button><button class="btn sm" data-copy="${a.id}">⧉ ${esc(t('act_copy'))}</button><button class="btn sm danger" data-delete="${a.id}">🗑 ${esc(t('a_delete'))}</button></div>`:''}</div>`;
}
async function viewList(kind){
  let rows=await q(sb.from('applications').select('*').order('created_at',{ascending:false}));
  if(isAdmin())S.offs=await q(sb.from('offers').select('application_id,status')).catch(()=>[]);
  S.rows=rows;
  const uid=S.me.id;
  if(kind==='mine')rows=rows.filter(a=>a.created_by===uid);
  if(kind==='check')rows=rows.filter(a=>a.assigned_to===uid&&['assigned','verified'].includes(a.status));
  let chips='';
  if(kind==='all'){
    const c={all:rows.length};STAGES.forEach(x=>c[x]=rows.filter(a=>stage(a)===x).length);
    if(!['all',...STAGES].includes(S.filter))S.filter='all';
    chips=`<details class="rq-more" style="margin-bottom:10px"><summary class="btn sm">⋯ Excel</summary><div class="rq-menu" style="position:static;margin-top:8px"><button class="btn sm" data-export="apps">⬇ ${esc(t('x_apps'))}</button><button class="btn sm" data-export="pays">⬇ ${esc(t('x_pays'))}</button></div></details>`+`<div class="chips">${['all',...STAGES].filter(x=>x==='all'||c[x]).map(x=>`<button class="chipf" data-filter="${x}" aria-pressed="${S.filter===x}">${esc(x==='all'?t('all'):x==='paid'||x==='rejected'?t('s_'+x):t('st_'+x))} · ${c[x]}</button>`).join('')}</div>`;
    if(S.filter!=='all')rows=rows.filter(a=>stage(a)===S.filter);
  }
  const item=kind==='all'&&isAdmin()?inboxItem:appItem;
  return chips+(rows.length?`<div class="list">${rows.map(item).join('')}</div>`:`<div class="card center muted">${esc(t('empty'))}</div>`);
}

function csvCell(v){if(v==null)return '';v=Array.isArray(v)?v.join(', '):typeof v==='object'?JSON.stringify(v):String(v);return /[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}
function downloadCSV(name,head,rows){const csv='﻿'+[head,...rows].map(r=>r.map(csvCell).join(';')).join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-export]');if(!b)return;b.disabled=true;
  try{
    const day=new Date().toISOString().slice(0,10);
    if(!S.staff.length)S.staff=await q(sb.rpc('list_staff'));
    if(b.dataset.export==='apps'){
      const [apps,vers,pays]=await Promise.all([q(sb.from('applications').select('*').order('created_at')),q(sb.from('verifications').select('*')),q(sb.from('payouts').select('*'))]);
      downloadCSV(`amnetwork-applications-${day}.csv`,['ref','created','status','full_name','phone','region','address','household_size','dependents','monthly_income','currency','categories','need_score','assigned_to','verifications','approve_recs','paid_total','situation','admin_note'],
        apps.map(a=>{const v=vers.filter(x=>x.application_id===a.id),p=pays.filter(x=>x.application_id===a.id);return [a.ref,a.created_at.slice(0,10),a.status,a.full_name,a.phone,a.region,a.address,a.household_size,a.dependents,a.monthly_income,a.currency,a.categories,a.need_score,a.assigned_to?staffName(a.assigned_to):'',v.length,v.filter(x=>x.recommendation==='approve').length,p.map(x=>x.amount+' '+x.currency).join(' + '),a.situation,a.admin_note]}));
    }else{
      const [pays,apps]=await Promise.all([q(sb.from('payouts').select('*').order('seq')),q(sb.from('applications').select('id,ref,region'))]);
      downloadCSV(`amnetwork-payouts-${day}.csv`,['seq','ref','region','paid_on','amount','currency','kind','method','donor','receipt_sha256','public_note','entry_hash'],
        pays.map(p=>{const a=apps.find(x=>x.id===p.application_id)||{};return [p.seq,a.ref,a.region,p.paid_on,p.amount,p.currency,p.kind,p.method,p.donor_id?staffName(p.donor_id):'',p.receipt_sha256,p.public_note,p.entry_hash]}));
    }
  }catch(err){alert(errText(err))}
  finally{b.disabled=false}
});

async function viewApp(id){
  const a=await q(sb.from('applications').select('*').eq('id',id).maybeSingle());
  if(!a)return `<a class="back" href="#">${esc(t('back'))}</a><div class="card muted">${esc(t('empty'))}</div>`;
  const [ev,vs,ps]=await Promise.all([
    q(sb.from('events').select('*').eq('application_id',id).order('id')),
    isVer()?q(sb.from('verifications').select('*').eq('application_id',id).order('created_at')):Promise.resolve([]),
    isAdmin()?q(sb.from('payouts').select('*').eq('application_id',id).order('seq')):Promise.resolve([])]);
  if(isAdmin())return await viewAppAdmin(a,ev,vs,ps);
  const offs=isAdmin()?await q(sb.from('offers').select('status').eq('application_id',id)).catch(()=>[]):[];
  a._connected=offs.some(o=>o.status==='connected'||o.status==='helped');a._offers=offs.length;
  const uid=S.me.id;
  const facts=[[t('ref'),a.ref],[t('status'),null],[t('created'),fmtD(a.created_at)],[t('f_region'),a.region]];
  const seePrivate=isAdmin()||a.assigned_to===uid||a.created_by===uid;
  if(seePrivate&&a.phone)facts.push([t('f_phone'),a.phone]);
  if(seePrivate&&a.address)facts.push([t('f_address'),a.address]);
  if(seePrivate)facts.push([t('f_hh'),a.household_size??'—'],[t('f_dep'),a.dependents??'—'],
    [t('f_income'),a.monthly_income!=null?money(a.monthly_income,a.currency):'—']);
  if(seePrivate&&a.country)facts.push([t('f_country'),a.country]);
  if(seePrivate&&a.email)facts.push([t('f_email'),a.email]);
  if(seePrivate&&a.monthly_expenses!=null)facts.push([t('f_exp'),money(a.monthly_expenses,a.currency)]);
  if(seePrivate&&(a.needs||[]).length)facts.push([t('f_needs'),a.needs.join(', ')]);
  if(seePrivate&&a.months_in_need!=null)facts.push([t('f_months'),a.months_in_need]);
  if(isAdmin()&&a.source==='web')facts.push(['',t('src_web')]);
  if(isAdmin()&&a.contact_consent)facts.push(['',t('f_contact_ok')]);
  if(a.need_score!=null)facts.push([t('score'),a.need_score+' / 100']);
  if(isAdmin()&&a.assigned_to)facts.push([t('a_assign'),staffName(a.assigned_to)]);
  if(isAdmin()&&a._offers)facts.push([t('t_offers'),String(a._offers)]);
  let html=`<a class="back" href="#${isAdmin()?'all':a.assigned_to===uid?'check':'mine'}">${esc(t('back'))}</a>${flashHTML()}
  <div class="card stack"><div class="row between"><h2 style="margin:0">${esc(a.full_name)}</h2>${pill(a.status)}</div>
   <dl class="facts">${facts.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v===null?pill(a.status):`<bdi>${esc(v)}</bdi>`}</dd>`).join('')}</dl>
   ${(a.categories||[]).length?`<div class="row">${a.categories.map(c=>`<span class="pill role">${esc(cat(c))}</span>`).join('')}</div>`:''}
   ${a.situation&&seePrivate?`<p style="white-space:pre-wrap">${esc(a.situation)}</p>`:''}
   ${a.admin_note&&isAdmin()?`<div class="msg info">${esc(a.admin_note)}</div>`:''}
  </div>`;
  html+=`<div class="card"><h3>${esc(t('timeline'))}</h3><ul class="tl">${ev.map(x=>`<li><b>${esc(t('e_'+x.kind))}</b> <span class="muted">· ${esc(fmtD(x.at))}</span>${x.kind==='verified'&&x.detail&&x.detail.recommendation&&isVer()?` · ${esc(x.detail.recommendation==='approve'?t('v_approve'):t('v_reject'))}`:''}</li>`).join('')}</ul></div>`;
  if(isVer()&&(a.assigned_to===uid||isAdmin())&&['assigned','verified'].includes(a.status)){
    const mine=vs.find(v=>v.verifier_id===uid);
    if(mine)html+=`<div class="msg ok">${esc(t('v_already'))}</div>`;
    else if(a.created_by===uid&&!isAdmin())html+=`<div class="msg info">${esc(t('v_cannot'))}</div>`;
    else html+=verifyForm(a);
  }
  if(isAdmin()&&S.editing===a.id)return html+editForm(a);
  if(isAdmin())html+=`<div class="acts" style="margin:-4px 0 12px"><button class="btn sm" data-edit="${a.id}">✎ ${esc(t('act_edit'))}</button><button class="btn sm" data-copy="${a.id}">⧉ ${esc(t('act_copy'))}</button></div>`;
  if(isAdmin()&&a.dup_of)html+=`<div class="msg err">${esc(t('a_dup',{ref:a.dup_of}))}</div>`;
  if(isAdmin())html+=aiHTML(a,true);
  if(isAdmin())html+=`<div class="card stack"><label class="chk"><input type="checkbox" data-listed="${a.id}" ${a.listed?'checked':''}><span><b>${esc(t('a_listed'))}</b><br><span class="muted" style="font-size:13px">${esc(t('a_listed_hint'))}</span></span></label></div>`;
  if(isAdmin())html+=adminBlock(a,vs,ps);
  else if(vs.length&&isVer())html+=verifsHTML(vs);
  if(isAdmin())html+=`<div style="margin:6px 0 20px"><button class="btn danger" data-delete="${a.id}">${esc(t('a_delete'))}</button></div>`;
  return html;
}

function needScore(f){
  const on=k=>f.querySelector(`[name=need][value=${k}]`).checked;
  let s=0;for(const [k,p] of NEED){if(k==='below_min'&&on('no_income'))continue;if(on(k))s+=p}
  s+=Math.min(10,2*Math.max(0,Number(f.deps.value)||0));
  return Math.min(100,s);
}

     <label>${esc(t('p_method'))}<select name="method">${['cash','alif','dc','bank','other'].map(m=>`<option value="${m}">${esc(t('m_'+m))}</option>`).join('')}</select></label>
     <label>${esc(t('p_kind'))}<select name="kind"><option value="zakat">${esc(t('k_zakat'))}</option><option value="sadaqah">${esc(t('k_sadaqah'))}</option></select></label>
     <label>${esc(t('p_date'))}<input name="paid_on" type="date" required value="${new Date().toISOString().slice(0,10)}"></label>
     <label>${esc(t('a_donor'))}<select name="donor_id"><option value="">${esc(t('a_donorNone'))}</option>${donors.map(p=>`<option value="${p.id}">${esc(p.full_name||p.email)}</option>`).join('')}</select></label></div>
    <label>${esc(t('p_receipt'))}<input name="receipt" type="file" accept="image/*,application/pdf"><span class="muted" style="font-weight:400">${esc(t('p_receiptHint'))}</span><span class="hash" id="rHash"></span></label>
    <label>${esc(t('p_note'))}<input name="public_note" maxlength="300"></label>
    <button class="btn primary" id="payGo">${esc(t('p_save'))}</button></form>`;
  if(ps.length)h+=`<div class="card"><h3>${esc(t('a_payouts'))}</h3><div class="tw"><table><thead><tr><th>#</th><th>${esc(t('p_date'))}</th><th>${esc(t('p_amount'))}</th><th>${esc(t('p_method'))}</th><th>${esc(t('a_donor'))}</th></tr></thead><tbody>

async function sha256Hex(buf){const h=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
document.addEventListener('change',async e=>{if(e.target.name==='receipt'&&e.target.files[0]){$('#rHash').textContent='SHA-256: '+await sha256Hex(await e.target.files[0].arrayBuffer())}});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-adm]');if(!b)return;e.preventDefault();
  const f=b.closest('form'),act=b.dataset.adm,id=f.dataset.app;
  const upd={assigned_to:f.assigned_to.value||null,admin_note:f.admin_note.value.trim()||null};
  if(act==='approved'||act==='rejected')upd.status=act;

  render();
});
async function onPaySubmit(e){
  e.preventDefault();const f=e.target,btn=$('#payGo');if(!f.reportValidity())return;busy(btn,true);
  try{
    const file=f.receipt.files[0];const receipt_sha256=file?await sha256Hex(await file.arrayBuffer()):null;
    await q(sb.from('payouts').insert({application_id:f.dataset.app,donor_id:f.donor_id.value||null,amount:Number(f.amount.value),currency:f.currency.value,
      method:f.method.value,kind:f.kind.value,paid_on:f.paid_on.value,receipt_sha256,public_note:f.public_note.value.trim()||null}));
    S.flash={kind:'ok',text:t('p_saved')};
  }catch(err){S.flash={kind:'err',text:errText(err)}}

}

const AMN_API='https://amnetwork.onrender.com';
const aiL=()=>(LANG==='ru'||LANG==='tj')?'ru':'en';

function aiHTML(a,withActions){
  const r=a.ai_review;let h=`<div class="card stack ai-box"><div class="row between"><h3 style="margin:0">${esc(t('ai_title'))}</h3>`;
  if(withActions)h+=`<button class="btn" data-ai="${a.id}" data-force="${r?'1':''}">${esc(t(r?'ai_rerun':'ai_run'))}</button>`;
  h+='</div>';
  if(!r){h+=`<p class="muted">${esc(t(a.ai_state==='pending'?'ai_pending':a.ai_state==='failed'?'ai_failed':'ai_none'))}</p></div>`;return h}
  const list=(k,arr)=>Array.isArray(arr)&&arr.length?`<div><b>${esc(t(k))}</b><ul class="ai-ul">${arr.map(x=>`<li>${esc(bi(x))}</li>`).join('')}</ul></div>`:'';
  h+=`<div class="row" style="gap:6px"><span class="pill ai-cat">${esc(t('ai_cat'))}: ${esc(t('z_'+r.category))}</span>
    ${(r.also_possible||[]).filter(c=>c!==r.category).map(c=>`<span class="pill role">${esc(t('ai_also'))}: ${esc(t('z_'+c))}</span>`).join('')}</div>
   <div class="muted" style="font-size:13px">${esc(t('ai_fit'))}: <b>${esc(t('fit_'+r.zakat_fit))}</b> · ${esc(t('ai_need'))}: <b>${esc(t('nl_'+r.need_level))}</b>${r.sadaqah_ok?' · '+esc(t('ai_sadaqah')):''}</div>
   ${r.summary?`<p>${esc(bi(r.summary))}</p>`:''}${r.why?`<p class="muted" style="font-size:13px">${esc(bi(r.why))}</p>`:''}
   ${list('ai_verify',r.verify)}${list('ai_flags',r.red_flags)}${list('ai_ask',r.ask_applicant)}</div>`;
  return h;
}

const FX_CUR=['USD','EUR','TJS','RUB','GBP','TRY','AED','SAR','KZT','UZS','KGS','EGP','MAD','NGN','PKR','BDT','IDR','MYR','INR','CNY','JOD','IQD','DZD','TND','AFN','AZN','CAD','AUD'];
async function fxRates(base){const k='amn_fx_'+base;try{const c=JSON.parse(localStorage.getItem(k)||'null');if(c&&Date.now()-c.t<6*36e5)return c}catch(_){}
  const r=await fetch('https://open.er-api.com/v6/latest/'+encodeURIComponent(base),{credentials:'omit',referrerPolicy:'no-referrer'});const j=await r.json();if(j.result!=='success')throw new Error('fx');
  const v={t:Date.now(),upd:j.time_last_update_utc,rates:j.rates};try{localStorage.setItem(k,JSON.stringify(v))}catch(_){}return v}
function fxTarget(){try{return localStorage.getItem('amn_fx_to')||(LANG==='tj'?'TJS':LANG==='ru'?'RUB':'USD')}catch(_){return 'USD'}}
function fxHTML(a){if(!a.currency||(a.monthly_income==null&&a.monthly_expenses==null))return '';
  const to=fxTarget();const opts=[...new Set([to,...FX_CUR])].filter(c=>c!==a.currency);
  return `<div class="fx" data-fx="${esc(a.currency)}" data-inc="${a.monthly_income??''}" data-exp="${a.monthly_expenses??''}"><label>${esc(t('fx_in'))}<select data-fxto>${opts.map(c=>`<option ${c===to?'selected':''}>${c}</option>`).join('')}</select></label><div class="fx-out muted">${esc(t('loading'))}</div></div>`}
async function fxPaint(){for(const el of document.querySelectorAll('[data-fx]')){const base=el.dataset.fx,to=el.querySelector('[data-fxto]').value,out=el.querySelector('.fx-out');
  try{const r=await fxRates(base);const k=r.rates[to];if(!k)throw 0;const f=v=>v===''?null:money(Number(v)*k,to);const inc=f(el.dataset.inc),exp=f(el.dataset.exp);
    out.innerHTML=[inc?`${esc(t('fd_inc'))}: <b>≈ ${esc(inc)}</b>`:'',exp?`${esc(t('fd_exp'))}: <b>≈ ${esc(exp)}</b>`:''].filter(Boolean).join(' · ')+`<br><span style="font-size:11.5px">1 ${esc(base)} = ${(+k.toPrecision(4)).toLocaleString(LOCALE[LANG]||'en')} ${esc(to)} · ${esc(t('fx_src'))}</span>`}
  catch(_){out.textContent=t('fx_fail')}}}
document.addEventListener('change',e=>{const s=e.target.closest('[data-fxto]');if(!s)return;try{localStorage.setItem('amn_fx_to',s.value)}catch(_){}fxPaint()});
new MutationObserver(()=>{if(document.querySelector('[data-fx] .fx-out')&&document.querySelector('[data-fx] .fx-out').textContent===t('loading'))fxPaint()}).observe(document.getElementById('app'),{childList:true});

  <div class="rq-tabs" role="tablist">${tabs.map(([k,l])=>`<button class="rq-tab" role="tab" aria-selected="${tab===k}" data-tab="${k}">${esc(t(l))}${k==='chat'&&chats.length?` · ${chats.length}`:''}</button>`).join('')}</div>
  ${body}
  <details class="card"><summary style="cursor:pointer"><b>${esc(t('more_extra'))}</b></summary>${adminBlock(a,vs,ps)}<h3 style="margin-top:14px">${esc(t('timeline'))}</h3><ul class="tl">${ev.map(x=>`<li><b>${esc(t('e_'+x.kind))}</b> <span class="muted">· ${esc(fmtD(x.at))}</span></li>`).join('')}</ul></details>
  <div class="rq-bar">${a.status==='rejected'||a.status==='paid'?'':`<button class="btn primary" data-togglelist="${a.listed?0:1}">${esc(t(a.listed?'bar_hide':'bar_show'))}</button><button class="btn danger" data-reject="1">${esc(t('a_reject'))}</button>`}
   <details class="rq-more"><summary class="btn">⋯ ${esc(t('bar_more'))}</summary><div class="rq-menu"><button class="btn sm" data-edit="${a.id}">✎ ${esc(t('act_edit'))}</button><button class="btn sm" data-copy="${a.id}">⧉ ${esc(t('act_copy'))}</button><button class="btn sm danger" data-delete="${a.id}">🗑 ${esc(t('a_delete'))}</button></div></details></div>`;
}

// ── two-step login (TOTP) ──
async function mfaState(){try{const r=await sb.auth.mfa.getAuthenticatorAssuranceLevel();return r.data||{}}catch(_){return {}}}
function mfaPrompt(){return `<form id="fMfa" class="card stack" style="max-width:420px;margin:30px auto"><h2>${esc(t('mfa_title'))}</h2><p>${esc(t('mfa_need'))}</p>
  <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="${esc(t('mfa_code'))}" style="font-size:24px;letter-spacing:.3em;text-align:center">
  <button class="btn primary" id="mfaGo">${esc(t('mfa_verify'))}</button></form>`}
async function mfaVerify(code){
  const fs=await sb.auth.mfa.listFactors();const f=(fs.data&&fs.data.totp||[]).find(x=>x.status==='verified')||(fs.data&&fs.data.totp||[])[0];
  if(!f)throw new Error('no factor');
  const ch=await sb.auth.mfa.challenge({factorId:f.id});if(ch.error)throw ch.error;
  const v=await sb.auth.mfa.verify({factorId:f.id,challengeId:ch.data.id,code});if(v.error)throw v.error;
}
document.addEventListener('submit',async e=>{
  const f=e.target.closest('#fMfa');if(!f)return;e.preventDefault();busy($('#mfaGo'),true);
  try{await mfaVerify(f.code.value.trim());S.mfaNeeded=false;S.mfaChecked=null;S.me=null;S.flash={kind:'ok',text:t('mfa_done')}}catch(_){S.flash={kind:'err',text:t('mfa_bad')}}
  render();
});
async function mfaProfileHTML(){
  if(role()!=='admin'&&!S.mfaAdminRole)return '';
  const fs=await sb.auth.mfa.listFactors().catch(()=>({}));const on=(fs.data&&fs.data.totp||[]).some(x=>x.status==='verified');
  if(on)return `<div class="card stack" style="max-width:520px;margin-top:14px;border-color:rgba(95,211,154,.5)"><h3 style="margin:0">🔐 ${esc(t('mfa_title'))}</h3><p class="muted">${esc(t('mfa_on'))}</p></div>`;
  if(S.mfaEnroll)return `<form id="fMfaEnroll" class="card stack" style="max-width:520px;margin-top:14px"><h3 style="margin:0">🔐 ${esc(t('mfa_title'))}</h3><p>${esc(t('mfa_scan'))}</p>
    <img src="${esc(S.mfaEnroll.qr)}" alt="QR" width="200" height="200" style="background:#fff;padding:8px;border-radius:12px">
    <p class="muted" style="font-size:13px">${esc(t('mfa_key_hint'))}</p><code class="hash" dir="ltr" style="font-size:15px;letter-spacing:.06em;user-select:all">${esc(S.mfaEnroll.secret)}</code>
    <div class="row" style="gap:8px"><button type="button" class="btn" data-copylink="${esc(S.mfaEnroll.secret)}">${esc(t('mfa_copy_key'))}</button>${S.mfaEnroll.uri?`<a class="btn" href="${esc(S.mfaEnroll.uri)}">${esc(t('mfa_open_app'))}</a>`:''}</div>
    <input name="code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" pattern="[0-9]{6}" required placeholder="${esc(t('mfa_code'))}" style="font-size:22px;letter-spacing:.3em;text-align:center"><button class="btn primary" id="mfaEnGo">${esc(t('mfa_verify'))}</button></form>`;
  return `<div class="card stack" style="max-width:520px;margin-top:14px;border-color:rgba(232,176,74,.5)"><h3 style="margin:0">🔐 ${esc(t('mfa_title'))}</h3><p>${esc(t('mfa_off'))}</p><div><button class="btn primary" id="mfaStart">${esc(t('mfa_start'))}</button></div></div>`;
}
document.addEventListener('click',async e=>{const b=e.target.closest('#mfaStart');if(!b)return;e.preventDefault();busy(b,true);
  try{const old=await sb.auth.mfa.listFactors();for(const f of (old.data&&old.data.all||[]).filter(x=>x.status!=='verified'))await sb.auth.mfa.unenroll({factorId:f.id});
    const r=await sb.auth.mfa.enroll({factorType:'totp',friendlyName:'AM Network admin'});if(r.error)throw r.error;S.mfaEnroll={id:r.data.id,qr:r.data.totp.qr_code,secret:r.data.totp.secret,uri:r.data.totp.uri}}catch(err){S.flash={kind:'err',text:errText(err)}}render()});
document.addEventListener('submit',async e=>{const f=e.target.closest('#fMfaEnroll');if(!f)return;e.preventDefault();busy($('#mfaEnGo'),true);
  try{const ch=await sb.auth.mfa.challenge({factorId:S.mfaEnroll.id});if(ch.error)throw ch.error;const v=await sb.auth.mfa.verify({factorId:S.mfaEnroll.id,challengeId:ch.data.id,code:f.code.value.trim()});if(v.error)throw v.error;
    S.mfaEnroll=null;S.flash={kind:'ok',text:t('mfa_done')}}catch(_){S.flash={kind:'err',text:t('mfa_bad')}}render()});

// Giver (and admin) chat page: #chat/<id>
async function viewChat(id){
  const v=await q(sb.rpc('chat_view_my',{p_chat:id}));const me=isAdmin()?'admin':'giver';
  return `<a class="back" href="#${isAdmin()?'all':'feed'}">${esc(t('back'))}</a>${flashHTML()}<div class="card stack"><div class="row between"><b dir="ltr">${esc(v.ref)}</b><span class="muted">${esc(v.giver)}</span></div>
   ${chatHTML(v,me)}${v.status==='open'?`<form class="chatform row" data-chat="${id}"><textarea name="body" maxlength="2000" rows="2" placeholder="${esc(t('chat_ph'))}" required></textarea><button class="btn primary">${esc(t('chat_send'))}</button></form>`:`<p class="muted">${esc(t('chat_closed'))}</p>`}
   <p class="muted" style="font-size:12px">${esc(t('my_contacts_hint'))}</p></div>`;
}

async function viewPeople(){
  S.staff=await q(sb.rpc('list_staff'));
  return `<p class="sub" style="margin-bottom:12px">${esc(t('pe_hint'))}</p><div class="card tw"><table><thead><tr><th>${esc(t('fullName'))}</th><th>${esc(t('email'))}</th><th>${esc(t('pe_role'))}</th><th>${esc(t('pe_giver'))}</th><th>${esc(t('pe_since'))}</th></tr></thead><tbody>
   ${S.staff.map(p=>`<tr><td>${esc(p.full_name||'—')}${p.city?`<div class="muted">${esc(p.city)}</div>`:''}</td><td>${esc(p.email)}</td>
    <td><select data-role="${p.id}" ${p.id===S.me.id?'disabled':''} style="min-width:150px">${['applicant','donor','verifier','admin'].map(r=>`<option value="${r}" ${r===p.role?'selected':''}>${esc(t('r_'+r))}</option>`).join('')}</select></td>
    <td><label class="chk" style="padding:0;border:0"><input type="checkbox" data-giver="${p.id}" ${p.giver_approved?'checked':''}>${p.org_name?`<span class="muted">${esc(p.org_name)}</span>`:''}</label></td>
    <td class="muted">${esc(fmtD(p.created_at))}</td></tr>`).join('')}</tbody></table></div>`;
}
document.addEventListener('change',async e=>{
  const s=e.target.closest('[data-role]');if(!s)return;s.disabled=true;
  try{await q(sb.rpc('set_role',{target:s.dataset.role,new_role:s.value}));S.flash={kind:'ok',text:t('saved')}}catch(err){S.flash={kind:'err',text:errText(err)}}
  render();
});
async function viewGifts(){
  const rows=await q(sb.rpc('my_payouts'));
  return `<p class="sub" style="margin-bottom:12px">${esc(t('g_intro'))}</p>`+(rows.length?`<div class="list">${rows.map(r=>`<div class="item" style="cursor:default"><b>${esc(money(r.amount,r.currency))} · ${esc(t('k_'+r.kind))}</b><span class="pill s-paid">${esc(fmtD(r.paid_on))}</span>
    <div class="meta">${esc(r.ref)} · ${esc(r.region)} · ${r.verifications} ${esc(t('g_verifs'))}${(r.categories||[]).length?' · '+esc(r.categories.map(cat).join(', ')):''}<div class="hash">${esc(r.entry_hash)}</div></div></div>`).join('')}</div>`:`<div class="card center muted">${esc(t('empty'))}</div>`)+
    `<p style="margin-top:14px"><a href="/transparency/">${esc(t('logLink'))} ${LANG==='ar'?'←':'→'}</a></p>`;
}
function viewProfile(){
  return `<form id="fProf" class="card stack" style="max-width:520px">
   <label>${esc(t('fullName'))}<input name="full_name" maxlength="120" value="${esc(S.me.full_name||'')}"></label>
   <label>${esc(t('f_phone'))}<input name="phone" type="tel" maxlength="40" value="${esc(S.me.phone||'')}"></label>
   <label>${esc(t('pr_city'))}<input name="city" maxlength="80" value="${esc(S.me.city||'')}"></label>
   <label>${esc(t('pr_org'))}<input name="org_name" maxlength="160" value="${esc(S.me.org_name||'')}"></label>
   <button class="btn primary" id="profGo">${esc(t('save'))}</button></form>`;
}
async function onProfSubmit(e){
  e.preventDefault();const f=e.target;busy($('#profGo'),true);
  try{await q(sb.from('profiles').update(Object.assign({full_name:f.full_name.value.trim()||null,phone:f.phone.value.trim()||null,city:f.city.value.trim()||null},f.org_name?{org_name:f.org_name.value.trim()||null}:{})).eq('id',S.me.id));await loadMe();S.flash={kind:'ok',text:t('saved')}}
  catch(err){S.flash={kind:'err',text:errText(err)}}
  render();
}

// ───────────── render ─────────────
let renderSeq=0;
async function render(){
  chrome();const app=$('#app');const my=++renderSeq;
  if(!S.session||S.recovery){app.innerHTML=viewAuth();S.flash=null;bindForms();return}
  if(!S.me){app.innerHTML=`<div class="spin">${esc(t('loading'))}</div>`;try{await loadMe()}catch(err){app.innerHTML=`<div class="msg err">${esc(errText(err))}</div>`;return}}
  if(role()==='admin'&&S.mfaChecked!==S.me.id){S.mfaChecked=S.me.id;try{const sec=(await q(sb.rpc('admin_security')))[0]||{};S.mfaNeeded=!!(sec.has_factor&&sec.aal!=='aal2')}catch(_){S.mfaNeeded=false}}
  if(role()==='admin'&&S.mfaNeeded){app.innerHTML=header()+flashHTML()+mfaPrompt();S.flash=null;bindForms();return}
  const r=route();const allowed=tabsFor().map(x=>x[0]);
  let body;
  try{
    const fl=r.view==='app'?'':flashHTML();
    if(r.view==='app'&&r.id)body=await viewApp(r.id);
    else if(r.view==='chat'&&r.id)body=await viewChat(r.id);
    else if(!allowed.includes(r.view)){location.replace('#'+allowed[0]);return}
    else if(r.view==='new')body=fl+viewNew();
    else if(r.view==='people')body=fl+await viewPeople();
    else if(r.view==='gifts')body=fl+await viewGifts();
    else if(r.view==='feed')body=fl+await viewFeed();
    else if(r.view==='offers')body=fl+await viewOffers();
    else if(r.view==='profile')body=fl+viewProfile()+await mfaProfileHTML();
    else body=fl+await viewList(r.view);
  }catch(err){body=`<div class="msg err">${esc(errText(err))}</div>`}
  if(my!==renderSeq)return;
  S.flash=null;app.innerHTML=header()+body;bindForms();
  if($('#fVer'))$('#vScore').textContent=needScore($('#fVer'));
}
function bindForms(){
  const on=(id,fn)=>{const el=$(id);if(el)el.addEventListener('submit',fn)};
  on('#fAuth',onAuthSubmit);on('#fPw',onPwSubmit);on('#fApp',onAppSubmit);on('#fVer',onVerSubmit);on('#fPay',onPaySubmit);on('#fProf',onProfSubmit);on('#fEdit',onEditSubmit);
  const so=$('#signOut');if(so)so.addEventListener('click',async()=>{await sb.auth.signOut();S.me=null;S.staff=[];S.authMode='signin';history.replaceState(null,'',location.pathname);render()});
}

sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==='PASSWORD_RECOVERY')S.recovery=true;
  const changed=(S.session&&S.session.user.id)!==(session&&session.user.id);
  S.session=session;if(changed){S.me=null;S.staff=[]}
  if(changed||ev==='PASSWORD_RECOVERY'||ev==='INITIAL_SESSION')setTimeout(render,0);
});
</script>
</body>
