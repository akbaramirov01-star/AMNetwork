[data-theme="light"]{--bg1:#F5F0E8;--bg2:#EDE8DE;--bg3:#DDD0BB;--gold:#A88528;--gold2:#8A6A12;--gold3:rgba(201,168,76,.14);--text:#1C2E1F;--text2:rgba(28,46,31,.75);--text3:rgba(28,46,31,.55);--border:rgba(28,69,50,.14);--card:rgba(255,255,255,.85);--nav-bg:rgba(245,240,232,.95);--input-bg:#fff;--input-border:rgba(28,69,50,.22);--ok:#1E7A4C;--ok-bg:rgba(30,122,76,.1);--warn:#8A6A12;--warn-bg:rgba(201,168,76,.16);--bad:#B42318;--bad-bg:rgba(180,35,24,.08);--info:#1D5FA8;--info-bg:rgba(29,95,168,.08)}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg1);color:var(--text);font:15px/1.55 'DM Sans',system-ui,sans-serif;min-height:100vh}
a{color:var(--gold)}
nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;height:60px;background:var(--nav-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-logo img{height:34px;display:block}
.nav-right{display:flex;gap:8px;align-items:center}
.nbtn{min-height:38px;min-width:38px;padding:0 10px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text2);font:600 13px 'DM Sans',sans-serif;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.nbtn:hover{border-color:var(--gold);color:var(--gold)}
main{max-width:980px;margin:0 auto;padding:22px 16px 80px}
h1{font:700 clamp(26px,4.5vw,36px)/1.2 'Cormorant Garamond',serif;margin-bottom:6px}
h2{font:700 22px/1.25 'Cormorant Garamond',serif;margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--text2);font-size:14px}
.muted{color:var(--text3)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{min-height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);font:600 14px 'DM Sans',sans-serif;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#16130a}
.btn.primary:hover{background:var(--gold2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:wait}
.btn:focus-visible,.nbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--text2)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font:15px 'DM Sans',sans-serif}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.grid2>*,.stack>*,label{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%}
input[type=file]{font-size:14px;max-width:100%}
html,body{overflow-x:hidden}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;color:var(--text);font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer}
.chk input{width:20px;min-height:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--gold)}
.chk .pts{margin-inline-start:auto;color:var(--gold);font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;border:1px solid var(--border);border-radius:14px;background:var(--input-bg);margin:18px 0}
.tab{flex:1 0 auto;min-height:42px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--text2);font:600 14px 'DM Sans',sans-serif;cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{background:var(--gold);color:#16130a}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:30px;font-size:12px;font-weight:700;white-space:nowrap}
.s-new{background:var(--info-bg);color:var(--info)}.s-assigned{background:var(--warn-bg);color:var(--warn)}.s-verified{background:var(--warn-bg);color:var(--warn)}
.s-approved{background:var(--ok-bg);color:var(--ok)}.s-paid{background:var(--ok-bg);color:var(--ok)}.s-rejected{background:var(--bad-bg);color:var(--bad)}
.role{background:var(--gold3);color:var(--gold);border:1px solid rgba(201,168,76,.35)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--card);text-decoration:none;color:inherit;cursor:pointer}
.item:hover{border-color:var(--gold)}
.item b{font-size:15px}
.item .meta{grid-column:1/-1;color:var(--text3);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chipf{min-height:36px;padding:0 12px;border-radius:30px;border:1px solid var(--border);background:transparent;color:var(--text2);font:600 13px 'DM Sans',sans-serif;cursor:pointer}
.chipf[aria-pressed="true"]{background:var(--gold3);border-color:var(--gold);color:var(--gold)}
dl.facts{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 14px;font-size:14px}
dl.facts dt{color:var(--text3)}
dl.facts dd{overflow-wrap:anywhere}
.tl{list-style:none;display:grid;gap:8px;border-inline-start:2px solid var(--border);padding-inline-start:14px}
.tl li{font-size:13.5px;position:relative}
.tl li::before{content:'';position:absolute;inset-inline-start:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.msg{padding:12px 14px;border-radius:12px;font-size:14px;border:1px solid var(--border)}
.msg.err{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.msg.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.msg.info{background:var(--gold3);color:var(--text);border-color:rgba(201,168,76,.3)}
.score{font:700 34px/1 'Cormorant Garamond',serif;color:var(--gold)}
.hash{font:12px ui-monospace,Menlo,monospace;overflow-wrap:anywhere;color:var(--text3)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;margin-bottom:12px;text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}
th{font-size:12px;color:var(--text3);font-weight:600}
.tw{overflow-x:auto}
.center{text-align:center}
.spin{padding:40px 0;text-align:center;color:var(--text3)}
.hidden{display:none!important}
@media (max-width:420px){#navLog{display:none}}
@media (max-width:560px){dl.facts{grid-template-columns:1fr}dl.facts dt{margin-top:6px}}
</style>

function errText(e){
  const m=String((e&&(e.message||e.error_description))||e||'');
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return t('errNet');
  if(/Invalid login credentials/i.test(m))return t('errLogin');
  if(/already registered|already been registered/i.test(m))return t('errExists');
  if(/Email not confirmed/i.test(m))return t('notConfirmed');
  if(/at least one in-person verification/i.test(m))return t('errNeedVer');
  if(/cannot verify it/i.test(m))return t('errSelfVer');
  if(/only an approved application/i.test(m))return t('errNotApproved');
  if(/consent_check/i.test(m))return t('errConsent');
  if(/assignee must be a verifier/i.test(m))return t('errAssignee');
  if(/set only by recording a payout/i.test(m))return t('errPaidOnly');
  if(/admin only/i.test(m))return t('errAdminOnly');
  if(/row-level security/i.test(m))return t('err',{m:'access denied'});
  return t('err',{m});
}
const role=()=>S.me&&S.me.role||'applicant';
const isAdmin=()=>role()==='admin';
const isVer=()=>role()==='verifier'||isAdmin();

function tabsFor(){
  const r=role(),tabs=[];
  if(r==='admin')tabs.push(['all','t_all'],['check','t_check'],['people','t_people']);
  if(r==='verifier')tabs.push(['check','t_check']);
  if(r==='donor')tabs.push(['gifts','t_gifts']);
  tabs.push(['mine','t_mine'],['new','t_new'],['profile','t_profile']);
  return tabs;
}
function route(){const h=location.hash.replace(/^#\/?/,'');const [a,b]=h.split('/');return {view:a||tabsFor()[0][0],id:b||null}}

function viewAuth(){

  return `<div style="max-width:460px;margin:20px auto" class="stack">
    <div><h1>${esc(t('title'))}</h1><p class="sub">${esc(t('authIntro'))}</p></div>
    <div class="tabs" role="tablist"><button class="tab" data-mode="signin" ${!up&&!fg?'aria-current="page"':''}>${esc(t('signin'))}</button><button class="tab" data-mode="signup" ${up?'aria-current="page"':''}>${esc(t('signup'))}</button></div>
    ${flashHTML()}
    <form id="fAuth" class="card stack" novalidate>
      ${up?`<label>${esc(t('fullName'))}<input id="aName" required maxlength="120" autocomplete="name"></label>`:''}
      <label>${esc(t('email'))}<input id="aEmail" type="email" required autocomplete="email" inputmode="email"></label>
      ${fg?'':`<label>${esc(t('password'))}<input id="aPw" type="password" required minlength="8" autocomplete="${up?'new-password':'current-password'}">${up?`<span class="muted">${esc(t('pwHint'))}</span>`:''}</label>`}
      <button class="btn primary" id="aGo">${esc(fg?t('sendReset'):up?t('doSignup'):t('doSignin'))}</button>
      ${up?'':`<button type="button" class="btn" data-mode="${fg?'signin':'forgot'}" style="min-height:38px;border:0;background:transparent;color:var(--gold)">${esc(fg?t('back'):t('forgot'))}</button>`}
    </form></div>`;
}
document.addEventListener('click',e=>{const m=e.target.closest('[data-mode]');if(m){e.preventDefault();S.authMode=m.dataset.mode;render()}});

async function onAuthSubmit(e){
  e.preventDefault();const btn=$('#aGo');busy(btn,true);
  const email=$('#aEmail').value.trim();
  try{
    if(S.authMode==='forgot'){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/cabinet/'});
      if(error)throw error;S.flash={kind:'ok',text:t('resetSent')};S.authMode='signin';render();return;
    }
    const pw=$('#aPw').value;
    if(pw.length<8)throw new Error(t('pwHint'));
    if(S.authMode==='signup'){
      const name=$('#aName').value.trim();
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:name},emailRedirectTo:location.origin+'/cabinet/'}});
      if(error)throw error;
      if(data&&data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)throw new Error('already registered');
      if(!data.session){S.flash={kind:'ok',text:t('checkEmail')};S.authMode='signin';render()}
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;
    }
  }catch(err){S.flash={kind:'err',text:errText(err)};render()}
  finally{busy(btn,false)}
}
async function onPwSubmit(e){
  e.preventDefault();const pw=$('#pw1').value;
  const {error}=await sb.auth.updateUser({password:pw});
  if(error){S.flash={kind:'err',text:errText(error)}}else{S.recovery=false;S.flash={kind:'ok',text:t('pwSaved')}}
  render();
}

async function loadMe(){
  S.me=await q(sb.from('profiles').select('*').eq('id',S.session.user.id).maybeSingle());
  if(!S.me)S.me={id:S.session.user.id,role:'applicant',email:S.session.user.email,full_name:''};
  S.staff=isAdmin()?await q(sb.rpc('list_staff')):[];
}
const staffName=id=>{const p=S.staff.find(x=>x.id===id);return p?(p.full_name||p.email):(id===S.me.id?(S.me.full_name||S.me.email):'—')};

  const uid=S.me.id;
  if(kind==='mine')rows=rows.filter(a=>a.created_by===uid);
  if(kind==='check')rows=rows.filter(a=>a.assigned_to===uid&&['assigned','verified'].includes(a.status));
  let chips='';
  if(kind==='all'){
    const c={all:rows.length};STATUSES.forEach(s=>c[s]=rows.filter(a=>a.status===s).length);
    chips=`<div class="chips">${['all',...STATUSES].map(s=>`<button class="chipf" data-filter="${s}" aria-pressed="${S.filter===s}">${esc(s==='all'?t('all'):t('s_'+s))} · ${c[s]}</button>`).join('')}</div>`;
    if(S.filter!=='all')rows=rows.filter(a=>a.status===S.filter);
  }
  return chips+(rows.length?`<div class="list">${rows.map(appItem).join('')}</div>`:`<div class="card center muted">${esc(t('empty'))}</div>`);
}
document.addEventListener('click',e=>{const f=e.target.closest('[data-filter]');if(f){S.filter=f.dataset.filter;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Enter'){const it=e.target.closest&&e.target.closest('.item[data-href]');if(it)location.hash=it.dataset.href}});

function viewNew(){
  const other=role()!=='applicant';
  return `<form id="fApp" class="card stack">
   ${other?`<div class="msg info">${esc(t('forOther'))}</div>`:''}
   <div class="grid2">
    <label>${esc(t('f_name'))}<input name="full_name" required minlength="2" maxlength="120" ${other?'':`value="${esc(S.me.full_name||'')}"`}></label>
    <label>${esc(t('f_phone'))}<input name="phone" type="tel" maxlength="40" inputmode="tel"></label>

    <label>${esc(t('f_address'))}<input name="address" maxlength="200"></label>
    <label>${esc(t('f_hh'))}<input name="household_size" type="number" min="1" max="30" inputmode="numeric"></label>

   <label>${esc(t('f_situation'))}<textarea name="situation" maxlength="3000"></textarea></label>
   <label class="chk"><input type="checkbox" name="consent" required><span>${esc(t('f_consent'))}</span></label>

async function onAppSubmit(e){
  e.preventDefault();const f=e.target,btn=$('#appGo');
  if(!f.reportValidity())return;
  const num=v=>v===''?null:Number(v);
  const row={full_name:f.full_name.value.trim(),phone:f.phone.value.trim()||null,region:f.region.value.trim(),address:f.address.value.trim()||null,
    household_size:num(f.household_size.value),dependents:num(f.dependents.value),monthly_income:num(f.monthly_income.value),currency:f.currency.value,
    categories:[...f.querySelectorAll('[name=cat]:checked')].map(x=>x.value),situation:f.situation.value.trim()||null,consent:f.consent.checked};
  busy(btn,true);
  try{const d=await q(sb.from('applications').insert(row).select('id,ref').single());S.flash={kind:'ok',text:t('submitted',{r:d.ref})};nav('app/'+d.id)}
  catch(err){S.flash={kind:'err',text:errText(err)};render()}
}

async function viewApp(id){
  const a=await q(sb.from('applications').select('*').eq('id',id).maybeSingle());
  if(!a)return `<a class="back" href="#">${esc(t('back'))}</a><div class="card muted">${esc(t('empty'))}</div>`;
  const [ev,vs,ps]=await Promise.all([
    q(sb.from('events').select('*').eq('application_id',id).order('id')),
    isVer()?q(sb.from('verifications').select('*').eq('application_id',id).order('created_at')):Promise.resolve([]),
    isAdmin()?q(sb.from('payouts').select('*').eq('application_id',id).order('seq')):Promise.resolve([])]);
  const uid=S.me.id;
  const facts=[[t('ref'),a.ref],[t('status'),null],[t('created'),fmtD(a.created_at)],[t('f_region'),a.region]];
  const seePrivate=isAdmin()||a.assigned_to===uid||a.created_by===uid;
  if(seePrivate)facts.push([t('f_phone'),a.phone||'—'],[t('f_address'),a.address||'—'],[t('f_hh'),a.household_size??'—'],[t('f_dep'),a.dependents??'—'],
    [t('f_income'),a.monthly_income!=null?money(a.monthly_income,a.currency):'—']);
  if(a.need_score!=null)facts.push([t('score'),a.need_score+' / 100']);
  if(isAdmin())facts.push([t('a_assign'),a.assigned_to?staffName(a.assigned_to):t('a_none')]);
  let html=`<a class="back" href="#${isAdmin()?'all':a.assigned_to===uid?'check':'mine'}">${esc(t('back'))}</a>${flashHTML()}
  <div class="card stack"><div class="row between"><h2 style="margin:0">${esc(a.full_name)}</h2>${pill(a.status)}</div>
   <dl class="facts">${facts.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${v===null?pill(a.status):esc(v)}</dd>`).join('')}</dl>
   ${(a.categories||[]).length?`<div class="row">${a.categories.map(c=>`<span class="pill role">${esc(cat(c))}</span>`).join('')}</div>`:''}
   ${a.situation&&seePrivate?`<p style="white-space:pre-wrap">${esc(a.situation)}</p>`:''}
   ${a.admin_note&&isAdmin()?`<div class="msg info">${esc(a.admin_note)}</div>`:''}
  </div>`;
  html+=`<div class="card"><h3>${esc(t('timeline'))}</h3><ul class="tl">${ev.map(x=>`<li><b>${esc(t('e_'+x.kind))}</b> <span class="muted">· ${esc(fmtD(x.at))}</span>${x.kind==='verified'&&x.detail&&x.detail.recommendation&&isVer()?` · ${esc(x.detail.recommendation==='approve'?t('v_approve'):t('v_reject'))}`:''}</li>`).join('')}</ul></div>`;
  if(isVer()&&(a.assigned_to===uid||isAdmin())&&['assigned','verified'].includes(a.status)){
    const mine=vs.find(v=>v.verifier_id===uid);
    if(mine)html+=`<div class="msg ok">${esc(t('v_already'))}</div>`;
    else if(a.created_by===uid&&!isAdmin())html+=`<div class="msg info">${esc(t('v_cannot'))}</div>`;
    else html+=verifyForm(a);
  }
  if(isAdmin())html+=adminBlock(a,vs,ps);
  else if(vs.length&&isVer())html+=verifsHTML(vs);
  return html;
}
function verifyForm(a){
  return `<form id="fVer" class="card stack" data-app="${a.id}"><h2>${esc(t('v_title'))}</h2>
   <fieldset class="checks" style="border:0"><legend><h3>${esc(t('v_facts'))}</h3></legend>${FACTS.map(k=>`<label class="chk"><input type="checkbox" name="fact" value="${k}"><span>${esc(t('c_'+k))}</span></label>`).join('')}</fieldset>
   <fieldset class="checks" style="border:0"><legend><h3>${esc(t('v_need'))}</h3></legend>
    ${NEED.map(([k,p])=>`<label class="chk"><input type="checkbox" name="need" value="${k}" data-pts="${p}"><span>${esc(t('n_'+k))}</span><span class="pts">+${p}</span></label>`).join('')}
    <label class="chk" style="align-items:center"><span>${esc(t('n_dependents'))}</span><input type="number" name="deps" min="0" max="30" value="${a.dependents??0}" style="width:90px;margin-inline-start:auto" inputmode="numeric"></label>
   </fieldset>
   <div class="row between"><div><div class="muted">${esc(t('score'))}</div><div class="score" id="vScore">0</div></div><p class="muted" style="max-width:420px;font-size:13px">${esc(t('scoreNote'))}</p></div>
   <div class="grid2"><label>${esc(t('v_date'))}<input type="date" name="visited_on" value="${new Date().toISOString().slice(0,10)}" required></label>
    <label>${esc(t('v_rec'))}<select name="rec" required><option value="approve">${esc(t('v_approve'))}</option><option value="reject">${esc(t('v_reject'))}</option></select></label></div>
   <label>${esc(t('v_notes'))}<textarea name="notes" maxlength="4000"></textarea></label>
   <button class="btn primary" id="verGo">${esc(t('v_submit'))}</button></form>`;
}
function needScore(f){
  const on=k=>f.querySelector(`[name=need][value=${k}]`).checked;
  let s=0;for(const [k,p] of NEED){if(k==='below_min'&&on('no_income'))continue;if(on(k))s+=p}
  s+=Math.min(10,2*Math.max(0,Number(f.deps.value)||0));
  return Math.min(100,s);
}
document.addEventListener('input',e=>{const f=e.target.closest('#fVer');if(f)$('#vScore').textContent=needScore(f)});
document.addEventListener('change',e=>{const f=e.target.closest('#fVer');if(f)$('#vScore').textContent=needScore(f)});
async function onVerSubmit(e){
  e.preventDefault();const f=e.target,btn=$('#verGo');busy(btn,true);
  const checks={facts:[...f.querySelectorAll('[name=fact]:checked')].map(x=>x.value),need:[...f.querySelectorAll('[name=need]:checked')].map(x=>x.value),dependents:Number(f.deps.value)||0};
  try{await q(sb.from('verifications').insert({application_id:f.dataset.app,verifier_id:S.me.id,visited_on:f.visited_on.value,checks,need_score:needScore(f),recommendation:f.rec.value,notes:f.notes.value.trim()||null}));
    S.flash={kind:'ok',text:t('v_done')}}catch(err){S.flash={kind:'err',text:errText(err)}}
  render();
}
function verifsHTML(vs){
  return `<div class="card stack"><h3>${esc(t('a_verifs'))}</h3>${vs.length?vs.map(v=>`<div class="msg">
   <div class="row between"><b>${esc(v.recommendation==='approve'?t('v_approve'):t('v_reject'))} · ${v.need_score??'—'}/100</b><span class="muted">${esc(t('a_by'))} ${esc(staffName(v.verifier_id))} · ${esc(fmtD(v.visited_on))}</span></div>
   <div class="muted" style="font-size:13px;margin-top:6px">${(v.checks.facts||[]).map(k=>'✓ '+esc(t('c_'+k))).join('<br>')}</div>
   ${(v.checks.need||[]).length?`<div style="font-size:13px;margin-top:6px">${v.checks.need.map(k=>esc(t('n_'+k))).join(' · ')}</div>`:''}
   ${v.notes?`<p style="white-space:pre-wrap;margin-top:6px">${esc(v.notes)}</p>`:''}</div>`).join(''):`<p class="muted">${esc(t('a_noVerifs'))}</p>`}</div>`;
}
function adminBlock(a,vs,ps){
  const vers=S.staff.filter(p=>(p.role==='verifier'||p.role==='admin')&&(p.id!==a.created_by||p.role==='admin'));
  const donors=S.staff.filter(p=>p.role==='donor'||p.role==='admin');
  let h=verifsHTML(vs);
  if(!['paid'].includes(a.status))h+=`<form id="fAdm" class="card stack" data-app="${a.id}">
    <div class="grid2"><label>${esc(t('a_assign'))}<select name="assigned_to"><option value="">${esc(t('a_none'))}</option>${vers.map(p=>`<option value="${p.id}" ${p.id===a.assigned_to?'selected':''}>${esc(p.full_name||p.email)} · ${esc(t('r_'+p.role))}</option>`).join('')}</select></label></div>
    <label>${esc(t('a_note'))}<textarea name="admin_note" maxlength="2000">${esc(a.admin_note||'')}</textarea></label>
    <div class="row"><button class="btn" data-adm="save">${esc(t('save'))}</button>
     ${['verified','assigned','new'].includes(a.status)?`<button class="btn primary" data-adm="approved">${esc(t('a_approve'))}</button><button class="btn danger" data-adm="rejected">${esc(t('a_reject'))}</button>`:''}
     ${['rejected','approved'].includes(a.status)?`<button class="btn" data-adm="reopen">${esc(t('a_reopen'))}</button>`:''}</div></form>`;
  if(['approved','paid'].includes(a.status))h+=`<form id="fPay" class="card stack" data-app="${a.id}"><h2>${esc(t('a_pay'))}</h2>
    <div class="grid2"><label>${esc(t('p_amount'))}<input name="amount" type="number" min="0.01" step="0.01" required inputmode="decimal"></label>
     <label>${esc(t('f_cur'))}<select name="currency">${['TJS','USD','EUR','RUB'].map(c=>`<option>${c}</option>`).join('')}</select></label>
     <label>${esc(t('p_method'))}<select name="method">${['cash','alif','dc','bank','other'].map(m=>`<option value="${m}">${esc(t('m_'+m))}</option>`).join('')}</select></label>
     <label>${esc(t('p_kind'))}<select name="kind"><option value="zakat">${esc(t('k_zakat'))}</option><option value="sadaqah">${esc(t('k_sadaqah'))}</option></select></label>
     <label>${esc(t('p_date'))}<input name="paid_on" type="date" required value="${new Date().toISOString().slice(0,10)}"></label>
     <label>${esc(t('a_donor'))}<select name="donor_id"><option value="">${esc(t('a_donorNone'))}</option>${donors.map(p=>`<option value="${p.id}">${esc(p.full_name||p.email)}</option>`).join('')}</select></label></div>
    <label>${esc(t('p_receipt'))}<input name="receipt" type="file" accept="image/*,application/pdf"><span class="muted" style="font-weight:400">${esc(t('p_receiptHint'))}</span><span class="hash" id="rHash"></span></label>
    <label>${esc(t('p_note'))}<input name="public_note" maxlength="300"></label>
    <button class="btn primary" id="payGo">${esc(t('p_save'))}</button></form>`;
  if(ps.length)h+=`<div class="card"><h3>${esc(t('a_payouts'))}</h3><div class="tw"><table><thead><tr><th>#</th><th>${esc(t('p_date'))}</th><th>${esc(t('p_amount'))}</th><th>${esc(t('p_method'))}</th><th>${esc(t('a_donor'))}</th></tr></thead><tbody>
    ${ps.map(p=>`<tr><td>${p.seq}</td><td>${esc(fmtD(p.paid_on))}</td><td>${esc(money(p.amount,p.currency))} · ${esc(t('k_'+p.kind))}</td><td>${esc(t('m_'+p.method))}</td><td>${esc(p.donor_id?staffName(p.donor_id):'—')}</td></tr>`).join('')}</tbody></table></div></div>`;
  return h;
}
async function sha256Hex(buf){const h=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(h)].map(b=>b.toString(16).padStart(2,'0')).join('')}
document.addEventListener('change',async e=>{if(e.target.name==='receipt'&&e.target.files[0]){$('#rHash').textContent='SHA-256: '+await sha256Hex(await e.target.files[0].arrayBuffer())}});
document.addEventListener('click',async e=>{
  const b=e.target.closest('[data-adm]');if(!b)return;e.preventDefault();
  const f=b.closest('form'),act=b.dataset.adm,id=f.dataset.app;
  const upd={assigned_to:f.assigned_to.value||null,admin_note:f.admin_note.value.trim()||null};
  if(act==='approved'||act==='rejected')upd.status=act;
  if(act==='reopen')upd.status=upd.assigned_to?'assigned':'new';
  busy(b,true);
  try{await q(sb.from('applications').update(upd).eq('id',id));S.flash={kind:'ok',text:t('saved')}}catch(err){S.flash={kind:'err',text:errText(err)}}
  render();
});
async function onPaySubmit(e){
  e.preventDefault();const f=e.target,btn=$('#payGo');if(!f.reportValidity())return;busy(btn,true);
  try{
    const file=f.receipt.files[0];const receipt_sha256=file?await sha256Hex(await file.arrayBuffer()):null;
    await q(sb.from('payouts').insert({application_id:f.dataset.app,donor_id:f.donor_id.value||null,amount:Number(f.amount.value),currency:f.currency.value,
      method:f.method.value,kind:f.kind.value,paid_on:f.paid_on.value,receipt_sha256,public_note:f.public_note.value.trim()||null}));
    S.flash={kind:'ok',text:t('p_saved')};
  }catch(err){S.flash={kind:'err',text:errText(err)}}
  render();
}

   ${S.staff.map(p=>`<tr><td>${esc(p.full_name||'—')}${p.city?`<div class="muted">${esc(p.city)}</div>`:''}</td><td>${esc(p.email)}</td>
    <td><select data-role="${p.id}" ${p.id===S.me.id?'disabled':''} style="min-width:150px">${['applicant','donor','verifier','admin'].map(r=>`<option value="${r}" ${r===p.role?'selected':''}>${esc(t('r_'+r))}</option>`).join('')}</select></td>
    <td class="muted">${esc(fmtD(p.created_at))}</td></tr>`).join('')}</tbody></table></div>`;

document.addEventListener('change',async e=>{

  try{await q(sb.rpc('set_role',{target:s.dataset.role,new_role:s.value}));S.flash={kind:'ok',text:t('saved')}}catch(err){S.flash={kind:'err',text:errText(err)}}

async function viewGifts(){
  const rows=await q(sb.rpc('my_payouts'));
  return `<p class="sub" style="margin-bottom:12px">${esc(t('g_intro'))}</p>`+(rows.length?`<div class="list">${rows.map(r=>`<div class="item" style="cursor:default"><b>${esc(money(r.amount,r.currency))} · ${esc(t('k_'+r.kind))}</b><span class="pill s-paid">${esc(fmtD(r.paid_on))}</span>
    <div class="meta">${esc(r.ref)} · ${esc(r.region)} · ${r.verifications} ${esc(t('g_verifs'))}${(r.categories||[]).length?' · '+esc(r.categories.map(cat).join(', ')):''}<div class="hash">${esc(r.entry_hash)}</div></div></div>`).join('')}</div>`:`<div class="card center muted">${esc(t('empty'))}</div>`)+
    `<p style="margin-top:14px"><a href="/transparency/">${esc(t('logLink'))} →</a></p>`;
}
function viewProfile(){
  return `<form id="fProf" class="card stack" style="max-width:520px">
   <label>${esc(t('fullName'))}<input name="full_name" maxlength="120" value="${esc(S.me.full_name||'')}"></label>
   <label>${esc(t('f_phone'))}<input name="phone" type="tel" maxlength="40" value="${esc(S.me.phone||'')}"></label>
   <label>${esc(t('pr_city'))}<input name="city" maxlength="80" value="${esc(S.me.city||'')}"></label>
   <button class="btn primary" id="profGo">${esc(t('save'))}</button></form>`;
}
async function onProfSubmit(e){
  e.preventDefault();const f=e.target;busy($('#profGo'),true);
  try{await q(sb.from('profiles').update({full_name:f.full_name.value.trim()||null,phone:f.phone.value.trim()||null,city:f.city.value.trim()||null}).eq('id',S.me.id));await loadMe();S.flash={kind:'ok',text:t('saved')}}
  catch(err){S.flash={kind:'err',text:errText(err)}}
  render();

// ───────────── render ─────────────
let renderSeq=0;
async function render(){
  chrome();const app=$('#app');const my=++renderSeq;
  if(!S.session||S.recovery){app.innerHTML=viewAuth();S.flash=null;bindForms();return}
  if(!S.me){app.innerHTML=`<div class="spin">${esc(t('loading'))}</div>`;try{await loadMe()}catch(err){app.innerHTML=`<div class="msg err">${esc(errText(err))}</div>`;return}}
  const r=route();const allowed=tabsFor().map(x=>x[0]);
  let body;
  try{
    const fl=r.view==='app'?'':flashHTML();
    if(r.view==='app'&&r.id)body=await viewApp(r.id);
    else if(!allowed.includes(r.view)){location.replace('#'+allowed[0]);return}
    else if(r.view==='new')body=fl+viewNew();
    else if(r.view==='people')body=fl+await viewPeople();
    else if(r.view==='gifts')body=fl+await viewGifts();
    else if(r.view==='profile')body=fl+viewProfile();
    else body=fl+await viewList(r.view);
  }catch(err){body=`<div class="msg err">${esc(errText(err))}</div>`}
  if(my!==renderSeq)return;
  S.flash=null;app.innerHTML=header()+body;bindForms();
  if($('#fVer'))$('#vScore').textContent=needScore($('#fVer'));
}
function bindForms(){
  const on=(id,fn)=>{const el=$(id);if(el)el.addEventListener('submit',fn)};
  on('#fAuth',onAuthSubmit);on('#fPw',onPwSubmit);on('#fApp',onAppSubmit);on('#fVer',onVerSubmit);on('#fPay',onPaySubmit);on('#fProf',onProfSubmit);
  const so=$('#signOut');if(so)so.addEventListener('click',async()=>{await sb.auth.signOut();S.me=null;S.staff=[];S.authMode='signin';history.replaceState(null,'',location.pathname);render()});
}

sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==='PASSWORD_RECOVERY')S.recovery=true;
  const changed=(S.session&&S.session.user.id)!==(session&&session.user.id);
  S.session=session;if(changed){S.me=null;S.staff=[]}
  if(changed||ev==='PASSWORD_RECOVERY'||ev==='INITIAL_SESSION')setTimeout(render,0);
});
</script>
