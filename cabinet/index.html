[data-theme="light"]{--bg1:#F5F0E8;--bg2:#EDE8DE;--bg3:#DDD0BB;--gold:#A88528;--gold2:#8A6A12;--gold3:rgba(201,168,76,.14);--text:#1C2E1F;--text2:rgba(28,46,31,.75);--text3:rgba(28,46,31,.55);--border:rgba(28,69,50,.14);--card:rgba(255,255,255,.85);--nav-bg:rgba(245,240,232,.95);--input-bg:#fff;--input-border:rgba(28,69,50,.22);--ok:#1E7A4C;--ok-bg:rgba(30,122,76,.1);--warn:#8A6A12;--warn-bg:rgba(201,168,76,.16);--bad:#B42318;--bad-bg:rgba(180,35,24,.08);--info:#1D5FA8;--info-bg:rgba(29,95,168,.08)}
:root{--ff:'DM Sans','Noto Naskh Arabic','Noto Sans SC',system-ui,sans-serif;--fh:'Cormorant Garamond','Noto Naskh Arabic','Noto Sans SC',serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg1);color:var(--text);font:15px/1.55 var(--ff);min-height:100vh}
a{color:var(--gold)}
nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:0 16px;height:60px;background:var(--nav-bg);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.nav-logo img{height:34px;display:block}
.nav-right{display:flex;gap:8px;align-items:center}
.nbtn{min-height:38px;min-width:38px;padding:0 10px;border-radius:9px;border:1px solid var(--border);background:transparent;color:var(--text2);font:600 13px var(--ff);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.nbtn:hover{border-color:var(--gold);color:var(--gold)}
main{max-width:980px;margin:0 auto;padding:22px 16px 80px}
h1{font:700 clamp(26px,4.5vw,36px)/1.2 var(--fh);margin-bottom:6px}
h2{font:700 22px/1.25 var(--fh);margin:0 0 10px}
h3{font-size:15px;margin:0 0 8px}
.sub{color:var(--text2);font-size:14px}
.muted{color:var(--text3)}
.card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}
.stack{display:grid;gap:14px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.between{justify-content:space-between}
.btn{min-height:44px;padding:0 18px;border-radius:11px;border:1px solid var(--border);background:var(--card);color:var(--text);font:600 14px var(--ff);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-decoration:none}
.btn:hover{border-color:var(--gold)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#16130a}
.btn.primary:hover{background:var(--gold2)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.55;cursor:wait}
.btn:focus-visible,.nbtn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
label{display:grid;gap:6px;font-size:13px;font-weight:600;color:var(--text2)}
input,select,textarea{width:100%;min-height:44px;padding:10px 12px;border-radius:10px;border:1px solid var(--input-border);background:var(--input-bg);color:var(--text);font:15px var(--ff)}
textarea{min-height:90px;resize:vertical}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(220px,100%),1fr));gap:12px}
.grid2>*,.stack>*,label{min-width:0}
input[type=date]{-webkit-appearance:none;appearance:none;display:block;min-width:0;max-width:100%}
input[type=file]{font-size:14px;max-width:100%}
html,body{overflow-x:hidden}
.checks{display:grid;gap:8px}
.chk{display:flex;gap:10px;align-items:flex-start;font-weight:500;color:var(--text);font-size:14px;padding:10px 12px;border:1px solid var(--border);border-radius:10px;background:var(--card);cursor:pointer}
.chk input{width:20px;min-height:20px;height:20px;margin-top:1px;flex:none;accent-color:var(--gold)}
.chk .pts{margin-inline-start:auto;color:var(--gold);font-weight:700;white-space:nowrap}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px;border:1px solid var(--border);border-radius:14px;background:var(--input-bg);margin:18px 0}
.tab{flex:1 0 auto;min-height:42px;padding:0 14px;border:0;border-radius:10px;background:transparent;color:var(--text2);font:600 14px var(--ff);cursor:pointer;white-space:nowrap}
.tab[aria-current="page"]{background:var(--gold);color:#16130a}
.ai-box{border-color:rgba(201,168,76,.45)}.ai-ul{margin:4px 0 0;padding-inline-start:18px;font-size:14px}.pill.ai-cat{background:var(--gold3);color:var(--gold)}.ai-box .pill{white-space:normal;text-align:start}.pill.unv{background:rgba(255,170,80,.14);color:#E8A04A}
.pill{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:30px;font-size:12px;font-weight:700;white-space:nowrap}
.s-new{background:var(--info-bg);color:var(--info)}.s-assigned{background:var(--warn-bg);color:var(--warn)}.s-verified{background:var(--warn-bg);color:var(--warn)}
.s-approved{background:var(--ok-bg);color:var(--ok)}.s-paid{background:var(--ok-bg);color:var(--ok)}.s-rejected{background:var(--bad-bg);color:var(--bad)}
.role{background:var(--gold3);color:var(--gold);border:1px solid rgba(201,168,76,.35)}
.list{display:grid;gap:10px}
.item{display:grid;grid-template-columns:1fr auto;gap:4px 12px;align-items:center;padding:14px 16px;border:1px solid var(--border);border-radius:14px;background:var(--card);text-decoration:none;color:inherit;cursor:pointer}
.item:hover{border-color:var(--gold)}
.item b{font-size:15px}
.item .meta{grid-column:1/-1;color:var(--text3);font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.chipf{min-height:36px;padding:0 12px;border-radius:30px;border:1px solid var(--border);background:transparent;color:var(--text2);font:600 13px var(--ff);cursor:pointer}
.chipf[aria-pressed="true"]{background:var(--gold3);border-color:var(--gold);color:var(--gold)}
dl.facts{display:grid;grid-template-columns:minmax(120px,max-content) 1fr;gap:6px 14px;font-size:14px}
dl.facts dt{color:var(--text3)}
dl.facts dd{overflow-wrap:anywhere}
.tl{list-style:none;display:grid;gap:8px;border-inline-start:2px solid var(--border);padding-inline-start:14px}
.tl li{font-size:13.5px;position:relative}
.tl li::before{content:'';position:absolute;inset-inline-start:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--gold)}
.msg{padding:12px 14px;border-radius:12px;font-size:14px;border:1px solid var(--border)}
.msg.err{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.msg.ok{background:var(--ok-bg);color:var(--ok);border-color:transparent}
.msg.info{background:var(--gold3);color:var(--text);border-color:rgba(201,168,76,.3)}
.score{font:700 34px/1 var(--fh);color:var(--gold)}
.hash{font:12px ui-monospace,Menlo,monospace;overflow-wrap:anywhere;color:var(--text3)}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;margin-bottom:12px;text-decoration:none}
table{width:100%;border-collapse:collapse;font-size:14px}
th,td{padding:9px 8px;border-bottom:1px solid var(--border);text-align:start;vertical-align:top}
th{font-size:12px;color:var(--text3);font-weight:600}
.tw{overflow-x:auto}
.center{text-align:center}
.spin{padding:40px 0;text-align:center;color:var(--text3)}
.hidden{display:none!important}
:lang(ar) h1,:lang(ar) h2{line-height:1.5}
:lang(ar) body{line-height:1.75}
[dir=rtl] input[type=email],[dir=rtl] input[type=password],[dir=rtl] input[type=tel]{direction:ltr;text-align:right}
.hash,.chk .pts{direction:ltr;unicode-bidi:isolate}
@media (max-width:420px){#navLog{display:none}}
@media (max-width:560px){dl.facts{grid-template-columns:1fr}dl.facts dt{margin-top:6px}}
</style>

function errText(e){
  const m=String((e&&(e.message||e.error_description))||e||'');
  if(/Failed to fetch|NetworkError|Load failed/i.test(m))return t('errNet');
  if(/Invalid login credentials/i.test(m))return t('errLogin');
  if(/already registered|already been registered/i.test(m))return t('errExists');
  if(/Email not confirmed/i.test(m))return t('notConfirmed');
  if(/at least one in-person verification/i.test(m))return t('errNeedVer');
  if(/cannot verify it/i.test(m))return t('errSelfVer');
  if(/only an approved application/i.test(m))return t('errNotApproved');
  if(/consent_check/i.test(m))return t('errConsent');
  if(/assignee must be a verifier/i.test(m))return t('errAssignee');
  if(/set only by recording a payout/i.test(m))return t('errPaidOnly');
  if(/admin only/i.test(m))return t('errAdminOnly');
  if(/row-level security/i.test(m))return t('err',{m:'access denied'});
  return t('err',{m});
}

async function onAuthSubmit(e){
  e.preventDefault();const btn=$('#aGo');busy(btn,true);
  const email=$('#aEmail').value.trim();
  try{
    if(S.authMode==='forgot'){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/cabinet/'});
      if(error)throw error;S.flash={kind:'ok',text:t('resetSent')};S.authMode='signin';render();return;
    }
    const pw=$('#aPw').value;
    if(pw.length<8)throw new Error(t('pwHint'));
    if(S.authMode==='signup'){
      const name=$('#aName').value.trim();
      const {data,error}=await sb.auth.signUp({email,password:pw,options:{data:{full_name:name},emailRedirectTo:location.origin+'/cabinet/'}});
      if(error)throw error;
      if(data&&data.user&&Array.isArray(data.user.identities)&&!data.user.identities.length)throw new Error('already registered');
      if(!data.session){S.flash={kind:'ok',text:t('checkEmail')};S.authMode='signin';render()}
    }else{
      const {error}=await sb.auth.signInWithPassword({email,password:pw});if(error)throw error;
    }
  }catch(err){S.flash={kind:'err',text:errText(err)};render()}
  finally{busy(btn,false)}
}
async function onPwSubmit(e){
  e.preventDefault();const pw=$('#pw1').value;
  const {error}=await sb.auth.updateUser({password:pw});
  if(error){S.flash={kind:'err',text:errText(error)}}else{S.recovery=false;S.flash={kind:'ok',text:t('pwSaved')}}
  render();
}

   ${a.story?`<p style="white-space:pre-wrap" dir="auto">${esc(a.story)}</p>`:''}
   ${aiHTML(a,false)}
   ${a.my_offer?`<div class="msg ok">${esc(t('fd_mine'))}</div>`:`<form class="stack fOffer" data-app="${a.id}"><textarea name="msg" maxlength="1000" placeholder="${esc(t('fd_msg_ph'))}"></textarea><button class="btn primary">${esc(t('fd_help'))}</button></form>`}
   <div class="muted" style="font-size:12px">${esc(fmtD(a.created_at))}${a.offers?` · ${a.offers} ${esc(t('fd_offers'))}`:''}</div></article>`;
}
async function viewFeed(){
  if(!isAdmin()&&!S.me.giver_approved)return `<div class="card stack"><p>${esc(t('fd_wait'))}</p><a class="btn" href="#profile">${esc(t('t_profile'))}</a></div>`;
  const rows=await q(sb.rpc('open_requests'));
  return `<p class="sub" style="margin-bottom:12px">${esc(t('fd_intro'))}</p>`+(rows.length?`<div class="stack">${rows.map(feedCard).join('')}</div>`:`<div class="card center muted">${esc(t('empty'))}</div>`);
}
document.addEventListener('submit',async e=>{
  const f=e.target.closest('.fOffer');if(!f)return;e.preventDefault();const b=f.querySelector('button');busy(b,true);
  try{await q(sb.rpc('make_offer',{p_id:f.dataset.app,p_message:f.msg.value.trim()||null}));S.flash={kind:'ok',text:t('fd_sent')}}catch(err){S.flash={kind:'err',text:errText(err)}}
  render();
});
async function viewOffers(){
  const rows=await q(sb.rpc('list_offers'));
  return `<p class="sub" style="margin-bottom:12px">${esc(t('of_intro'))}</p>`+(rows.length?`<div class="list">${rows.map(o=>`<div class="item" style="cursor:default;grid-template-columns:1fr">
    <div class="row between"><a href="#app/${o.application_id}" dir="ltr"><b>${esc(o.ref)}</b></a><select data-offer="${o.id}">${['new','connected','helped','closed'].map(x=>`<option value="${x}" ${x===o.status?'selected':''}>${esc(t('of_'+x))}</option>`).join('')}</select></div>
    <div><b>${esc(o.org_name||o.giver_name||'—')}</b> · <a href="mailto:${esc(o.giver_email)}">${esc(o.giver_email)}</a></div>
    ${o.message?`<p style="white-space:pre-wrap">${esc(o.message)}</p>`:''}<div class="muted" style="font-size:12px">${esc(fmtD(o.created_at))}</div></div>`).join('')}</div>`:`<div class="card center muted">${esc(t('empty'))}</div>`);
}
document.addEventListener('change',async e=>{
  const s=e.target.closest('[data-offer]');if(!s)return;s.disabled=true;
  try{await q(sb.from('offers').update({status:s.value}).eq('id',s.dataset.offer));S.flash={kind:'ok',text:t('saved')}}catch(err){S.flash={kind:'err',text:errText(err)}}
  render();
});
document.addEventListener('change',async e=>{
  const c=e.target.closest('[data-giver]');if(!c)return;c.disabled=true;
  try{await q(sb.rpc('set_giver',{target:c.dataset.giver,approved:c.checked}));S.flash={kind:'ok',text:t('saved')}}catch(err){S.flash={kind:'err',text:errText(err)}}
  render();
});
document.addEventListener('change',async e=>{
  const c=e.target.closest('[data-listed]');if(!c)return;c.disabled=true;
  try{await q(sb.from('applications').update({listed:c.checked}).eq('id',c.dataset.listed));S.flash={kind:'ok',text:t('saved')}}catch(err){S.flash={kind:'err',text:errText(err)}}
  render();
});

async function viewPeople(){
  S.staff=await q(sb.rpc('list_staff'));
  return `<p class="sub" style="margin-bottom:12px">${esc(t('pe_hint'))}</p><div class="card tw"><table><thead><tr><th>${esc(t('fullName'))}</th><th>${esc(t('email'))}</th><th>${esc(t('pe_role'))}</th><th>${esc(t('pe_giver'))}</th><th>${esc(t('pe_since'))}</th></tr></thead><tbody>
   ${S.staff.map(p=>`<tr><td>${esc(p.full_name||'—')}${p.city?`<div class="muted">${esc(p.city)}</div>`:''}</td><td>${esc(p.email)}</td>
    <td><select data-role="${p.id}" ${p.id===S.me.id?'disabled':''} style="min-width:150px">${['applicant','donor','verifier','admin'].map(r=>`<option value="${r}" ${r===p.role?'selected':''}>${esc(t('r_'+r))}</option>`).join('')}</select></td>
    <td><label class="chk" style="padding:0;border:0"><input type="checkbox" data-giver="${p.id}" ${p.giver_approved?'checked':''}>${p.org_name?`<span class="muted">${esc(p.org_name)}</span>`:''}</label></td>
    <td class="muted">${esc(fmtD(p.created_at))}</td></tr>`).join('')}</tbody></table></div>`;
}
document.addEventListener('change',async e=>{
  const s=e.target.closest('[data-role]');if(!s)return;s.disabled=true;
  try{await q(sb.rpc('set_role',{target:s.dataset.role,new_role:s.value}));S.flash={kind:'ok',text:t('saved')}}catch(err){S.flash={kind:'err',text:errText(err)}}
  render();
});
async function viewGifts(){
  const rows=await q(sb.rpc('my_payouts'));
  return `<p class="sub" style="margin-bottom:12px">${esc(t('g_intro'))}</p>`+(rows.length?`<div class="list">${rows.map(r=>`<div class="item" style="cursor:default"><b>${esc(money(r.amount,r.currency))} · ${esc(t('k_'+r.kind))}</b><span class="pill s-paid">${esc(fmtD(r.paid_on))}</span>
    <div class="meta">${esc(r.ref)} · ${esc(r.region)} · ${r.verifications} ${esc(t('g_verifs'))}${(r.categories||[]).length?' · '+esc(r.categories.map(cat).join(', ')):''}<div class="hash">${esc(r.entry_hash)}</div></div></div>`).join('')}</div>`:`<div class="card center muted">${esc(t('empty'))}</div>`)+
    `<p style="margin-top:14px"><a href="/transparency/">${esc(t('logLink'))} ${LANG==='ar'?'←':'→'}</a></p>`;
}
function viewProfile(){
  return `<form id="fProf" class="card stack" style="max-width:520px">
   <label>${esc(t('fullName'))}<input name="full_name" maxlength="120" value="${esc(S.me.full_name||'')}"></label>
   <label>${esc(t('f_phone'))}<input name="phone" type="tel" maxlength="40" value="${esc(S.me.phone||'')}"></label>
   <label>${esc(t('pr_city'))}<input name="city" maxlength="80" value="${esc(S.me.city||'')}"></label>
   <label>${esc(t('pr_org'))}<input name="org_name" maxlength="160" value="${esc(S.me.org_name||'')}"></label>
   <button class="btn primary" id="profGo">${esc(t('save'))}</button></form>`;
}
async function onProfSubmit(e){
  e.preventDefault();const f=e.target;busy($('#profGo'),true);
  try{await q(sb.from('profiles').update(Object.assign({full_name:f.full_name.value.trim()||null,phone:f.phone.value.trim()||null,city:f.city.value.trim()||null},f.org_name?{org_name:f.org_name.value.trim()||null}:{})).eq('id',S.me.id));await loadMe();S.flash={kind:'ok',text:t('saved')}}
  catch(err){S.flash={kind:'err',text:errText(err)}}
  render();
}

// ───────────── render ─────────────
let renderSeq=0;
async function render(){
  chrome();const app=$('#app');const my=++renderSeq;
  if(!S.session||S.recovery){app.innerHTML=viewAuth();S.flash=null;bindForms();return}
  if(!S.me){app.innerHTML=`<div class="spin">${esc(t('loading'))}</div>`;try{await loadMe()}catch(err){app.innerHTML=`<div class="msg err">${esc(errText(err))}</div>`;return}}
  const r=route();const allowed=tabsFor().map(x=>x[0]);
  let body;
  try{
    const fl=r.view==='app'?'':flashHTML();
    if(r.view==='app'&&r.id)body=await viewApp(r.id);
    else if(!allowed.includes(r.view)){location.replace('#'+allowed[0]);return}
    else if(r.view==='new')body=fl+viewNew();
    else if(r.view==='people')body=fl+await viewPeople();
    else if(r.view==='gifts')body=fl+await viewGifts();
    else if(r.view==='feed')body=fl+await viewFeed();
    else if(r.view==='offers')body=fl+await viewOffers();
    else if(r.view==='profile')body=fl+viewProfile();
    else body=fl+await viewList(r.view);
  }catch(err){body=`<div class="msg err">${esc(errText(err))}</div>`}
  if(my!==renderSeq)return;
  S.flash=null;app.innerHTML=header()+body;bindForms();
  if($('#fVer'))$('#vScore').textContent=needScore($('#fVer'));
}
function bindForms(){
  const on=(id,fn)=>{const el=$(id);if(el)el.addEventListener('submit',fn)};
  on('#fAuth',onAuthSubmit);on('#fPw',onPwSubmit);on('#fApp',onAppSubmit);on('#fVer',onVerSubmit);on('#fPay',onPaySubmit);on('#fProf',onProfSubmit);
  const so=$('#signOut');if(so)so.addEventListener('click',async()=>{await sb.auth.signOut();S.me=null;S.staff=[];S.authMode='signin';history.replaceState(null,'',location.pathname);render()});
}

sb.auth.onAuthStateChange((ev,session)=>{
  if(ev==='PASSWORD_RECOVERY')S.recovery=true;
  const changed=(S.session&&S.session.user.id)!==(session&&session.user.id);
  S.session=session;if(changed){S.me=null;S.staff=[]}
  if(changed||ev==='PASSWORD_RECOVERY'||ev==='INITIAL_SESSION')setTimeout(render,0);
});
</script>
</body>
</html>
