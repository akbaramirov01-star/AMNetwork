name: Generate Tajik hadith translations

on:
  push:
    branches:
      - codex/tajik-hadith-translation
    paths:
      - .github/workflows/inspect-tajik-source.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tajik-hadith-translation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate a validation batch
        run: |
          rm -f hadith/data/ai/tj/tirmidhi.json
          python3 ai_scoring/generate_hadith_static.py --book tirmidhi --source-language eng --engine google --max-items 5

      - name: Validate and save the batch
        run: |
          python3 - <<'PY'
          import json
          import re
          from pathlib import Path
          path = Path('hadith/data/ai/tj/tirmidhi.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert len(data) >= 5
          assert all(str(k).isdigit() and isinstance(v, str) and v.strip() for k, v in data.items())
          assert all(re.search(r'[А-Яа-яЁёҚқҒғӢӣҶҷҲҳӮӯ]', v) for v in data.values())
          assert all(not re.search(r'\b(\w+)(?:\s+\1){10,}', v, re.I) for v in data.values())
          print(f'Validated {len(data)} Tajik translations')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hadith/data/ai/tj/tirmidhi.json
          git commit -m "Test Tajik hadith translation quality"
          git push origin HEAD:codex/tajik-hadith-translation
