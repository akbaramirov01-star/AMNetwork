name: Generate Tajik hadith translations

on:
  push:
    branches:
      - codex/tajik-hadith-translation
    paths:
      - .github/workflows/inspect-tajik-source.yml

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/tajik-hadith-translation
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install translator dependency
        run: pip install --quiet anthropic

      - name: Generate a validation batch
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::error::ANTHROPIC_API_KEY repository secret is not set."
            exit 1
          fi
          python3 ai_scoring/generate_hadith_static.py --book tirmidhi --max-items 3

      - name: Validate and save the batch
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path('hadith/data/ai/tj/tirmidhi.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert len(data) >= 3
          assert all(str(k).isdigit() and isinstance(v, str) and v.strip() for k, v in data.items())
          print(f'Validated {len(data)} Tajik translations')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add hadith/data/ai/tj/tirmidhi.json
          git commit -m "Add initial Tajik Tirmidhi translation batch"
          git push origin HEAD:codex/tajik-hadith-translation
